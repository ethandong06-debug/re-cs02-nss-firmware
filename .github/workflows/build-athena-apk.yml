name: Build Athena LuCI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - athenawrt/phase1-p0-fixes
      - athenawrt/apk-fixed-signing
      - athenawrt/v1-html-integration
    paths:
      - "luci-app-athena-src/frontend/luci-app-athena/**"
      - "luci-app-athena-src/configs/jdcloud_re-cs-02.seed"
      - ".github/workflows/build-athena-apk.yml"

permissions:
  contents: read

concurrency:
  group: athena-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build luci-app-athena for Athena IPQ60xx
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Athena source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js for JavaScript syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static syntax and metadata checks
        shell: bash
        run: |
          set -euo pipefail
          pkg='luci-app-athena-src/frontend/luci-app-athena'
          python3 luci-app-athena-src/tools/check_frontend.py \
            luci-app-athena-src/design/AthenaWrt-V1.0-prototype-reference.html \
            "$pkg/htdocs/luci-static/resources/view/athena/index.html" \
            "$pkg/htdocs/luci-static/resources/view/athena/athena-v1-runtime.js" \
            "$pkg/root/usr/libexec/athena-v1.sh" \
            "$pkg/root/usr/share/rpcd/acl.d/luci-app-athena.json" \
            "$pkg/Makefile" \
            "$pkg/root/usr/libexec/athena-wifi-schedule.sh"
          python3 - <<'PY'
          import json, pathlib
          root=pathlib.Path('luci-app-athena-src/frontend/luci-app-athena')
          json.loads((root/'root/usr/share/luci/menu.d/luci-app-athena.json').read_text())
          json.loads((root/'root/usr/share/rpcd/acl.d/luci-app-athena.json').read_text())
          mk=(root/'Makefile').read_text()
          if 'PKG_RELEASE:=9' not in mk:
              raise SystemExit('Expected Athena V1 package release 9')
          for name in ('athena-v1.sh','athena-wifi-schedule.sh','athena-status.sh','athena-wireless.sh','athena-disk.sh','athena-nas.sh','athena-backup.sh','athena-packages.sh'):
              if name not in mk:
                  raise SystemExit('Missing packaged backend/helper: '+name)
          acl=json.loads((root/'root/usr/share/rpcd/acl.d/luci-app-athena.json').read_text())
          paths=acl['luci-app-athena']['write']['file']
          if list(paths) != ['/usr/libexec/athena-v1.sh']:
              raise SystemExit('Only athena-v1.sh may be directly executable via rpcd ACL')
          print('V1.0 menu, APK metadata and least-privilege ACL checks passed.')
          PY
      - name: Fetch pinned FileBrowser Quantum binary
        shell: bash
        run: |
          set -euo pipefail
          version='v2.0.2-stable'
          binary="/tmp/linux-arm64-filebrowser"
          curl -fL "https://github.com/gtsteffaniak/filebrowser/releases/download/${version}/linux-arm64-filebrowser" -o "${binary}"
          echo '03eac074efc1b0ef3cb39882c04eeee26027049d261b6b6706650d4ac2d8e21c  /tmp/linux-arm64-filebrowser' | sha256sum -c -
          mkdir -p luci-app-athena-src/frontend/luci-app-athena/root/usr/bin
          install -m 0755 "${binary}" luci-app-athena-src/frontend/luci-app-athena/root/usr/bin/filebrowser
          file luci-app-athena-src/frontend/luci-app-athena/root/usr/bin/filebrowser


      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev device-tree-compiler \
            zstd cpio xz-utils bzip2 zip time diffstat pkg-config autoconf automake \
            libtool help2man intltool python3-dev python3-pip libsqlite3-dev uuid-dev qemu-user-static

      - name: Smoke-test FileBrowser Quantum ARM64 CLI
        shell: bash
        run: |
          set -euo pipefail
          binary='luci-app-athena-src/frontend/luci-app-athena/root/usr/bin/filebrowser'
          qemu-aarch64-static "$binary" version
          smoke="$(mktemp -d)"
          mkdir -p "${smoke}/files"
          cat > "${smoke}/config.yaml" <<EOF
          http:
            listen: "127.0.0.1"
            port: 18081
          server:
            database:
              path: "${smoke}/filebrowser.sqlite"
            sources:
              - path: "${smoke}/files"
                config:
                  defaultEnabled: true
          auth:
            adminUsername: "admin"
            methods:
              password:
                enabled: true
          EOF
          qemu-aarch64-static "$binary" user set admin --password 'athena-ci-smoke-password' -a --no-input -c "${smoke}/config.yaml"
          test -s "${smoke}/filebrowser.sqlite"
          rm -rf "${smoke}"

      - name: Fetch ImmortalWrt build system and LuCI feed
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git immortalwrt
          cd immortalwrt
          cat > feeds.conf.default <<'EOF'
          src-git packages https://github.com/immortalwrt/packages.git
          src-git luci https://github.com/immortalwrt/luci.git
          src-git routing https://github.com/openwrt/routing.git
          src-git telephony https://github.com/openwrt/telephony.git
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Import persistent APK signing key
        shell: bash
        env:
          ATHENAWRT_APK_SIGNING_KEY: ${{ secrets.ATHENAWRT_APK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ATHENAWRT_APK_SIGNING_KEY:-}" ]; then
            echo "::error::Missing repository secret ATHENAWRT_APK_SIGNING_KEY"
            exit 1
          fi
          printf '%s\\n' "$ATHENAWRT_APK_SIGNING_KEY" > immortalwrt/private-key.pem
          chmod 600 immortalwrt/private-key.pem
          openssl pkey -in immortalwrt/private-key.pem -check -noout
          openssl pkey -in immortalwrt/private-key.pem -pubout -out immortalwrt/public-key.pem
          chmod 644 immortalwrt/public-key.pem

      - name: Prepare package-only build
        shell: bash
        run: |
          set -euo pipefail
          cp -a luci-app-athena-src/frontend/luci-app-athena immortalwrt/package/luci-app-athena
          cp luci-app-athena-src/configs/jdcloud_re-cs-02.seed immortalwrt/.config
          printf '\nCONFIG_USE_APK=y\nCONFIG_SIGN_EACH_PACKAGE=y\nCONFIG_PACKAGE_luci-app-athena=m\n' >> immortalwrt/.config
          cd immortalwrt
          make defconfig
          grep -q '^CONFIG_TARGET_qualcommax=y' .config
          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx=y' .config
          grep -q '^CONFIG_USE_APK=y' .config
          grep -q '^CONFIG_SIGN_EACH_PACKAGE=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-athena=m' .config
          test -s private-key.pem
          test -s public-key.pem

      - name: Build required host tools
        shell: bash
        run: |
          set -euo pipefail
          cd immortalwrt
          make tools/install -j2 V=s

      - name: Install target toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd immortalwrt
          make toolchain/install -j2 V=s

      - name: Compile only luci-app-athena
        shell: bash
        run: |
          set -euo pipefail
          cd immortalwrt
          make package/luci-app-athena/compile V=s -j2 2>&1 | tee ../athena-package-build.log

      - name: Verify APK and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          mapfile -t main_apks < <(find immortalwrt/bin/packages -type f -name 'luci-app-athena-*.apk' -print)
          mapfile -t i18n_apks < <(find immortalwrt/bin/packages -type f -name 'luci-i18n-athena-zh-cn-*.apk' -print)
          if [ "${#main_apks[@]}" -ne 1 ] || [ "${#i18n_apks[@]}" -ne 1 ]; then
            echo "Expected exactly one main Athena APK and one Chinese language APK." >&2
            echo "Main APK count: ${#main_apks[@]} ; Chinese language APK count: ${#i18n_apks[@]}" >&2
            find immortalwrt/bin/packages -type f -name '*.apk' -print >&2 || true
            exit 1
          fi
          cp "${main_apks[0]}" "${i18n_apks[0]}" output/
          # Publish the public half of the persistent repository signing key.
          # The private key remains only in the GitHub Actions secret and runner.
          test -s immortalwrt/public-key.pem
          cp immortalwrt/public-key.pem output/athenawrt-build-signing.pub
          openssl pkey -pubin -in output/athenawrt-build-signing.pub -noout

          # Verify package signatures against the persistent repository key.
          # The temporary key directory is isolated from any host/system trust store.
          keys_dir="$(mktemp -d)"
          trap 'rm -rf "$keys_dir"' EXIT
          install -m 0644 output/athenawrt-build-signing.pub "$keys_dir/public-key.pem"
          apk_bin="$PWD/immortalwrt/staging_dir/host/bin/apk"
          "$apk_bin" --keys-dir "$keys_dir" verify output/*.apk

          # Resolve the package's declared runtime dependency chain in a clean,
          # disposable target root. This is a simulation only: no scripts run,
          # no host files are changed, and no router is contacted.
          root="$(mktemp -d)"
          trap 'rm -rf "$keys_dir" "$root"' EXIT
          mapfile -t runtime_libs < <(find immortalwrt/bin/targets/qualcommax/ipq60xx/packages -maxdepth 1 -type f \( -name 'libgcc1-*.apk' -o -name 'libc-*.apk' \) -print | sort)
          if [ "${#runtime_libs[@]}" -ne 2 ]; then
            echo "Expected libc and libgcc1 target packages for dependency simulation." >&2
            printf '%s\\n' "${runtime_libs[@]}" >&2
            exit 1
          fi
          # Bootstrap the disposable APK database with the matching target runtime libraries.
          # A simulated transaction does not create the database, so initialize it first.
          "$apk_bin" --root "$root" --arch aarch64_cortex-a53 --keys-dir "$keys_dir" --repositories-file /dev/null --no-network add --initdb --usermode --no-scripts --no-commit-hooks "${runtime_libs[@]}"

          # Now resolve Athena's dependencies without modifying the disposable root.
          "$apk_bin" --root "$root" --arch aarch64_cortex-a53 --keys-dir "$keys_dir" --repositories-file /dev/null --no-network add --simulate --no-scripts --no-commit-hooks output/luci-app-athena-*.apk output/luci-i18n-athena-zh-cn-*.apk

          file output/*.apk | tee output/file-type.txt
          sha256sum output/*.apk output/*.pub | tee output/SHA256SUMS.txt
          stat -c '%n %s bytes' output/*.apk output/*.pub | tee output/size.txt
          tar -czf output/athena-source-build-metadata.tar.gz \
            luci-app-athena-src/frontend/luci-app-athena/Makefile \
            luci-app-athena-src/README.md

      - name: Upload APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-athena-apk
          path: |
            output/*
            athena-package-build.log
          if-no-files-found: error
          retention-days: 14

name: Build Athena LuCI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - athenawrt/phase1-p0-fixes
      - athenawrt/apk-fixed-signing
      - athenawrt/1.2.61-full-optimization
    paths:
      - "luci-app-athena-src/frontend/luci-app-athena/**"
      - "config.txt"
      - ".github/workflows/build-athena-apk.yml"

permissions:
  contents: read

concurrency:
  group: athena-apk-build
  cancel-in-progress: true

jobs:
  build:
    name: Build signed Athena APK for Athena IPQ60xx
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Athena source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js for JavaScript syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static syntax and metadata checks
        shell: bash
        run: |
          set -euo pipefail
          pkg='luci-app-athena-src/frontend/luci-app-athena'
          find "$pkg/root/usr/libexec" "$pkg/root/etc/init.d" "$pkg/root/etc/uci-defaults" -type f -print0 | while IFS= read -r -d '' f; do
            case "$f" in *.sh|*/etc/init.d/*|*/etc/uci-defaults/*) sh -n "$f" ;; esac
          done
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('luci-app-athena-src/frontend/luci-app-athena')
          for rel in ('root/usr/share/luci/menu.d/luci-app-athena.json',
                      'root/usr/share/rpcd/acl.d/luci-app-athena.json'):
              json.loads((root / rel).read_text())
          html = (root / 'htdocs/luci-static/resources/view/athena/index.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No inline JavaScript blocks found')
          pathlib.Path('/tmp/athena-inline.js').write_text('\n;\n'.join(scripts))
          print(f'Validated {len(scripts)} inline script blocks; Node syntax check follows.')
          PY
          node --check /tmp/athena-inline.js
          node --check luci-app-athena-src/frontend/luci-app-athena/htdocs/luci-static/resources/view/athena/index.js

      - name: Fetch pinned File Browser binary
        shell: bash
        run: |
          set -euo pipefail
          version='2.63.23'
          archive="/tmp/linux-arm64-filebrowser.tar.gz"
          curl -fL "https://github.com/filebrowser/filebrowser/releases/download/v${version}/linux-arm64-filebrowser.tar.gz" -o "${archive}"
          echo 'c55b3450b6ac07ef73b5b49f0b2955a8e755100b71af1df73f9e5d25b12fd27a  /tmp/linux-arm64-filebrowser.tar.gz' | sha256sum -c -
          mkdir -p /tmp/filebrowser-extract luci-app-athena-src/frontend/luci-app-athena/root/usr/bin
          tar -xzf "${archive}" -C /tmp/filebrowser-extract
          test -s /tmp/filebrowser-extract/filebrowser
          install -m 0755 /tmp/filebrowser-extract/filebrowser luci-app-athena-src/frontend/luci-app-athena/root/usr/bin/filebrowser
          file luci-app-athena-src/frontend/luci-app-athena/root/usr/bin/filebrowser

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev device-tree-compiler \
            zstd cpio xz-utils bzip2 zip time diffstat pkg-config autoconf automake \
            libtool help2man intltool python3-dev python3-pip libsqlite3-dev uuid-dev

      - name: Fetch ImmortalWrt build system and LuCI feed
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git immortalwrt
          cd immortalwrt
          cat > feeds.conf.default <<'EOF'
          src-git packages https://github.com/immortalwrt/packages.git
          src-git luci https://github.com/immortalwrt/luci.git
          src-git routing https://github.com/openwrt/routing.git
          src-git telephony https://github.com/openwrt/telephony.git
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Install the fixed APK signing key
        shell: bash
        env:
          ATHENAWRT_APK_SIGNING_KEY: ${{ secrets.ATHENAWRT_APK_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ATHENAWRT_APK_SIGNING_KEY:-}" ]; then
            echo "::error::Missing repository secret ATHENAWRT_APK_SIGNING_KEY. Add the existing P-256 PEM private key; do not generate a new key for each build."
            exit 1
          fi
          umask 077
          printf '%s\n' "$ATHENAWRT_APK_SIGNING_KEY" > /tmp/athena-private-key.pem
          openssl pkey -in /tmp/athena-private-key.pem -noout
          openssl pkey -in /tmp/athena-private-key.pem -pubout -out /tmp/athena-public-key.pem
          openssl pkey -pubin -in /tmp/athena-public-key.pem -noout
          openssl pkey -pubin -in /tmp/athena-public-key.pem -text -noout | grep -q 'prime256v1'
          install -m 0600 /tmp/athena-private-key.pem immortalwrt/private-key.pem
          install -m 0644 /tmp/athena-public-key.pem immortalwrt/public-key.pem
          install -d luci-app-athena-src/frontend/luci-app-athena/root/etc/apk/keys
          install -m 0644 /tmp/athena-public-key.pem luci-app-athena-src/frontend/luci-app-athena/root/etc/apk/keys/athenawrt-build-signing.pem
          sha256sum /tmp/athena-public-key.pem | tee /tmp/athena-public-key.sha256

      - name: Prepare package-only build
        shell: bash
        run: |
          set -euo pipefail
          cp -a luci-app-athena-src/frontend/luci-app-athena immortalwrt/package/luci-app-athena
          cp config.txt immortalwrt/.config
          printf '\nCONFIG_PACKAGE_luci-app-athena=m\nCONFIG_USE_APK=y\nCONFIG_SIGN_EACH_PACKAGE=y\n' >> immortalwrt/.config
          cd immortalwrt
          make defconfig
          grep -q '^CONFIG_TARGET_qualcommax=y' .config
          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-athena=m' .config
          grep -q '^CONFIG_USE_APK=y' .config
          grep -q '^CONFIG_SIGN_EACH_PACKAGE=y' .config
          test -s private-key.pem
          test -s public-key.pem
          if grep -q '^CONFIG_BUILDBOT=y' .config; then
            echo 'CONFIG_BUILDBOT must remain disabled so the public key is installed in the image.' >&2
            exit 1
          fi

      - name: Build required host tools
        shell: bash
        run: |
          set -euo pipefail
          cd immortalwrt
          make tools/install -j2 V=s

      - name: Install target toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd immortalwrt
          make toolchain/install -j2 V=s

      - name: Compile only luci-app-athena
        shell: bash
        run: |
          set -euo pipefail
          cd immortalwrt
          make package/luci-app-athena/compile V=s -j2 2>&1 | tee ../athena-package-build.log

      - name: Verify signed APK and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          mapfile -t apks < <(find immortalwrt/bin/packages -type f -name 'luci-app-athena*.apk' -print)
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Expected exactly one luci-app-athena APK; found ${#apks[@]}" >&2
            find immortalwrt/bin/packages -type f -name '*.apk' -print >&2 || true
            exit 1
          fi
          apk_host=immortalwrt/staging_dir/host/bin/apk
          test -x "$apk_host"
          mkdir -p output/keys
          install -m 0644 immortalwrt/public-key.pem output/keys/public-key.pem
          "$apk_host" verify --keys-dir output/keys "${apks[0]}"
          cp "${apks[0]}" output/
          install -m 0644 immortalwrt/public-key.pem output/athenawrt-build-signing.pem
          openssl pkey -pubin -in output/athenawrt-build-signing.pem -noout
          sha256sum output/*.apk output/*.pem | tee output/SHA256SUMS.txt
          stat -c '%n %s bytes' output/*.apk output/*.pem | tee output/size.txt
          file output/*.apk | tee output/file-type.txt
          tar -czf output/athena-source-build-metadata.tar.gz \
            luci-app-athena-src/frontend/luci-app-athena/Makefile \
            luci-app-athena-src/README.md

      - name: Upload APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-athena-1.2.61-fixed-signing
          path: |
            output/*
            athena-package-build.log
          if-no-files-found: error
          retention-days: 14

name: Build Athena LuCI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - athenawrt/phase1-p0-fixes
      - athenawrt/apk-fixed-signing
    paths:
      - "luci-app-athena-src/frontend/luci-app-athena/**"
      - "luci-app-athena-src/configs/jdcloud_re-cs-02.seed"
      - ".github/workflows/build-athena-apk.yml"

permissions:
  contents: read

concurrency:
  group: athena-apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build luci-app-athena for Athena IPQ60xx
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Athena source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js for JavaScript syntax validation
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Static syntax and metadata checks
        shell: bash
        run: |
          set -euo pipefail
          pkg='luci-app-athena-src/frontend/luci-app-athena'
          {
            find "$pkg/root/usr/libexec" -type f -name '*.sh' -print0
            find "$pkg/root/etc/init.d" "$pkg/root/etc/uci-defaults" "$pkg/root/etc/hotplug.d/block" -type f -print0
          } | while IFS= read -r -d '' f; do
            sh -n "$f"
          done
          python3 - <<'PY'
          import json, pathlib, re
          root = pathlib.Path('luci-app-athena-src/frontend/luci-app-athena')
          for rel in ('root/usr/share/luci/menu.d/luci-app-athena.json',
                      'root/usr/share/rpcd/acl.d/luci-app-athena.json',
                      'root/etc/config/athena'):
              p = root / rel
              if rel.endswith('.json'):
                  json.loads(p.read_text())
          html = (root / 'htdocs/luci-static/resources/view/athena/index.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          if not scripts:
              raise SystemExit('No inline JavaScript blocks found')
          out = pathlib.Path('/tmp/athena-inline.js')
          out.write_text('\n;\n'.join(scripts))

          # Verify every statically referenced backend script is installed and ACL-authorized.
          args = [x.strip().replace("\\'", "'").replace('\\"', '"')
                  for x in re.findall(r"""athenaRPC\.exec\(\s*([^,\)\n]+)""", html)]
          calls, dynamic = set(), []
          for arg in args:
              match = re.fullmatch(r"""['\"](athena-[^'\"]+\.sh)['\"]""", arg)
              if match:
                  calls.add(match.group(1))
              elif arg == 'cfg.f':
                  dynamic.append(arg)
              else:
                  dynamic.append(arg)
          confirm_targets = set(re.findall(r"""confirmApply\(\s*['\"](athena-[^'\"]+\.sh)['\"]""", html))
          if dynamic != ['cfg.f'] or confirm_targets != {'athena-mode.sh'}:
              raise SystemExit(f'Unexpected dynamic RPC targets: {dynamic}; confirmApply targets: {confirm_targets}')
          calls |= confirm_targets
          makefile = (root / 'Makefile').read_text()
          installed = set(re.findall(r"""\$\(INSTALL_BIN\)\s+\./root/usr/libexec/(athena-[^\s]+\.sh)""", makefile))
          acl = json.loads((root / 'root/usr/share/rpcd/acl.d/luci-app-athena.json').read_text())
          acl_file = acl['luci-app-athena']['write']['file']
          allowed = {p.rsplit('/', 1)[-1] for p, perms in acl_file.items()
                     if p.startswith('/usr/libexec/') and 'exec' in perms}
          internal = {'athena-status-legacy.sh', 'athena-services-legacy.sh',
                      'athena-resources-legacy.sh', 'athena-packages-legacy.sh',
                      'athena-wanip.sh', 'athena-logcap.sh'}
          orphan = {'athena-single.sh'}
          if not calls or calls - installed or calls - allowed or allowed - installed:
              raise SystemExit(f'RPC call-chain mismatch: calls={sorted(calls)}, not-installed={sorted(calls-installed)}, not-ACL={sorted(calls-allowed)}, ACL-not-installed={sorted(allowed-installed)}')
          if not internal <= installed or not orphan <= installed or orphan & calls:
              raise SystemExit('Internal helper/orphan inventory does not match Makefile installation list')
          print(f'Call-chain audit passed: {len(calls)} direct RPC scripts, {len(internal)} internal helpers, {len(orphan)} unreferenced helper.')
          print(f'Validated {len(scripts)} inline script blocks; Node syntax check follows.')
          PY
          node --check /tmp/athena-inline.js

      - name: Fetch pinned File Browser binary
        shell: bash
        run: |
          set -euo pipefail
          version='2.63.23'
          archive="/tmp/linux-arm64-filebrowser.tar.gz"
          curl -fL "https://github.com/filebrowser/filebrowser/releases/download/v${version}/linux-arm64-filebrowser.tar.gz" -o "${archive}"
          echo 'c55b3450b6ac07ef73b5b49f0b2955a8e755100b71af1df73f9e5d25b12fd27a  /tmp/linux-arm64-filebrowser.tar.gz' | sha256sum -c -
          mkdir -p /tmp/filebrowser-extract luci-app-athena-src/frontend/luci-app-athena/root/usr/bin
          tar -xzf "${archive}" -C /tmp/filebrowser-extract
          test -s /tmp/filebrowser-extract/filebrowser
          install -m 0755 /tmp/filebrowser-extract/filebrowser luci-app-athena-src/frontend/luci-app-athena/root/usr/bin/filebrowser
          file luci-app-athena-src/frontend/luci-app-athena/root/usr/bin/filebrowser

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev device-tree-compiler \
            zstd cpio xz-utils bzip2 zip time diffstat pkg-config autoconf automake \
            libtool help2man intltool python3-dev python3-pip libsqlite3-dev uuid-dev

      - name: Fetch ImmortalWrt build system and LuCI feed
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git immortalwrt
          cd immortalwrt
          cat > feeds.conf.default <<'EOF'
          src-git packages https://github.com/immortalwrt/packages.git
          src-git luci https://github.com/immortalwrt/luci.git
          src-git routing https://github.com/openwrt/routing.git
          src-git telephony https://github.com/openwrt/telephony.git
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Prepare package-only build
        shell: bash
        run: |
          set -euo pipefail
          cp -a luci-app-athena-src/frontend/luci-app-athena immortalwrt/package/luci-app-athena
          cp luci-app-athena-src/configs/jdcloud_re-cs-02.seed immortalwrt/.config
          printf '\nCONFIG_PACKAGE_luci-app-athena=m\n' >> immortalwrt/.config
          cd immortalwrt
          make defconfig
          grep -q '^CONFIG_TARGET_qualcommax=y' .config
          grep -q '^CONFIG_TARGET_qualcommax_ipq60xx=y' .config
          grep -q '^CONFIG_PACKAGE_luci-app-athena=m' .config

      - name: Build required host tools
        shell: bash
        run: |
          set -euo pipefail
          cd immortalwrt
          make tools/install -j2 V=s

      - name: Install target toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd immortalwrt
          make toolchain/install -j2 V=s

      - name: Compile only luci-app-athena
        shell: bash
        run: |
          set -euo pipefail
          cd immortalwrt
          make package/luci-app-athena/compile V=s -j2 2>&1 | tee ../athena-package-build.log

      - name: Verify APK and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          mapfile -t main_apks < <(find immortalwrt/bin/packages -type f -name 'luci-app-athena-*.apk' -print)
          mapfile -t i18n_apks < <(find immortalwrt/bin/packages -type f -name 'luci-i18n-athena-zh-cn-*.apk' -print)
          if [ "${#main_apks[@]}" -ne 1 ] || [ "${#i18n_apks[@]}" -ne 1 ]; then
            echo "Expected exactly one main Athena APK and one Chinese language APK." >&2
            echo "Main APK count: ${#main_apks[@]} ; Chinese language APK count: ${#i18n_apks[@]}" >&2
            find immortalwrt/bin/packages -type f -name '*.apk' -print >&2 || true
            exit 1
          fi
          cp "${main_apks[0]}" "${i18n_apks[0]}" output/
          # Preserve only the public half of the exact ephemeral key used by this build.
          # The private key remains inside the disposable GitHub Actions runner.
          test -s immortalwrt/public-key.pem
          cp immortalwrt/public-key.pem output/athenawrt-build-signing.pub
          openssl pkey -pubin -in output/athenawrt-build-signing.pub -noout
          file output/*.apk | tee output/file-type.txt
          sha256sum output/*.apk output/*.pub | tee output/SHA256SUMS.txt
          stat -c '%n %s bytes' output/*.apk output/*.pub | tee output/size.txt
          tar -czf output/athena-source-build-metadata.tar.gz \
            luci-app-athena-src/frontend/luci-app-athena/Makefile \
            luci-app-athena-src/README.md

      - name: Upload APK and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-athena-apk
          path: |
            output/*
            athena-package-build.log
          if-no-files-found: error
          retention-days: 14

/* V1.0 full-site refinement: strict viewport containment and accessible responsive controls */
html,body{width:100%;max-width:100%;overflow-x:hidden}
.layout,.main,.content,#view,.grid,.panel,.pad,.pagehead,.formgrid,.formfield{min-width:0;max-width:100%}
.content{width:100%;overflow-x:clip}
.grid>*{min-width:0}
.panel{overflow:hidden}
.tablewrap{width:100%;max-width:100%;overflow:visible;border:0}
.table{width:100%;min-width:0;table-layout:fixed}
.table th,.table td{white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.table th:first-child,.table td:first-child{width:27%}
.field,.formfield input,.formfield select,.formfield textarea{min-width:0;max-width:100%}
.navlink{overflow-wrap:anywhere}
.page-switcher{display:none;gap:8px;align-items:center;flex-wrap:wrap;margin:-5px 0 15px}
.page-switcher select{max-width:100%;min-width:0;flex:1;border:1px solid var(--line2);background:var(--solid);border-radius:10px;padding:9px 11px;font-size:11px}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 16px}
.subnav button{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 9px;font-size:9px;color:var(--muted);max-width:100%}
.subnav button.active{background:var(--accentSoft);border-color:transparent;color:var(--accent);font-weight:750}
.searchbox{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:7px 10px;color:var(--muted);font-size:10px;cursor:pointer}
.searchbox kbd{border:1px solid var(--line2);border-radius:5px;padding:1px 4px;font-size:9px;color:var(--faint)}
.modal-backdrop{position:fixed;inset:0;background:rgba(9,18,32,.38);backdrop-filter:blur(5px);z-index:120;display:flex;align-items:flex-start;justify-content:center;padding:12vh 16px 20px}
.modal{width:min(520px,100%);max-height:75vh;overflow:auto;border:1px solid var(--line);border-radius:18px;background:var(--solid);box-shadow:0 24px 70px #0003;padding:17px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:750;font-size:13px}
.modal input{width:100%;border:1px solid var(--line2);background:var(--soft);border-radius:11px;padding:11px 12px;outline:none;font-size:12px}
.search-results{display:grid;gap:4px;margin-top:10px}
.search-results button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:0;background:transparent;border-radius:9px;padding:9px 10px;font-size:11px}
.search-results button:hover{background:var(--accentSoft);color:var(--accent)}
.search-results small{color:var(--faint);font-size:9px}
.controlbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.controlbar .left,.controlbar .right{display:flex;gap:7px;align-items:center;flex-wrap:wrap;min-width:0}
.mini-search{width:min(210px,100%);min-width:0;border:1px solid var(--line2);background:var(--solid);border-radius:9px;padding:7px 9px;font-size:10px}
.tag{font-size:9px;border-radius:7px;padding:3px 7px;background:var(--accentSoft);color:var(--accent)}
.empty-state{padding:18px;text-align:center;color:var(--faint);font-size:10px}
.formfield input:focus,.formfield select:focus,.formfield textarea:focus,.page-switcher select:focus{border-color:var(--accent);outline:2px solid var(--accentSoft)}
.formfield input:disabled{opacity:.6}
.toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:10px}
.toggle-row:last-child{border-bottom:0}
.toggle-row small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
.toggle-control{appearance:none;width:35px;height:20px;border-radius:20px;background:var(--line2);position:relative;flex:0 0 auto;cursor:pointer}
.toggle-control:before{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:white;transition:.18s;box-shadow:0 1px 3px #0003}
.toggle-control:checked{background:var(--accent)}
.toggle-control:checked:before{left:18px}
.action-list{display:flex;flex-wrap:wrap;gap:7px}
.action-list .btn{max-width:100%;white-space:normal}
@media(max-width:820px){
 .page-switcher{display:flex}
 .searchbox{width:36px;height:36px;justify-content:center;padding:0;font-size:0}
 .searchbox kbd,.searchbox .search-label{display:none}
 .searchbox svg{width:17px;height:17px}
 .subnav{gap:5px}
 .subnav button{font-size:9px;padding:6px 8px}
}
@media(max-width:600px){
 .table{display:block}
 .table thead{display:none}
 .table tbody{display:grid;gap:8px}
 .table tr{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line);border-radius:11px;background:var(--soft);overflow:hidden}
 .table td{display:block;width:auto!important;min-width:0;border-top:0;padding:8px 9px;font-size:9px}
 .table td:first-child{grid-column:1/-1;width:auto;border-bottom:1px solid var(--line);font-size:10px}
 .table td:before{content:attr(data-label);display:block;color:var(--faint);font-size:8px;margin-bottom:3px;font-weight:600}
 .table td:first-child:before{display:none}
 .table td:nth-child(2),.table td:nth-child(3){overflow-wrap:anywhere}
 .toolbar{width:100%}.toolbar>*{min-width:0;max-width:100%}
 .page-switcher select{width:100%}
 .quickgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .topology{flex-wrap:wrap}
 .topology .node{min-width:70px}
 .topology .line{min-width:10px}
 .modal-backdrop{padding-top:8vh}
}
@media(max-width:360px){
 .content{padding-left:10px;padding-right:10px}
 .actions{gap:5px}
 .quickgrid{grid-template-columns:1fr}
 .table tr{grid-template-columns:1fr}
 .table td:first-child{grid-column:auto}
}


/* Extended Theme Customizer CSS Variables & Utility Styles */
:root {
  --sim-radius: 12px;
  --sim-blur: 22px;
  --sim-glass-opacity: 0.82;
  --sim-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  --sim-transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
}
body.font-geek {
  --sim-font-family: ui-monospace, "SF Mono", Menlo, Consolas, "PingFang SC", monospace;
  font-family: var(--sim-font-family) !important;
}
body.font-modern {
  --sim-font-family: "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  font-family: var(--sim-font-family) !important;
}
body.reduced-motion * {
  transition: none !important;
  animation: none !important;
}
.sim-panel, .sim-card, .sim-hero, .sim-router-card, .sim-status-card {
  border-radius: var(--sim-radius, 12px) !important;
  backdrop-filter: blur(var(--sim-blur, 22px)) !important;
  -webkit-backdrop-filter: blur(var(--sim-blur, 22px)) !important;
}
.sim-tab-btn {
  padding: 6px 12px;
  border: 1px solid var(--sim-border);
  border-radius: 8px;
  background: var(--soft);
  color: var(--sim-muted);
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
  white-space: nowrap;
}
.sim-tab-btn:hover {
  color: var(--sim-text);
  background: var(--accentSoft);
}
.sim-tab-btn.active {
  background: var(--accentSoft);
  border-color: var(--sim-accent);
  color: var(--sim-accent);

/* ==========================================================================
   ATHENAWRT V1.5.0 MASTER DESIGN SYSTEM: COMPONENT & TYPOGRAPHY UNIFICATION
   Unifies all fonts, buttons, inputs, selects, and controls into a clean token system.
   ========================================================================== */

:root {
  --sim-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --sim-mono-family: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --sim-h1: 16px;
  --sim-h2: 14px;
  --sim-h3: 13px;
  --sim-body: 11.5px;
  --sim-caption: 10px;
  --sim-footnote: 9px;
}

/* 1. Global Typography Normalization */
body, button, input, select, textarea {
  font-family: var(--sim-font-family) !important;
  -webkit-font-smoothing: antialiased !important;
  -moz-osx-font-smoothing: grayscale !important;
}

code, kbd, pre, .mono, [data-mono], input[type="number"], .sim-field.mono {
  font-family: var(--sim-mono-family) !important;
}

/* Headings scale */
.sim-page-head h1, .pagehead h1 {
  font-size: 16px !important;
  font-weight: 780 !important;
  letter-spacing: -0.3px !important;
  color: var(--sim-text) !important;
}

.sim-panel-head h3, .panel h3, header.sim-panel-head h3 {
  font-size: 13.5px !important;
  font-weight: 750 !important;
  letter-spacing: -0.2px !important;
  color: var(--sim-text) !important;
}

.sim-panel-head p, .panel p {
  font-size: 10.5px !important;
  line-height: 1.5 !important;
  color: var(--sim-muted) !important;
}

/* 2. Unified Button Tokens */
.sim-btn, .btn {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  gap: 6px !important;
  min-height: 34px !important;
  height: 34px !important;
  padding: 0 16px !important;
  border: 1px solid var(--sim-border) !important;
  border-radius: 9px !important;
  background: var(--solid) !important;
  color: var(--sim-text) !important;
  font-size: 11.5px !important;
  font-weight: 600 !important;
  line-height: 1 !important;
  cursor: pointer !important;
  transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1) !important;
  white-space: nowrap !important;
  box-sizing: border-box !important;
  text-decoration: none !important;
  user-select: none !important;
}

.sim-btn:hover, .btn:hover {
  border-color: var(--sim-accent) !important;
  color: var(--sim-accent) !important;
  background: var(--accentSoft) !important;
  transform: translateY(-1px) !important;
}

.sim-btn:active, .btn:active {
  transform: translateY(0) !important;
  filter: brightness(0.95) !important;
}

.sim-btn.primary, .btn.primary {
  background: var(--sim-accent) !important;
  border-color: var(--sim-accent) !important;
  color: #ffffff !important;
  box-shadow: 0 4px 12px var(--accentSoft) !important;
}
.sim-btn.primary:hover, .btn.primary:hover {
  filter: brightness(1.08) !important;
  box-shadow: 0 6px 16px var(--accentSoft) !important;
  color: #ffffff !important;
}

.sim-btn.danger, .btn.danger {
  background: #d65d63 !important;
  border-color: #d65d63 !important;
  color: #ffffff !important;
  box-shadow: 0 4px 12px rgba(214, 93, 99, 0.22) !important;
}
.sim-btn.danger:hover, .btn.danger:hover {
  filter: brightness(1.08) !important;
  color: #ffffff !important;
}

.sim-btn.secondary, .btn.secondary {
  background: var(--soft) !important;
  border-color: var(--sim-border) !important;
  color: var(--sim-muted) !important;
}
.sim-btn.secondary:hover, .btn.secondary:hover {
  color: var(--sim-text) !important;
  border-color: var(--sim-text) !important;
}

/* Button Size Hierarchy: Standard (34px), Compact (28px), Mini (24px) */
.sim-btn.sm, 
.sim-btn[style*="min-height:28px"], 
.sim-btn[style*="min-height: 28px"], 
.sim-tab-btn,
button.sim-tab-btn {
  min-height: 28px !important;
  height: 28px !important;
  padding: 0 12px !important;
  font-size: 10.5px !important;
  border-radius: 8px !important;
}

.sim-btn.xs, 
.sim-btn[style*="min-height:22px"], 
.sim-btn[style*="min-height: 22px"], 
.sim-btn[style*="min-height:24px"], 
.sim-btn[style*="min-height: 24px"],
.sim-btn[style*="padding:2px 8px"],
.sim-btn[style*="padding:3px 2px"] {
  min-height: 24px !important;
  height: 24px !important;
  padding: 0 8px !important;
  font-size: 9.5px !important;
  border-radius: 6px !important;
}

/* 3. Unified Input Fields */
input[type="text"], 
input[type="number"],

     const matches=allPages.filter(x=>(x.page+' '+x.group+' '+(desc[x.page]||'')).toLowerCase().includes(q)).slice(0,18);
     results.innerHTML=matches.length?matches.map(x=>'<button type="button" data-result="'+x.page.replace(/"/g,'&quot;')+'"><span>'+x.page+'</span><small>'+x.group+'</small></button>').join(''):'<div class="empty-state">没有找到匹配页面</div>';
     results.querySelectorAll('button').forEach(b=>b.onclick=()=>{render(b.dataset.result);closeModal()});
   }
   input.addEventListener('input',fill);fill();input.focus();
   back.querySelector('#closeSearch').onclick=closeModal;
   back.addEventListener('click',e=>{if(e.target===back)closeModal()});
 }
 function closeModal(){if(activeModal){activeModal.remove();activeModal=null;}const sm=document.getElementById('simModal');if(sm)sm.remove();}

 document.addEventListener('keydown',e=>{
   if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}
   if(e.key==='Escape')closeModal();
 });
 // Current module switch on mobile always lands on its overview page; subpage selector exposes every child.
 document.querySelectorAll('[data-mobile]').forEach(b=>b.addEventListener('click',()=>{const g=groups.find(x=>x.name===b.dataset.mobile);if(g)render(g.pages[0])}));
 // Auto theme follows system unless user explicitly selects a fixed theme.
 const themeButton=document.getElementById('theme');
 let themeMode=localStorage.getItem('athena-theme-mode')||'auto';
 function applyTheme(){
   const next=themeMode==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):themeMode;
   document.documentElement.dataset.theme=next;
   themeButton.title='当前主题：'+(themeMode==='auto'?'自动':themeMode==='dark'?'深色':'浅色')+'；点击切换';
 }
 themeButton.onclick=()=>{
   themeMode=themeMode==='auto'?'light':themeMode==='light'?'dark':'auto';
   localStorage.setItem('athena-theme-mode',themeMode);applyTheme();
   toast('主题模式：'+(themeMode==='auto'?'自动跟随系统':themeMode==='light'?'浅色':'深色'));
 };
 const mq=matchMedia('(prefers-color-scheme: dark)');
 if(mq.addEventListener)mq.addEventListener('change',()=>{if(themeMode==='auto')applyTheme()});
 applyTheme();
 // Refresh is intentionally explicit that this is a disconnected prototype.
 
 // Expose a viewport overflow diagnostic in the console for local design QA.
 window.athenaLayoutCheck=()=>({viewport:document.documentElement.clientWidth,document:document.documentElement.scrollWidth,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth});
})();

function esc2(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast2(s){if(typeof toast==='function')toast(s);else console.log(s)}
function makeTable(spec,page){
const rows=spec.rows||[];
return `<div class="table-actions"><input class="field" type="search" placeholder="筛选当前列表…" data-table-filter><select class="field" data-table-status><option value="">全部状态</option><option>待读取</option><option>待检测</option><option>受保护</option><option>未接入</option></select><button class="btn" data-export>导出列表</button></div><div class="tablewrap"><table class="data-table"><thead><tr>${spec.table.map(x=>`<th>${esc2(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td data-label="${esc2(spec.table[i])}">${esc2(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="psub" style="margin-top:8px">列表字段已定义；当前显示“待读取”占位，不代表设备实时数据。</div>`;
}
function makePanel(title,detail,i){
let body='';
if(/趋势|吞吐|流量/.test(title))body=`<div class="mini-chart">${[24,37,31,52,44,66,58,73,62,82,69,90].map((h)=>`<i style="--h:${h}%"></i>`).join('')}</div><div class="chart-labels"><span>历史采样待接入</span><span>实时数据不可用</span></div>`;
else if(/拓扑/.test(title))body=`<div class="topology"><div class="node"><div class="nodeicon">光</div><div class="nodename">光猫</div><div class="nodestate">待检测</div></div><div class="line"></div><div class="node"><div class="nodeicon">路</div><div class="nodename">Athena</div><div class="nodestate">本机</div></div><div class="line"></div><div class="node"><div class="nodeicon">网</div><div class="nodename">交换机 / AP</div><div class="nodestate">待检测</div></div></div><div class="psub">链路关系为结构示意，真实状态须由接口与邻居数据确认。</div>`;
else body=`<div class="info-banner">${esc2(detail)}<br><strong>当前状态：</strong>待接入真实设备数据</div><div class="status-line"><span class="status-name">数据来源</span><span class="status-value">设备接口 / 系统服务</span></div><div class="status-line"><span class="status-name">可用状态</span><span class="status-value"><i class="status-dot"></i>待读取</span></div>`;
return `<section class="panel pad"><div class="panelhead"><div><div class="ptitle">${esc2(title)}</div><div class="psub">模块信息 · ${i+1}</div></div><span class="pill">未连接设备</span></div>${body}</section>`;
}
function makeControls(page){
const fields=fieldSets[page];if(!fields)return '';
const controls=fields.map(([label,type],i)=>{
let el=type==='select'?`<select data-draft><option>请选择</option>${(label==='主题模式'?['自动跟随系统','浅色','深色']:label==='加密方式'?['WPA2-PSK','WPA2/WPA3','WPA3-SAE']:label==='频宽'?['自动','20 MHz','40 MHz','80 MHz','160 MHz']:label==='控制策略'?['允许','拒绝','按时间计划']:label==='设备类型'?['手机','电脑','平板','电视','IoT','其他']:label==='启用状态'?['启用','停用']:['自动','手动']).map(x=>`<option>${x}</option>`).join('')}</select>`:type==='number'?`<input type="number" data-draft placeholder="待读取当前值">`:`<input type="text" data-draft placeholder="待读取当前值">`;

const pageTitle=p=>pageData[p]?.title||p;
function getSpeedUnit() {
  const u = localStorage.getItem('athena-speed-unit') || 'Mbps'; // 'Mbps', 'MB/s', 'KB/s'
  if (u === 'auto') return 'Mbps';
  return u;
}
function getTrafficUnit() {
  return localStorage.getItem('athena-traffic-unit') || 'auto';
}
function getRatePrecision() {
  return Number(localStorage.getItem('athena-rate-precision') || '1');
}
function getSamplingInterval() {
  return Number(localStorage.getItem('athena-sampling-interval') || '1000'); // in ms
}

function fmtRate(n) {
  const unit = getSpeedUnit();
  const prec = getRatePrecision();
  
  if (unit === 'MB/s') {
    // Pure fixed MB/s (1 MB/s = 8 Mbps), strictly no adaptive unit jumping
    const bv = n / 8;
    return bv.toFixed(prec) + ' MB/s';
  } else if (unit === 'KB/s') {
    // Pure fixed KB/s ((Mbps / 8) * 1024), strictly no adaptive unit jumping
    const kb = (n / 8) * 1024;
    return kb.toFixed(0) + ' KB/s';
  } else {
    // Standard pure fixed Mbps, strictly no adaptive unit jumping
    return n.toFixed(prec) + ' Mbps';
  }
}

function fmtBytes(n) {
  const tu = getTrafficUnit();
  const prec = getRatePrecision();
  if (tu === 'MB') {
    return (n * 1024).toFixed(0) + ' MB';
  }
  return n.toFixed(prec) + ' GB';
}

    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></svg>`;

window.applySpeedUnit = function(unit, btn) {
  localStorage.setItem('athena-speed-unit', unit);
  document.querySelectorAll('.gs-unit-btn').forEach(b => b.classList.remove('primary'));
  if (btn) btn.classList.add('primary');
  renderPage(current);
  toast('网速单位已固定为 ' + unit + '，全站即时同步！');
};

window.handleZoomSlider = function(val) {
  const badge = document.getElementById('zoomValueBadge');
  if (badge) badge.textContent = val + '%';
  applyGlobalZoomValue(val);
};

window.setZoomPreset = function(val) {
  const slider = document.getElementById('globalZoomSlider');
  if (slider) slider.value = val;
  const badge = document.getElementById('zoomValueBadge');
  if (badge) badge.textContent = val + '%';
  applyGlobalZoomValue(val);
  toast('界面缩放比例已设置为 ' + val + '%');
};

function applyGlobalZoomValue(val) {
  localStorage.setItem('athena-global-zoom', val);
  const zNum = Number(val) / 100;
  document.documentElement.style.zoom = zNum === 1 ? '' : zNum;
}

window.applySamplingInterval = function(intervalMs, btn) {
  localStorage.setItem('athena-sampling-interval', intervalMs);
  document.querySelectorAll('.gs-interval-btn').forEach(b => b.classList.remove('primary'));
  if (btn) btn.classList.add('primary');
  
  if (window.restartSimulationLoop) {
    window.restartSimulationLoop();
  }
  toast('数据采集速度已更新为 ' + (Number(intervalMs)/1000) + ' 秒/次');
};

window.toggleMotionMode = function(reduced) {
  const mode = reduced ? 'reduced' : 'normal';
  localStorage.setItem('athena-motion-mode', mode);
  if (reduced) {
    document.body.classList.add('reduce-motion');
  } else {
    document.body.classList.remove('reduce-motion');
  }
  toast(reduced ? '已开启极速无动效模式' : '已恢复平滑拟态流光动效');
};

window.resetAllGlobalPrefs = function() {
  localStorage.setItem('athena-speed-unit', 'Mbps');
  localStorage.setItem('athena-global-zoom', '100');
  localStorage.setItem('athena-sampling-interval', '1000');
  localStorage.setItem('athena-motion-mode', 'normal');

  document.documentElement.style.zoom = '';
  document.body.classList.remove('reduce-motion');

  if (window.restartSimulationLoop) {
    window.restartSimulationLoop();
  }

  closeModal();
  renderPage(current);
  toast('已恢复默认全局设置：Mbps 单位 · 100% 缩放 · 1秒采样');
};

// Auto-restore zoom, sampling rate, and motion on boot
(function initGlobalPrefsOnBoot() {
  const z = localStorage.getItem('athena-global-zoom');
  if (z && z !== '100') {
    document.documentElement.style.zoom = Number(z) / 100;
  }
  if (localStorage.getItem('athena-motion-mode') === 'reduced') {
    document.body.classList.add('reduce-motion');
  }
})();

function kpi(label,value,unit,delta,ic='',action='') {
  const isClick = !!action;

  </article>`;
}
function chartSvg(values,color='var(--accent)'){let w=600,h=150,p=6,max=Math.max(...values)*1.15,min=0;let pts=values.map((v,i)=>`${p+i*(w-2*p)/(values.length-1)},${h-p-(v-min)/(max-min)*(h-2*p)}`).join(' ');let area=`${p},${h} ${pts} ${w-p},${h}`;return `<svg class="sim-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><defs><linearGradient id="chartFill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".25"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><polygon points="${area}" fill="url(#chartFill)"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function dualChartSvg(a,b){let w=600,h=150,p=6,max=Math.max(...a,...b)*1.15;const pts=v=>v.map((n,i)=>`${p+i*(w-2*p)/(v.length-1)},${h-p-n/max*(h-2*p)}`).join(' ');return `<svg class="sim-chart" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts(a)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/><polyline points="${pts(b)}" fill="none" stroke="var(--green)" stroke-width="2.5" stroke-linecap="round"/></svg>`}
function bars(items){return `<div class="sim-bars">${items.map(x=>`<div class="sim-bar-row"><span>${x[0]}</span><div><i style="width:${clamp(x[1],0,100)}%"></i></div><b>${x[2]}</b></div>`).join('')}</div>`}
function table(headers,rows,opts={}){return `<div class="sim-table-wrap"><table class="sim-table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr data-row-search="${esc(r.join(' ')).toLowerCase()}">${r.map((c,j)=>`<td data-label="${headers[j]}">${c}</td>`).join('')}${opts.action?`<td data-label="操作"><button class="sim-link" data-row-action="${i}">${opts.action}</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function row(label,value,sub='',action=''){
  const isClick = !!action;
  const hasControl = typeof value === 'string' && (value.includes('<input') || value.includes('<select') || value.includes('sim-field') || value.includes('<button') || value.includes('type="time"'));
  const valHtml = hasControl ? value : `<b>${value}</b>`;
  return `<div class="sim-info-row ${isClick?'clickable':''} ${hasControl?'form-row':''}" ${isClick?`onclick="${action}" style="cursor:pointer;" title="点击跳转"`:''}>

      <span>${label}</span>
      ${sub?`<small>${sub}</small>`:''}

}
function progress(label,val,color=''){return `<div class="sim-progress"><div><span>${label}</span><b>${val}%</b></div><i><em style="width:${val}%;${color?`background:${color}`:''}"></em></i></div>`}
function miniDevice(type,name,sub,status='在线'){return `<div class="sim-device"><div class="sim-device-icon">${getDeviceTypeSvg(type)}</div><div class="sim-device-text"><b>${esc(name)}</b><small>${esc(sub)}</small></div>${badge(status,status==='在线'?'good':'muted')}</div>`}
function statHeader(group,page){return `<div class="sim-page-head"><div><div class="sim-eyebrow">ATHENAWRT <span>/</span> ${group.toUpperCase()} <span>/</span> RE-CS-02</div><h1>${esc(pageTitle(page))}</h1><p>${esc(pageData[page]?.desc||'设备状态与管理')}</p></div><div class="sim-head-status">${badge(window.AthenaProvider && window.AthenaProvider.mode==='device' ? '● 实机运行中' : '演示模式', 'good')}<span>更新于 <b id="lastUpdated">${stamp()}</b></span></div></div>`}
const pageMeta=window.pageMeta||{}; function groupFor(page){return pageMeta[page]||'总览'}
let expandedGroups = new Set();
function sidebar() {
  const nav = $('#sidebarNav');
  if (!nav) return;
  
  // Ensure the active group is expanded
  const activeGrp = groupFor(current);
  if (activeGrp && activeGrp !== '总览') {
    expandedGroups.add(activeGrp);
  }

  nav.innerHTML = groups.map(g => {
    // Single page group (e.g. 总览 -> 首页仪表盘)
    if (g.pages.length === 1 && g.name === '总览') {
      const isAct = current === g.pages[0];
      return `<div class="sim-nav-group">
        <button type="button" class="sim-nav-single ${isAct ? 'active' : ''}" onclick="renderPage('${esc(g.pages[0])}')" data-sim-page="${esc(g.pages[0])}">
          <span>${icon(groupIcon[g.name])}</span>
          <b>${esc(g.pages[0])}</b>
        </button>
      </div>`;
    }

    const isOpen = expandedGroups.has(g.name);
    const isCurGroup = activeGrp === g.name;

    return `<div class="sim-nav-group">
      <div class="sim-nav-title ${isOpen ? 'open' : ''} ${isCurGroup ? 'active-group' : ''}" onclick="toggleNavGroup('${g.name}')">
        <div class="title-left">
          <span>${icon(groupIcon[g.name])}</span>
          <b>${g.name}</b>
        </div>
        <span class="title-arrow">›</span>
      </div>
      ${isOpen ? `
        <div class="sim-nav-sub-items">
          ${g.pages.map(p => `
            <button type="button" class="sim-nav-item ${p === current ? 'active' : ''}" onclick="renderPage('${esc(p)}')" data-sim-page="${esc(p)}">
              ${esc(p)}
            </button>
          `).join('')}
        </div>
      ` : ''}
    </div>`;
  }).join('');

  const mNav = $('#mobileNav');
  if (mNav) {
    mNav.innerHTML = groups.map(g => `
      <button type="button" data-sim-group="${g.name}" class="${activeGrp === g.name ? 'active' : ''}">
        <span>${icon(groupIcon[g.name])}</span>
        <small>${g.name}</small>
      </button>
    `).join('');
  }
}

window.toggleNavGroup = function(gName) {
  const g = groups.find(x => x.name === gName);
  if (!g) return;
  const isCurGroup = groupFor(current) === gName;

  if (isCurGroup) {
    // Already inside this group: toggle collapse/expand of its submenu
    if (expandedGroups.has(gName)) {
      expandedGroups.delete(gName);
    } else {
      expandedGroups.add(gName);
    }
    sidebar();
  } else {
    // Navigating from another group: expand this group AND immediately open its first page!
    expandedGroups = new Set([gName]);
    if (g.pages && g.pages.length > 0) {
      renderPage(g.pages[0]);
    } else {
      sidebar();
    }
  }
};

function pageTabs(page){const group=groups.find(g=>g.name===groupFor(page));if(!group||group.pages.length<=1)return '';return `<div class="sim-page-tabs">${group.pages.map(p=>`<button type="button" class="${p===page?'active':''}" onclick="renderPage('${esc(p)}')" data-sim-page="${esc(p)}">${esc(p)}</button>`).join('')}</div>`}

function clientsTable(clients){
  const headers = ['设备', 'IP 地址', '接入方式', '信号', '下载', '上传', '状态', '操作'];
  return `<div class="sim-table-wrap"><table class="sim-table">
    <thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead>
    <tbody>${clients.map((c, i) => `
      <tr data-row-search="${esc([c.name, c.ip, c.mac, c.vendor].join(' ')).toLowerCase()}">
        <td data-label="设备">${deviceThumb(c.type, c.name, c.vendor + " · " + c.mac)}</td>
        <td data-label="IP 地址"><code>${c.ip}</code></td>
        <td data-label="接入方式">${c.link}</td>
        <td data-label="信号">${c.status === '已拉黑' ? '<span style="color:var(--red);font-weight:600;">已阻断</span>' : c.status === '离线' ? '<span style="color:var(--sim-muted);">离线</span>' : c.rssi === null ? '有线直连' : c.rssi + ' dBm'}</td>
        <td data-label="下载">${c.status === '在线' ? `<b style="color:var(--sim-accent);">${fmtRate(c.down)}</b>` : '—'}</td>
        <td data-label="上传">${c.status === '在线' ? `<b style="color:var(--sim-green);">${fmtRate(c.up)}</b>` : '—'}</td>
        <td data-label="状态">${badge(c.status, c.status === '在线' ? 'good' : c.status === '已拉黑' ? 'danger' : 'muted')}</td>
        <td data-label="操作">
          <div style="display:flex;gap:6px;justify-content:flex-end;">
            ${c.status === '已拉黑' ?
              `<button type="button" class="sim-link" style="color:var(--sim-green);font-weight:700;" onclick="toggleClientBlacklist('${c.ip}')">移出</button>` :
              `<button type="button" class="sim-link" style="color:var(--red);" onclick="toggleClientBlacklist('${c.ip}')">拉黑</button>`
            }
            <button type="button" class="sim-link" onclick="openClientDetailModal('${c.ip}')">详情</button>
          </div>
        </td>
      </tr>
    `).join('')}</tbody>
  </table></div>`;
}

window.saveClientLimit = function(ip) {
  const c = state.clients.find(x => x.ip === ip) || state.clients[0];
  const dVal = (document.getElementById('custom-down-val')?.value || '50').trim();
  const uVal = (document.getElementById('custom-up-val')?.value || '10').trim();
  c.limitDown = dVal;
  c.limitUp = uVal;
  closeModal();
  toast('已成功应用限速：下行 ' + (dVal === '0' ? '不限速' : dVal + ' Mbps') + ' / 上行 ' + (uVal === '0' ? '不限速' : uVal + ' Mbps'));
};

window.addClientToParental = function(ip) {
  const c = state.clients.find(x => x.ip === ip) || state.clients[0];
  if (!state.parentalRules) state.parentalRules = [];
  const existing = state.parentalRules.find(r => r.ip === c.ip || r.mac === c.mac);
  if (!existing) {
    state.parentalRules.unshift({
      name: c.name,
      mac: c.mac,
      ip: c.ip,
      timeStart: '21:30',
      timeEnd: '07:00',
      days: '周一至周五',
      status: '已生效'
    });
  }
  closeModal();
  renderPage('家长控制');
  toast('已将 ' + c.name + ' 添加至家长控制受控名单并跳转生效');
};

window.removeParentalRule = function(idx) {
  if (state.parentalRules && state.parentalRules[idx]) {
    const name = state.parentalRules[idx].name;
    state.parentalRules.splice(idx, 1);
    renderPage('家长控制');
    toast('已解除 ' + name + ' 的家长控制规则');

};

window.removeParentalRuleByIp = function(ip) {
  if (state.parentalRules) {
    const idx = state.parentalRules.findIndex(r => r.ip === ip);
    if (idx !== -1) {
      const name = state.parentalRules[idx].name;
      state.parentalRules.splice(idx, 1);
      closeModal();
      renderPage(current);

  closeModal();

};

window.addManualParentalRule = function() {
  const devSelect = document.getElementById('parental-device-select');

  const c = state.clients.find(x => x.ip === selIp) || state.clients[0];
  const tStart = document.getElementById('parental-start-time')?.value || '21:30';

    ip: c.ip,

  });

};

async function commandHandler(cmd){

window.drawAthenaMatrix = function() {
  const canvas = document.getElementById('athenaMatrixCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  if (!ctx) return;

  const W = canvas.width; // 460
  const H = canvas.height; // 100
  ctx.clearRect(0, 0, W, H);

  // Deep dark display glass background
  ctx.fillStyle = '#06080e';
  ctx.fillRect(0, 0, W, H);

  // 1. Determine string to render
  let text = '08:26';
  if (matrixState.chan === 'time') {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    const colon = (Math.floor(Date.now() / 1000) % 2 === 0) ? ':' : ' ';
    text = hh + colon + mm;
  } else if (matrixState.chan === 'score') {
    text = '* 168';
  } else if (matrixState.chan === 'up') {
    const spd = state.traffic ? (state.traffic.up).toFixed(1) + 'M' : '14.8M';
    text = '^ ' + spd;
  } else if (matrixState.chan === 'down') {
    const spd = state.traffic ? (state.traffic.down).toFixed(1) + 'M' : '82.5M';
    text = 'v ' + spd;
  } else if (matrixState.chan === 'weather') {
    text = '~ 26oC';
  } else if (matrixState.chan === 'clients') {
    const cnt = (state.clients || []).length;
    text = cnt + ' DEV';
  } else if (matrixState.chan === 'custom') {
    text = (matrixState.customText || 'ATHENA').toUpperCase();
  }

  // 2. Build 5x28 grid
  const COLS = 28;
  const ROWS = 5;
  const grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));

  const strCols = [];
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    const glyph = ATHENA_FONT[ch] || ATHENA_FONT[' '] || ['000','000','000','000','000'];
    const glyphWidth = glyph[0].length;
    for (let c = 0; c < glyphWidth; c++) {
      const colData = [];
      for (let r = 0; r < ROWS; r++) {
        colData.push(glyph[r][c] === '1' ? 1 : 0);
      }
      strCols.push(colData);
    }
    // 1 column spacing between characters
    if (i < text.length - 1 && ch !== ' ') {
      strCols.push([0, 0, 0, 0, 0]);
    }
  }

  // Center strCols in 28 columns
  const startCol = Math.max(0, Math.floor((COLS - strCols.length) / 2));
  for (let c = 0; c < strCols.length && (startCol + c) < COLS; c++) {
    for (let r = 0; r < ROWS; r++) {
      grid[r][startCol + c] = strCols[c][r];
    }
  }

  // 3. Render 5x28 LED dots on Canvas
  const spacingX = 14.5;
  const spacingY = 15;
  const radius = 4.2;
  const offsetX = (W - (COLS - 1) * spacingX) / 2;
  const offsetY = (H - (ROWS - 1) * spacingY) / 2;

  const isPower = matrixState.power;
  const bright = matrixState.bright; // 0 - 7
  const normBright = bright / 7;
  const alpha = isPower && bright > 0 ? (0.35 + normBright * 0.65) : 0;
  const blur = isPower && bright > 0 ? (2 + normBright * 8) : 0;

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const cx = offsetX + c * spacingX;
      const cy = offsetY + r * spacingY;
      const isLit = isPower && bright > 0 && grid[r][c] === 1;

      // Draw dark socket ring
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fillStyle = '#111624';
      ctx.fill();
      ctx.strokeStyle = '#0a0d17';
      ctx.lineWidth = 1;
      ctx.stroke();

      if (isLit) {
        // Outer glow
        ctx.save();
        ctx.shadowColor = `rgba(255, 255, 255, ${0.4 + normBright * 0.55})`;
        ctx.shadowBlur = blur;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
        ctx.fill();

        // High-intensity white core
        ctx.shadowBlur = 0;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.6, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.restore();
      }
    }
  }
};

window.setLedBright = function(v) {
  matrixState.bright = parseInt(v, 10);
  window.drawAthenaMatrix?.();
  const label = document.getElementById('matrixBrightLabel');
  if (label) {
    label.textContent = `${matrixState.bright} 级 ${matrixState.bright===0?'(熄屏)':matrixState.bright===1?'(夜间微光)':matrixState.bright===7?'(日光极亮)':''}`;
  }
  const badge = document.getElementById('matrixStatusBadge');
  if (badge && matrixState.power) {
    badge.innerHTML = `<span style="width:6px;height:6px;border-radius:50%;background:#00e676;box-shadow:0 0 6px #00e676;"></span> 点阵屏在线 (${matrixState.bright}级)`;
  }
  const kpiVals = document.querySelectorAll('.sim-kpi-value');
  if (kpiVals && kpiVals[1]) {
    kpiVals[1].textContent = 'LV.' + matrixState.bright;
  }
};

function startMatrixLoop() {
  stopMatrixLoop();
  if (!matrixState.autoLoop) return;
  matrixLoopTimer = setInterval(() => {
    if (!matrixState.autoLoop || !matrixState.power) return;
    const items = matrixState.loopItems && matrixState.loopItems.length > 0 ? matrixState.loopItems : ['time'];
    const curIdx = items.indexOf(matrixState.chan);
    const nextIdx = (curIdx + 1) % items.length;
    matrixState.chan = items[nextIdx];
    document.querySelectorAll('#matrixChanGroup [data-matrix-chan]').forEach(btn => {
      btn.classList.toggle('primary', btn.dataset.matrixChan === matrixState.chan);
    });
    window.drawAthenaMatrix?.();
    const kpiVals = document.querySelectorAll('.sim-kpi-value');
    if (kpiVals && kpiVals[2]) {
      kpiVals[2].textContent = matrixState.chan.toUpperCase() + ' (轮播)';
    }
  }, (matrixState.loopInterval || 5) * 1000);
}

function stopMatrixLoop() {
  if (matrixLoopTimer) {
    clearInterval(matrixLoopTimer);
    matrixLoopTimer = null;
  }
}

window.toggleLedNightMode = function(enabled) {
  matrixState.nightModeEnabled = !!enabled;
  const fields = document.getElementById('matrixNightConfigFields');
  if (fields) fields.style.display = matrixState.nightModeEnabled ? 'flex' : 'none';
  const badge = document.getElementById('matrixNightBadge');
  if (badge) {
    badge.className = `sim-badge ${matrixState.nightModeEnabled ? 'good' : 'muted'}`;
    badge.textContent = matrixState.nightModeEnabled ? '● 夜间护眼生效中' : '○ 已关闭';
  }
  toast(matrixState.nightModeEnabled ? '已开启夜间自定义模式 (' + matrixState.nightStart + ' ~ ' + matrixState.nightEnd + ')' : '已关闭夜间免打扰模式');
};

window.setLedNightTime = function(type, val) {
  if (type === 'start') matrixState.nightStart = val || '22:00';
  if (type === 'end') matrixState.nightEnd = val || '07:00';
  toast('已更新夜间时段为：' + matrixState.nightStart + ' ~ ' + matrixState.nightEnd);
};

window.setLedNightAction = function(act) {
  matrixState.nightAction = act || 'dim';
  toast('已设置夜间策略：' + (matrixState.nightAction === 'dim' ? '自动降为 1 级微光' : '彻底熄屏休眠 (0 级)'));
};

window.toggleLedNightAmbient = function(val) {
  matrixState.nightAmbientOff = !!val;
  toast('已' + (matrixState.nightAmbientOff ? '开启' : '关闭') + '夜间同步熄灭氛围灯策略');
};

window.toggleLedAutoLoop = function() {
  matrixState.autoLoop = !matrixState.autoLoop;
  const btn = document.getElementById('matrixAutoLoopToggleBtn');
  if (btn) {
    btn.className = `sim-btn ${matrixState.autoLoop ? 'primary' : ''}`;
    btn.textContent = matrixState.autoLoop ? '✓ 自动轮播中' : '已暂停 (单屏固定)';
  }
  const kpiVals = document.querySelectorAll('.sim-kpi-value');
  if (kpiVals && kpiVals[2]) {
    kpiVals[2].textContent = matrixState.chan.toUpperCase() + (matrixState.autoLoop ? ' (轮播)' : '');
  }
  if (matrixState.autoLoop) {
    startMatrixLoop();
    toast('已开启点阵屏多屏自动轮播 (' + matrixState.loopInterval + '秒/屏)');
  } else {
    stopMatrixLoop();
    toast('已暂停轮播，固定在当前 ' + matrixState.chan.toUpperCase() + ' 频道');
  }
};

window.setLedLoopInterval = function(sec) {
  matrixState.loopInterval = parseInt(sec, 10) || 5;
  if (matrixState.autoLoop) {
    startMatrixLoop();
  }
  toast('已设置轮播单屏停留时间为 ' + matrixState.loopInterval + ' 秒');
};

window.toggleLedLoopItem = function(item) {
  if (!matrixState.loopItems) matrixState.loopItems = ['time', 'score', 'up', 'down', 'weather', 'clients'];
  const idx = matrixState.loopItems.indexOf(item);
  if (idx !== -1) {
    if (matrixState.loopItems.length <= 1) {
      toast('至少需要保留一个轮播频道');
      const chk = document.querySelector(`input[data-loop-item="${item}"]`);
      if (chk) chk.checked = true;
      return;
    }
    matrixState.loopItems.splice(idx, 1);
  } else {
    matrixState.loopItems.push(item);
  }
  toast('已更新轮播频道清单 (共 ' + matrixState.loopItems.length + ' 个频道)');
};

window.setLedChan = function(ch) {
  matrixState.chan = ch;
  // 1. Update channel button active classes immediately
  document.querySelectorAll('#matrixChanGroup [data-matrix-chan]').forEach(btn => {
    btn.classList.toggle('primary', btn.dataset.matrixChan === ch);
  });
  // 2. Also unselect custom apply button if not custom
  const customBtn = document.getElementById('matrixCustomApplyBtn');
  if (customBtn) customBtn.classList.toggle('primary', ch === 'custom');
  // 3. Redraw canvas immediately
  window.drawAthenaMatrix?.();
  // 4. Update KPI card
  const kpiVals = document.querySelectorAll('.sim-kpi-value');
  if (kpiVals && kpiVals[2]) {
    kpiVals[2].textContent = ch.toUpperCase();
  }
  toast('已切换点阵屏显示频道：' + ch.toUpperCase());
};

window.setLedCustomText = function(val) {
  matrixState.customText = val || '';
  if (matrixState.chan === 'custom') {
    window.drawAthenaMatrix?.();
  }
};

window.setLedAmbientColor = function(col) {
  matrixState.bottomColor = col;
  // 1. Update button active classes immediately
  document.querySelectorAll('#ambientColorGroup [data-ambient-color]').forEach(btn => {
    btn.classList.toggle('primary', btn.dataset.ambientColor === col);
  });
  // 2. Update hardware light bar
  const bar = document.getElementById('athenaAmbientBar');
  if (bar) {
    bar.style.background = col;
    bar.style.boxShadow = `0 0 14px ${col}, 0 0 28px ${col}`;
  }
  // 3. Update KPI card
  const kpiVals = document.querySelectorAll('.sim-kpi-value');
  if (kpiVals && kpiVals[3]) {
    kpiVals[3].textContent = col === '#0080ff' ? '极光蓝' : col === '#00e676' ? '疾速绿' : col === '#ff9500' ? '暖金橙' : '告警红';
  }
  const name = col === '#0080ff' ? '极光蓝' : col === '#00e676' ? '疾速绿' : col === '#ff9500' ? '暖金橙' : '告警红';
  toast('已切换底部氛围灯颜色：' + name);
};

window.toggleLedPower = function() {
  matrixState.power = !matrixState.power;
  // 1. Update power button
  const pBtn = document.getElementById('matrixPowerBtn');
  if (pBtn) {
    pBtn.className = `sim-btn ${matrixState.power ? 'danger' : 'primary'}`;
    pBtn.textContent = matrixState.power ? '🌙 休眠点阵屏' : '☀️ 点亮点阵屏';
  }
  // 2. Update status badge
  const badge = document.getElementById('matrixStatusBadge');
  if (badge) {
    badge.style.color = matrixState.power ? '#00e676' : '#94a3b8';
    badge.innerHTML = `<span style="width:6px;height:6px;border-radius:50%;background:${matrixState.power ? '#00e676' : '#94a3b8'};box-shadow:${matrixState.power ? '0 0 6px #00e676' : 'none'};"></span> ${matrixState.power ? '点阵屏在线 (' + matrixState.bright + '级)' : '已休眠'}`;
  }
  // 3. Update KPI card
  const kpiVals = document.querySelectorAll('.sim-kpi-value');
  if (kpiVals && kpiVals[0]) {
    kpiVals[0].textContent = matrixState.power ? '运行中' : '已休眠';
  }
  // 4. Redraw canvas
  window.drawAthenaMatrix?.();
  toast(matrixState.power ? '点阵屏已唤醒点亮' : '点阵屏已进入休眠熄屏状态');
};

window.toggleRebootSchedule = function(enabled) {
  if (!state.rebootSchedule) state.rebootSchedule = {};
  state.rebootSchedule.enabled = !!enabled;
  const fields = document.getElementById('rebootSchedConfigFields');
  if (fields) fields.style.display = state.rebootSchedule.enabled ? 'flex' : 'none';
  const badge = document.getElementById('rebootSchedBadge');
  const s = state.rebootSchedule;
  if (badge) {
    badge.className = `sim-badge ${s.enabled ? 'good' : 'muted'}`;
    badge.textContent = s.enabled ? `● 每${s.freq==='daily'?'天':s.freq==='weekly'?'周'+['一','二','三','四','五','六','日'][Number(s.day)-1]:s.freq==='workdays'?'工作日':'周末'} ${s.time} 维护` : '○ 已关闭';
  }
  const kpiVals = document.querySelectorAll('.sim-kpi-value');
  if (kpiVals && kpiVals[3]) {
    kpiVals[3].textContent = s.enabled ? `每${s.freq==='daily'?'天':s.freq==='weekly'?'周'+['一','二','三','四','五','六','日'][Number(s.day)-1]:s.freq==='workdays'?'工作日':'周末'} ${s.time}` : '已停用';
  }
  toast(state.rebootSchedule.enabled ? '已启用定时自动重启维护' : '已停用定时自动重启');
};

window.setRebootFreq = function(freq) {
  if (!state.rebootSchedule) state.rebootSchedule = {};
  state.rebootSchedule.freq = freq;
  const dayWrap = document.getElementById('rebootSchedDayWrap');
  if (dayWrap) dayWrap.style.display = freq === 'weekly' ? 'inline-flex' : 'none';
  const badge = document.getElementById('rebootSchedBadge');
  const s = state.rebootSchedule;
  if (badge && s.enabled) {
    badge.textContent = `● 每${s.freq==='daily'?'天':s.freq==='weekly'?'周'+['一','二','三','四','五','六','日'][Number(s.day)-1]:s.freq==='workdays'?'工作日':'周末'} ${s.time} 维护`;
  }
  toast('已设置重启周期：' + (freq==='daily'?'每天':freq==='weekly'?'每周指定日':freq==='workdays'?'工作日':'周末'));
};

window.setRebootDay = function(day) {
  if (!state.rebootSchedule) state.rebootSchedule = {};
  state.rebootSchedule.day = day;
  const badge = document.getElementById('rebootSchedBadge');
  const s = state.rebootSchedule;
  if (badge && s.enabled) {
    badge.textContent = `● 每周${['一','二','三','四','五','六','日'][Number(s.day)-1]} ${s.time} 维护`;
  }
  toast('已设置重启日期为：每周' + ['一','二','三','四','五','六','日'][Number(day)-1]);
};

window.setRebootTime = function(time) {
  if (!state.rebootSchedule) state.rebootSchedule = {};
  state.rebootSchedule.time = time || '04:00';
  const badge = document.getElementById('rebootSchedBadge');
  const s = state.rebootSchedule;
  if (badge && s.enabled) {
    badge.textContent = `● 每${s.freq==='daily'?'天':s.freq==='weekly'?'周'+['一','二','三','四','五','六','日'][Number(s.day)-1]:s.freq==='workdays'?'工作日':'周末'} ${s.time} 维护`;
  }
  toast('已更新自动重启时间为：' + state.rebootSchedule.time);
};

window.toggleRebootDelay = function(val) {
  if (!state.rebootSchedule) state.rebootSchedule = {};
  state.rebootSchedule.delayIfBusy = !!val;

let selectedFirmwareFile = null;
let selectedBackupFile = null;

window.setBackupMaxKeep = function(val) {
  const max = parseInt(val, 10) || 3;
  state.backupMaxKeep = max;
  let prunedCount = 0;
  if (!state.backups) state.backups = [];
  while (state.backups.length > max) {
    state.backups.pop();
    prunedCount++;
  }
  renderPage('系统维护与备份');
  if (prunedCount > 0) {
    toast(`最大保留数已设置为 ${max} 份，已自动清理 ${prunedCount} 份超额旧备份`);
  } else {
    toast(`最大保留数已更新为 ${max} 份`);
  }
};

window.handleFirmwareFileSelect = function(input) {
  const file = input.files && input.files[0];
  const nameEl = document.getElementById('fwUpgradeFileName');
  if (file) {
    selectedFirmwareFile = file.name;
    if (nameEl) {
      nameEl.textContent = file.name;
      nameEl.style.color = 'var(--sim-text)';
      nameEl.style.fontWeight = '600';
    }
  } else {
    selectedFirmwareFile = null;
    if (nameEl) {
      nameEl.textContent = '未选择升级包';
      nameEl.style.color = 'var(--sim-muted)';
      nameEl.style.fontWeight = 'normal';
    }
  }
};

window.createNewBackup = function(autoDownload = true) {
  if (!state.backups) state.backups = [];
  const maxKeep = state.backupMaxKeep || 3;

  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const dateStr = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
  const displayDate = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const filename = `backup-AthenaWrt-${dateStr}.tar.gz`;
  const size = (145 + Math.floor(Math.random() * 15)) + ' KB';

  let pruned = false;
  while (state.backups.length >= maxKeep) {
    state.backups.pop();
    pruned = true;
  }

  state.backups.unshift({
    name: filename,
    size: size,
    date: displayDate,
    type: '全量系统配置'
  });

  renderPage('系统维护与备份');
  
  if (autoDownload) {
    downloadBackupFile(0);
  }

  if (pruned) {
    toast(`已生成并下载新备份：${filename}（达上限 ${maxKeep} 份，已自动滚存清理）`);
  } else {
    toast(`已成功生成并下载备份文件：${filename}`);
  }
};

window.downloadBackupFile = function(idx) {
  if (state.backups && state.backups[idx]) {
    const item = state.backups[idx];
    const blob = new Blob([
      `# AthenaWrt Backup Archive\n# Router: JDCloud Athena AX6600 (RE-CS-02)\n# Timestamp: ${item.date}\n# Name: ${item.name}\n`
    ], { type: 'application/gzip' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = item.name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }, 100);
    toast('已开始下载备份文件：' + item.name);
  }
};

window.saveWifiSchedule = async function() {
  const offTime = document.getElementById('sched-off-time')?.value || '01:00';
  const onTime = document.getElementById('sched-on-time')?.value || '06:30';
  const b24 = document.getElementById('sched-band-24')?.checked !== false;
  const b52 = document.getElementById('sched-band-52')?.checked !== false;
  const b58 = document.getElementById('sched-band-58')?.checked === true;

  const [offH, offM] = offTime.split(':').map(x => parseInt(x, 10));
  const [onH, onM] = onTime.split(':').map(x => parseInt(x, 10));

  state.wifiSched = { offTime, onTime, b24, b52, b58, enabled: true };

  toast('正在写入系统计划任务 (Crontab)...');

  let downCmds = [];
  let upCmds = [];
  if (b24) { downCmds.push('wifi down radio1'); upCmds.push('wifi up radio1'); }
  if (b52) { downCmds.push('wifi down radio2'); upCmds.push('wifi up radio2'); }
  if (b58) { downCmds.push('wifi down radio0'); upCmds.push('wifi up radio0'); }
  if (downCmds.length === 0) { downCmds.push('wifi down'); upCmds.push('wifi up'); }

  const cronText = `# AthenaWrt WiFi Schedule\n${offM} ${offH} * * * ${downCmds.join('; ')}\n${onM} ${onH} * * * ${upCmds.join('; ')}\n`;

  if (window.UbusProvider) {
    try {
      await window.UbusProvider.callUbus('file', 'write', {
        path: '/etc/crontabs/root',
        data: cronText
      });
      await window.UbusProvider.callUbus('rc', 'init', { name: 'cron', action: 'reload' });
      toast(`WiFi 定时已成功写入 Crontab！每日 ${offTime} 关闭，${onTime} 恢复`);
    } catch(e) {
      toast(`WiFi 定时已在本地保存：每日 ${offTime} 关闭，${onTime} 恢复`);
    }
  } else {
    toast(`WiFi 定时已保存：每日 ${offTime} 关闭，${onTime} 恢复`);
  }
  renderPage('WiFi 定时');
};

window.saveWifiModalConfig = async function(band) {
  const item = state.wifi.find(w => w.band === band);
  const ssid = document.getElementById('wf-ssid')?.value;
  const sec = document.getElementById('wf-security')?.value;
  const chan = document.getElementById('wf-channel')?.value;
  const width = document.getElementById('wf-width')?.value;
  const pwr = document.getElementById('wf-power')?.value;
  const pwd = document.getElementById('wf-pwd')?.value;
  const hidden = document.getElementById('wf-hidden')?.checked;
  const enable = document.getElementById('wf-enable')?.checked;

  if (item) {
    if (ssid) item.ssid = ssid;
    if (sec) item.security = sec;
    if (chan) item.channel = isNaN(Number(chan)) ? chan : Number(chan);
    if (width) item.width = width;
    if (pwr) item.power = parseInt(pwr, 10);
    if (pwd) item.password = pwd;
    item.hidden = !!hidden;
    item.enabled = enable !== false;
  }
  closeModal();
  renderPage('三频 WiFi');
  toast('正在下发 ' + band + ' 配置至路由器无线驱动...');

  if (window.UbusProvider) {
    try {
      await window.UbusProvider.command('setWifi', {
        band: band,
        ssid: ssid,
        password: pwd,
        disabled: enable === false
      });
      toast(band + ' 配置已成功写入 /etc/config/wireless 并重载生效！');
    } catch(e) {
      toast(band + ' 配置未获路由器确认，未保存：' + (e.message || '接口失败'));
    }
  }
};

function filterClients() {
  const q = (document.getElementById('clientFilter')?.value || '').toLowerCase().trim();
  const type = document.getElementById('clientType')?.value || '';
  const clearBtn = document.getElementById('clearClientFilter');
  if (clearBtn) clearBtn.style.display = q ? 'block' : 'none';

  let arr = state.clients.filter(c => {
    // 1. Chip filter
    if (currentClientChip === 'wired') {
      const isWired = ((c.link && (c.link.includes('LAN') || c.link.includes('有线'))) || c.rssi === null) && c.status === '在线';
      if (!isWired) return false;
    } else if (currentClientChip === 'wireless') {
      const isWireless = (c.link && (c.link.includes('GHz') || c.link.includes('5G') || c.link.includes('2.4G') || c.rssi !== null)) && c.status === '在线';
      if (!isWireless) return false;
    } else if (currentClientChip === 'offline') {
      if (c.status !== '离线') return false;
    } else if (currentClientChip === 'blacklist') {
      if (c.status !== '已拉黑') return false;
    }

    // 2. Type dropdown filter
    if (type && c.type !== type) return false;

    // 3. Search query
    if (q) {
      const haystack = [c.name, c.ip, c.mac, c.vendor, c.link, c.type, c.status].join(' ').toLowerCase();
      if (!haystack.includes(q)) return false;
    }
    return true;
  });

  const countEl = document.getElementById('clientResultCount');

    if (targetP) {

  let b = e.target.closest('[data-sim-group]');
  if (b) {
    let g = groups.find(x => x.name === b.dataset.simGroup);
    if (g) renderPage(g.pages[0]);

  }
  let rowBtn = e.target.closest('[data-row-action]');
  if (rowBtn) {

      openClientDetailModal(selectedClient);

window.applyWallpaper = function(wpId, silent) {
  try { localStorage.setItem('athena-wallpaper', wpId); } catch(e) {}
  document.body.classList.remove('wallpaper-aurora', 'wallpaper-cyber', 'wallpaper-nebula', 'wallpaper-oled', 'wallpaper-frost', 'wallpaper-carbon');
  document.body.classList.add('wallpaper-' + wpId);
  
  document.querySelectorAll('.wallpaper-card').forEach(c => {
    c.classList.toggle('active', c.dataset.wp === wpId);
  });
  
  updateLivePreview();
  const wp = ATHENA_WALLPAPERS.find(x => x.id === wpId);
  if (!silent) toast(`已切换动态壁纸：【${wp?.name || wpId}】`);
};

window.applyBorderGlow = function(glow, silent) {
  try { localStorage.setItem('athena-border-glow', glow); } catch(e) {}
  document.body.classList.remove('border-glow-subtle', 'border-glow-neon');
  if (glow === 'subtle') document.body.classList.add('border-glow-subtle');
  else if (glow === 'neon') document.body.classList.add('border-glow-neon');
  
  ['none', 'subtle', 'neon'].forEach(g => {
    const btn = document.getElementById('btnGlow_' + g);
    if (btn) btn.className = `sim-btn ${glow === g ? 'primary' : ''}`;
  });
  
  if (!silent) toast(`卡片微光效果已切换为：${glow === 'neon' ? '呼吸霓虹' : glow === 'subtle' ? '水晶微光' : '无光晕'}`);
};

window.applyThemePreset = function(presetId) {
  const p = ATHENA_PRESETS.find(x => x.id === presetId);
  if (!p) return;
  
  applyThemeMode(p.mode, true);
  applyWallpaper(p.wallpaper, true);
  applyAccentColor(p.accent, true);
  applyBorderRadius(p.radius, true);
  applyGlassBlur(p.blur, true);
  applyBorderGlow(p.glow || 'none', true);
  toggleCompactMode(p.compact, true);
  toggleAuroraGlow(p.aurora, true);
  
  const rSlider = document.getElementById('radiusSlider');
  if (rSlider) rSlider.value = p.radius;
  const bSlider = document.getElementById('blurSlider');
  if (bSlider) bSlider.value = p.blur;
  const hexInp = document.getElementById('customHexInput');
  if (hexInp) hexInp.value = p.accent;
  const chkC = document.getElementById('chkCompact');
  if (chkC) chkC.checked = p.compact;
  const chkA = document.getElementById('chkAurora');
  if (chkA) chkA.checked = p.aurora;
  
  updateLivePreview();
  toast(`已一键应用【${p.name}】官方精选风格预设`);
};

window.applyThemeMode = function(m, silent) {
  themeMode = m;
  try { localStorage.setItem('athena-mock-theme', m); } catch(e) {}
  
  if (m === 'oled') {
    document.documentElement.dataset.theme = 'oled';
  } else {
    setTheme(m);
  }
  
  ['auto', 'light', 'dark', 'oled'].forEach(mode => {
    const btn = document.getElementById('btnMode_' + mode);
    if (btn) btn.className = `sim-btn ${m === mode ? 'primary' : ''}`;
  });
  
  updateLivePreview();
  if (!silent) toast('已切换明暗模式：' + (m === 'auto' ? '自动跟随系统' : m === 'light' ? '极光浅色' : m === 'dark' ? '深邃暗黑' : 'OLED 极夜纯黑'));
};

window.applyAccentColor = function(color, silent) {
  if (!color || !color.startsWith('#')) return;
  try { localStorage.setItem('athena-custom-accent', color); } catch(e) {}
  document.documentElement.style.setProperty('--accent', color);
  document.documentElement.style.setProperty('--sim-accent', color);
  document.documentElement.style.setProperty('--accentSoft', color + '1f');
  
  const dot = document.getElementById('themeBtnDot');
  if (dot) {
    dot.style.background = color;
    dot.style.boxShadow = `0 0 6px ${color}`;
  }
  
  const hexInp = document.getElementById('customHexInput');
  if (hexInp && hexInp.value.toLowerCase() !== color.toLowerCase()) {
    hexInp.value = color;
  }
  
  document.querySelectorAll('.theme-acc-btn').forEach(btn => {
    btn.classList.toggle('primary', btn.dataset.color.toLowerCase() === color.toLowerCase());
  });
  
  if (localStorage.getItem('athena-hw-sync') === '1') {
    matrixState.bottomColor = color;
    const bar = document.getElementById('athenaAmbientBar');
    if (bar) {
      bar.style.background = color;
      bar.style.boxShadow = `0 0 14px ${color}, 0 0 28px ${color}`;
    }
  }
  
  updateLivePreview();
  if (!silent) toast('已更新强调色彩：' + color);
};

window.applyBorderRadius = function(r, silent) {
  try { localStorage.setItem('athena-border-radius', r); } catch(e) {}
  document.documentElement.style.setProperty('--sim-radius', r + 'px');
  
  document.querySelectorAll('.sim-panel, .card, .sim-status-card, .sim-hero, .sim-router-card').forEach(el => {
    el.style.borderRadius = r + 'px';
  });
  document.querySelectorAll('.sim-btn, .sim-field').forEach(el => {
    el.style.borderRadius = Math.max(4, Math.round(Number(r) * 0.65)) + 'px';
  });
  
  const badge = document.getElementById('radiusValueBadge');
  if (badge) badge.textContent = r + 'px';
  const slider = document.getElementById('radiusSlider');
  if (slider) slider.value = r;
  
  updateLivePreview();
  if (!silent) toast('圆角曲率已设为 ' + r + 'px');
};

window.applyGlassBlur = function(b, silent) {
  try { localStorage.setItem('athena-glass-blur', b); } catch(e) {}
  document.documentElement.style.setProperty('--sim-blur', b + 'px');
  
  if (b === '0') {
    document.querySelectorAll('.card, .sim-panel, header.topbar, aside.sidebar').forEach(el => {
      el.style.backdropFilter = 'none';
      el.style.webkitBackdropFilter = 'none';
    });
  } else {
    document.querySelectorAll('.card, .sim-panel, header.topbar, aside.sidebar').forEach(el => {
      el.style.backdropFilter = `blur(${b}px)`;
      el.style.webkitBackdropFilter = `blur(${b}px)`;
    });
  }
  
  const badge = document.getElementById('blurValueBadge');
  if (badge) badge.textContent = b === '0' ? '关闭' : b + 'px';
  const slider = document.getElementById('blurSlider');
  if (slider) slider.value = b;
  
  updateLivePreview();
  if (!silent) toast('毛玻璃模糊强度已设为：' + (b === '0' ? '关闭' : b + 'px'));
};

window.toggleCompactMode = function(enabled, silent) {
  try { localStorage.setItem('athena-compact-mode', enabled ? '1' : '0'); } catch(e) {}
  if (enabled) {
    document.body.classList.add('compact-mode');
  } else {
    document.body.classList.remove('compact-mode');
  }
  if (!silent) toast(enabled ? '已开启极客紧凑排版模式' : '已恢复标准舒适排版模式');
};

window.toggleAuroraGlow = function(enabled, silent) {
  try { localStorage.setItem('athena-aurora-glow', enabled ? '1' : '0'); } catch(e) {}
  if (enabled) {
    document.body.classList.remove('no-aurora');
  } else {
    document.body.classList.add('no-aurora');
  }
  if (!silent) toast(enabled ? '已开启彩色极光环境光晕' : '已关闭极光光晕（纯净单色背景）');
};

window.toggleHwSync = function(enabled, silent) {
  try { localStorage.setItem('athena-hw-sync', enabled ? '1' : '0'); } catch(e) {}
  if (enabled) {
    const curAcc = localStorage.getItem('athena-custom-accent') || '#0080ff';
    matrixState.bottomColor = curAcc;
    const bar = document.getElementById('athenaAmbientBar');
    if (bar) {
      bar.style.background = curAcc;
      bar.style.boxShadow = `0 0 14px ${curAcc}, 0 0 28px ${curAcc}`;
    }
    if (!silent) toast('已开启：界面强调色实时联动雅典娜机身氛围灯');
  } else {
    if (!silent) toast('已关闭机身氛围灯联动');
  }
};

window.exportThemeProfile = function() {
  const profile = {
    theme: localStorage.getItem('athena-mock-theme') || 'auto',
    wallpaper: localStorage.getItem('athena-wallpaper') || 'aurora',
    accent: localStorage.getItem('athena-custom-accent') || '#0080ff',
    radius: localStorage.getItem('athena-border-radius') || '12',
    blur: localStorage.getItem('athena-glass-blur') || '22',
    glow: localStorage.getItem('athena-border-glow') || 'none',
    compact: localStorage.getItem('athena-compact-mode') === '1',
    aurora: localStorage.getItem('athena-aurora-glow') !== '0',
    hwSync: localStorage.getItem('athena-hw-sync') === '1'
  };
  const jsonStr = JSON.stringify(profile, null, 2);
  navigator.clipboard?.writeText(jsonStr);
  toast('已复制主题配置 JSON 到剪贴板！');
};

window.importThemeProfileModal = function() {
  const modalContent = `
    <p style="font-size:11px;color:var(--sim-muted);margin-bottom:8px;">请在下方输入框粘贴导出的 AthenaWrt 主题 JSON 配置代码：</p>
    <textarea id="themeJsonInput" class="sim-modal-input" style="height:120px;font-family:monospace;font-size:10px;resize:none;" placeholder='{\\n  "theme": "dark",\\n  "accent": "#0080ff"\\n}'></textarea>
    <div class="sim-modal-actions" style="margin-top:12px;">
      <button type="button" class="sim-btn" onclick="openThemeModal()">返回</button>
      <button type="button" class="sim-btn primary" onclick="submitImportThemeJson()">解析并应用</button>
    </div>
  `;
  openModal('导入主题配置 JSON', modalContent);
};

window.submitImportThemeJson = function() {
  const raw = document.getElementById('themeJsonInput')?.value?.trim();
  if (!raw) {
    toast('请输入有效的主题 JSON 配置');
    return;
  }
  try {
    const cfg = JSON.parse(raw);
    if (cfg.theme) applyThemeMode(cfg.theme, true);
    if (cfg.wallpaper) applyWallpaper(cfg.wallpaper, true);
    if (cfg.accent) applyAccentColor(cfg.accent, true);
    if (cfg.radius) applyBorderRadius(cfg.radius, true);
    if (cfg.blur) applyGlassBlur(cfg.blur, true);
    if (cfg.glow) applyBorderGlow(cfg.glow, true);
    if (typeof cfg.compact === 'boolean') toggleCompactMode(cfg.compact, true);
    if (typeof cfg.aurora === 'boolean') toggleAuroraGlow(cfg.aurora, true);
    if (typeof cfg.hwSync === 'boolean') toggleHwSync(cfg.hwSync, true);
    toast('主题配置导入生效成功！');
    openThemeModal();
  } catch(e) {
    toast('配置解析失败，请检查 JSON 格式！');
  }
};

window.resetDefaultTheme = function() {
  try {
    localStorage.removeItem('athena-custom-accent');
    localStorage.removeItem('athena-glass-blur');
    localStorage.removeItem('athena-border-radius');
    localStorage.removeItem('athena-wallpaper');
    localStorage.removeItem('athena-border-glow');
    localStorage.removeItem('athena-compact-mode');
    localStorage.removeItem('athena-aurora-glow');
    localStorage.removeItem('athena-hw-sync');
    localStorage.removeItem('athena-mock-theme');
  } catch(e) {}
  
  document.documentElement.style.removeProperty('--accent');
  document.documentElement.style.removeProperty('--sim-accent');
  document.documentElement.style.removeProperty('--accentSoft');
  document.documentElement.style.removeProperty('--sim-radius');
  document.documentElement.style.removeProperty('--sim-blur');
  document.body.classList.remove('compact-mode', 'no-aurora', 'border-glow-subtle', 'border-glow-neon', 'wallpaper-aurora', 'wallpaper-cyber', 'wallpaper-nebula', 'wallpaper-oled', 'wallpaper-frost', 'wallpaper-carbon');
  
  document.querySelectorAll('.card, .sim-panel, header.topbar, aside.sidebar').forEach(el => {
    el.style.backdropFilter = '';
    el.style.webkitBackdropFilter = '';
    el.style.borderRadius = '';
  });
  
  themeMode = 'auto';
  setTheme('auto');
  closeModal();
  toast('已恢复 AthenaWrt 官方极光经典风格');
};

// ========================================================================
// ATHENAWRT CUSTOM BOTTOM SHEET SELECT CONTROLLER (GHOST-CLICK PROOF)
// ========================================================================
(function() {
  let currentActiveSelect = null;
  let lastSheetOpenedTime = 0;
  let lastSelectInterceptTime = 0;

  window.openSelectBottomSheet = function(select) {
    if (!select || !select.options || select.options.length === 0) return;
    currentActiveSelect = select;
    lastSheetOpenedTime = Date.now();

    // 1. Determine title
    let title = '请选择选项';
    const parentRow = select.closest('.sim-form-row') || select.closest('.wifi-modal-section') || select.closest('.sim-config-form label') || select.parentElement;
    if (parentRow) {
      const lbl = parentRow.querySelector('label') || parentRow.querySelector('.sim-form-label-col b') || parentRow.querySelector('.wifi-modal-section-title') || parentRow.querySelector('b');
      if (lbl && lbl.textContent) {
        title = lbl.textContent.trim().replace(/^[⚡\s]+/, '').replace(/\s+/g, ' ').replace('：', '').trim();
        if (title.length > 24) title = title.slice(0, 24);
      }
    }
    if (select.getAttribute('aria-label')) title = select.getAttribute('aria-label');
    if (select.id === 'wf-channel') title = '运行信道 (Channel)';
    if (select.id === 'wf-width') title = '信道频宽 (Channel Width)';
    if (select.id === 'wf-security') title = '安全加密协议';
    if (select.id === 'wf-power') title = '发射功率 (Transmit Power)';
    if (select.id === 'rebootSchedFreq') title = '自动重启周期';
    if (select.id === 'rebootSchedDay') title = '自动重启星期';
    if (select.id === 'backupMaxKeepSelect') title = '备份保留上限';
    if (select.id === 'clientType') title = '设备类型过滤';
    if (select.id === 'parental-device-select') title = '受控终端设备';

    // 2. Extract options
    const options = Array.from(select.options).map((opt, idx) => ({
      index: idx,
      value: opt.value,
      text: opt.text || opt.value,
      selected: opt.selected,
      disabled: opt.disabled
    }));

    let sheetEl = document.getElementById('athenaBottomSheetBackdrop');
    if (!sheetEl) {
      sheetEl = document.createElement('div');
      sheetEl.id = 'athenaBottomSheetBackdrop';
      sheetEl.className = 'athena-bottom-sheet-backdrop';
      document.body.appendChild(sheetEl);

      // Dedicated click listener on backdrop with ghost-click suppression
      sheetEl.addEventListener('click', function(e) {
        if (Date.now() - lastSheetOpenedTime < 450) {
          e.preventDefault();
          e.stopPropagation();
          return;
        }
        if (e.target === sheetEl) {
          window.closeSelectBottomSheet();
        }
      });

      sheetEl.addEventListener('touchend', function(e) {
        if (Date.now() - lastSheetOpenedTime < 350) {
          e.preventDefault();
          e.stopPropagation();
        }
      }, { passive: false });
    }

    sheetEl.innerHTML = `
      <div class="athena-bottom-sheet" onclick="event.stopPropagation()">
        <div class="athena-sheet-handle-wrap" onclick="window.closeSelectBottomSheet()">
          <div class="athena-sheet-handle"></div>
        </div>
        <div class="athena-sheet-header">
          <div class="athena-sheet-title">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ${esc(title)}
          </div>
          <button type="button" class="athena-sheet-close" onclick="window.closeSelectBottomSheet()">完成</button>
        </div>
        <div class="athena-sheet-body">
          ${options.map(opt => `
            <div class="athena-sheet-item ${opt.selected ? 'selected' : ''} ${opt.disabled ? 'disabled' : ''}" onclick="window.selectSheetOption(${opt.index})">
              <div class="athena-sheet-item-text">
                <span class="athena-sheet-item-main">${esc(opt.text)}</span>
              </div>
              ${opt.selected ? `
                <div class="athena-sheet-check">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"/>
                  </svg>
                </div>
              ` : '<div class="athena-sheet-check-placeholder"></div>'}
            </div>
          `).join('')}
        </div>
      </div>
    `;

    requestAnimationFrame(() => {
      sheetEl.classList.add('active');
    });
  };

  window.selectSheetOption = function(optIndex) {
    if (Date.now() - lastSheetOpenedTime < 280) return;

    if (currentActiveSelect && currentActiveSelect.options && currentActiveSelect.options[optIndex]) {
      currentActiveSelect.selectedIndex = optIndex;
      const opt = currentActiveSelect.options[optIndex];
      currentActiveSelect.value = opt.value;
      currentActiveSelect.title = opt.text;

      currentActiveSelect.dispatchEvent(new Event('change', { bubbles: true }));
      currentActiveSelect.dispatchEvent(new Event('input', { bubbles: true }));
      if (typeof currentActiveSelect.onchange === 'function') {
        try { currentActiveSelect.onchange(); } catch(e){}
      }
    }

    const items = document.querySelectorAll('.athena-sheet-item');
    items.forEach((item, idx) => {
      item.classList.toggle('selected', idx === optIndex);
      const check = item.querySelector('.athena-sheet-check, .athena-sheet-check-placeholder');
      if (check) {
        if (idx === optIndex) {
          check.className = 'athena-sheet-check';
          check.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
        } else {
          check.className = 'athena-sheet-check-placeholder';
          check.innerHTML = '';
        }
      }
    });

    setTimeout(() => {
      window.closeSelectBottomSheet();
    }, 120);
  };

  window.closeSelectBottomSheet = function() {
    const sheetEl = document.getElementById('athenaBottomSheetBackdrop');
    if (sheetEl) {
      sheetEl.classList.remove('active');
    }
    currentActiveSelect = null;
  };

  function shouldIntercept(target) {
    if (!target) return null;
    return target.closest('select.sim-field, .wifi-modal-section select, .sim-form-row select, .sim-config-form select, select[data-sheet]');
  }

  // Pointerdown interceptor with debounce
  document.addEventListener('pointerdown', function(e) {
    const sel = shouldIntercept(e.target);
    if (sel) {
      e.preventDefault();
      e.stopPropagation();
      sel.blur();
      const now = Date.now();
      if (now - lastSelectInterceptTime < 450) return;
      lastSelectInterceptTime = now;
      window.openSelectBottomSheet(sel);
    }
  }, true);

  document.addEventListener('mousedown', function(e) {
    const sel = shouldIntercept(e.target);
    if (sel) {
      e.preventDefault();
      e.stopPropagation();
      sel.blur();
    }
  }, true);

  document.addEventListener('click', function(e) {
    const sel = shouldIntercept(e.target);
    if (sel) {
      e.preventDefault();
      e.stopPropagation();
      sel.blur();
    }
  }, true);

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      window.closeSelectBottomSheet();
    }
    if ((e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowDown') && document.activeElement) {
      const sel = shouldIntercept(document.activeElement);
      if (sel) {
        e.preventDefault();
        window.openSelectBottomSheet(sel);
      }
    }
  });
})();

window.handleAthenaLogin = async function() {
  const user=(document.getElementById('athenaLoginUser')?.value||'root').trim();
  const pass=document.getElementById('athenaLoginPass')?.value||'';
  const errBox=document.getElementById('athenaLoginError'),btnText=document.getElementById('athenaLoginBtnText'),submitBtn=document.getElementById('athenaLoginSubmit'),bypassBtn=document.getElementById('athenaBypassWrap');
  if(errBox)errBox.style.display='none';if(btnText)btnText.textContent='正在核验…';if(submitBtn)submitBtn.disabled=true;if(bypassBtn)bypassBtn.style.display='none';
  try{
    if(!window.UbusProvider)throw new Error('运行环境未初始化');
    if(!window.UbusProvider.isLuCI){window.UbusProvider.mode='mock';window.unlockAthenaConsole();if(typeof renderPage==='function'&&typeof current!=='undefined')renderPage(current);toast('预览模式：数据和操作均为模拟，不会连接路由器');return;}
    await window.UbusProvider.login(user,pass);try{sessionStorage.setItem('athena_logged_in','true');}catch(e){}
    window.unlockAthenaConsole();if(typeof renderPage==='function'&&typeof current!=='undefined')renderPage(current);toast('路由器登录验证成功，已读取真实设备状态');
  }catch(e){if(btnText)btnText.textContent='登 录 控 制 台';if(submitBtn)submitBtn.disabled=false;if(errBox){errBox.textContent=e.message||'登录失败';errBox.style.display='block';}if(bypassBtn)bypassBtn.style.display='none';}
};

window.unlockAthenaConsole = function() {
  const screen = document.getElementById('athenaLoginScreen');
  if (screen) {
    screen.classList.add('hide');
  }
};

window.athenaLogout = function() {
  if(window.UbusProvider)window.UbusProvider.authFail();
  try{sessionStorage.removeItem('athena_logged_in');sessionStorage.removeItem('athena_session');}catch(e){}
  const screen=document.getElementById('athenaLoginScreen'),passInput=document.getElementById('athenaLoginPass'),errBox=document.getElementById('athenaLoginError'),btnText=document.getElementById('athenaLoginBtnText'),submitBtn=document.getElementById('athenaLoginSubmit');
  if(errBox)errBox.style.display='none';if(passInput)passInput.value='';if(btnText)btnText.textContent='登 录 控 制 台';if(submitBtn)submitBtn.disabled=false;if(screen)screen.classList.remove('hide');toast('已退出当前会话');
};
(async function checkInitialAuth(){
  const p=window.UbusProvider;
  if(p&&p.isLuCI){const ok=await p.restoreSession();if(ok){window.unlockAthenaConsole();if(typeof renderPage==='function'&&typeof current!=='undefined')renderPage(current);}else{const s=document.getElementById('athenaLoginScreen');if(s)s.classList.remove('hide');const b=document.getElementById('athenaBypassWrap');if(b)b.style.display='none';}return;}
  if(typeof sessionStorage!=='undefined'&&sessionStorage.getItem('athena_logged_in')==='true')window.unlockAthenaConsole();else{const s=document.getElementById('athenaLoginScreen');if(s)s.classList.remove('hide');}
})();

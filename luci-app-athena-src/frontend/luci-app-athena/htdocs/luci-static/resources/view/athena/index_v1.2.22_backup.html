<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AthenaWrt · 雅典娜管理台</title>
<style>
:root{
  --primary:#185FA5; --primary-light:#E6F1FB; --primary-dark:#0C447C;
  --bg:#eef2f7; --card:rgba(255,255,255,var(--glass-alpha)); --text:#14233a; --text2:#5b6b82; --text3:#8a97a8;
  --border:rgba(255,255,255,.7); --green:#16a34a; --red:#dc2626; --amber:#d97706; --blue:#378ADD;
  --track:rgba(24,95,165,.10); --hover:rgba(255,255,255,.62);
  --radius:18px; --shadow:0 10px 36px rgba(31,61,110,.10);
  --input-bg:rgba(255,255,255,.5);
  --glass:blur(var(--glass-blur)) saturate(var(--glass-sat));
  --glass-border:inset 0 1px 0 rgba(255,255,255,var(--hi-op));
  /* 液态玻璃主题变量（可在「高级→全局设置→液态玻璃外观」自定义） */
  --blob-c1:90,167,238; --blob-c2:167,139,250; --blob-c3:91,211,196;
  --blob-op1:.5; --blob-op2:.42; --blob-op3:.38;
  --glass-alpha:.58; --glass-blur:20px; --glass-sat:160%;
  --iri-op:.55; --hi-op:.7;
  --base-grad:linear-gradient(165deg,#f3f6fb 0%,#e7edf6 100%);
}
body.dark{
  --primary-light:#14324f; --bg:#0a0e16; --card:rgba(22,27,38,var(--glass-alpha-dark)); --text:#e8ecf4; --text2:#9aa6b8; --text3:#5f6b7d;
  --border:rgba(255,255,255,.10); --track:rgba(255,255,255,.07); --hover:rgba(255,255,255,.06); --shadow:0 10px 36px rgba(0,0,0,.5);
  --input-bg:rgba(255,255,255,.08);
  --glass-border:inset 0 1px 0 rgba(255,255,255,var(--hi-op-dark));
  --glass-alpha-dark:.55; --hi-op-dark:.06;
  --blob-op1:.28; --blob-op2:.22; --blob-op3:.18;
  --base-grad:linear-gradient(165deg,#0a0e16,#0d1320);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(60% 50% at 15% 6%,rgba(var(--blob-c1),var(--blob-op1)),transparent 60%),radial-gradient(55% 45% at 88% 18%,rgba(var(--blob-c2),var(--blob-op2)),transparent 60%),radial-gradient(60% 50% at 55% 94%,rgba(var(--blob-c3),var(--blob-op3)),transparent 60%),var(--base-grad);background-attachment:fixed;color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

/* ===== 登录页 ===== */
.login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(55% 45% at 20% 12%,rgba(var(--blob-c1),var(--blob-op1)),transparent 60%),radial-gradient(50% 45% at 82% 20%,rgba(var(--blob-c2),var(--blob-op2)),transparent 60%),radial-gradient(60% 50% at 55% 90%,rgba(var(--blob-c3),var(--blob-op3)),transparent 60%),var(--base-grad)}
.login-card{background:var(--card);border-radius:16px;padding:40px;width:360px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.logo-badge{width:40px;height:40px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:20px}
.login-card h1{font-size:18px;font-weight:600}
.login-card .sub{color:var(--text2);font-size:13px;margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:var(--input-bg);color:var(--text);transition:border-color .15s}
.field input:focus{border-color:var(--primary)}
/* 统一玻璃化表单控件：覆盖所有散落的 input/select，避免浏览器默认白底直角 */
.limit-row input,.limit-row select,.modal input[type=text],.modal input[type=password],.modal input[type=time],.modal input[type=number],.modal input[type=file],.field select,.modal select{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;
  background:var(--input-bg);color:var(--text);font-family:inherit;transition:border-color .15s;
}
.limit-row input:focus,.limit-row select:focus,.modal input:focus,.field select:focus,.modal select:focus{border-color:var(--primary)}
body.dark .limit-row input,body.dark .limit-row select,body.dark .modal input,body.dark .field select,body.dark .modal select{color-scheme:dark}
.login-btn{width:100%;padding:12px;background:var(--primary);color:#fff;border-radius:8px;font-size:15px;font-weight:500}
.login-btn:hover{background:var(--primary-dark)}
.login-tip{margin-top:16px;font-size:12px;color:var(--text3);text-align:center}
.login-err{margin-top:12px;font-size:12px;color:var(--red);text-align:center;display:none}

/* ===== 主框架 ===== */
.app{display:none;min-height:100vh}
.app.show{display:flex}
.sidebar{width:232px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--border)}
.sidebar .brand .logo-badge{width:34px;height:34px;border-radius:9px;font-size:17px}
.sidebar .brand span{font-weight:600;font-size:15px}
.sidebar .brand small{display:block;color:var(--text3);font-size:11px;font-weight:400}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;color:var(--text2);font-size:14px;margin-bottom:2px;transition:.15s;width:100%;text-align:left}
.nav-item:hover{background:var(--bg)}
.nav-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:500}
.nav-item svg{flex:none;opacity:.9}
.sidebar .foot{padding:14px 20px;border-top:1px solid var(--border)}
.sidebar .foot .adv{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed var(--border);border-radius:9px;color:var(--text2);font-size:13px;width:100%}

.main{flex:1;margin-left:232px;padding:0 28px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;margin:14px 0 18px;position:sticky;top:12px;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow),var(--glass-border);z-index:10}
.topbar h2{font-size:20px;font-weight:600}
.topbar .meta{display:flex;align-items:center;gap:16px;color:var(--text2);font-size:13px}
.pill{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--card);border:1px solid var(--border);border-radius:20px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.metric.clickable{cursor:pointer;transition:.15s}
.metric.clickable:hover{border-color:var(--primary)}

.view{display:none;animation:fade .2s}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ===== 通用卡片 ===== */
.grid{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card h3{font-size:14px;font-weight:600;margin-bottom:14px}
.card .hint{font-size:12px;color:var(--text3);font-weight:400;margin-left:8px}
.row{display:flex;gap:16px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px 24px}
.metric .label{font-size:13px;color:var(--text2)}
.metric .value{font-size:26px;font-weight:600;margin-top:4px}
.metric .delta{font-size:12px;color:var(--text3)}
/* 首页指标卡：默认全显，3 列 → 2 列 → 1 列自适应 */
.metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.metrics-grid .metric{margin:0}
.metric.drag{cursor:grab}
.metric.drag:active{cursor:grabbing}
.metric .drag-handle{position:absolute;top:10px;right:12px;color:var(--text3);opacity:0;transition:.15s;font-size:14px}
.metric:hover .drag-handle{opacity:1}
@media(max-width:1100px){.metrics-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.metrics-grid{grid-template-columns:1fr}}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;background:var(--primary-light);color:var(--primary-dark)}
.tag.green{background:#E8F5EC;color:var(--green)}
.tag.red{background:#FBEAEA;color:var(--red)}
.tag.amber{background:#FDF1E0;color:var(--amber)}
.tag.blue{background:#E8F0FB;color:var(--primary)}
.tag.gray{background:#F1F3F4;color:var(--text2)}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid var(--border);color:var(--text2);background:#fff;transition:.15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark);color:#fff}
.btn.sm{padding:5px 12px;font-size:12px}
.btn.danger{color:var(--red)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.switch{position:relative;width:40px;height:22px;background:#d1d5db;border-radius:11px;transition:.2s;flex:none}
.switch.on{background:var(--green)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.switch.on::after{left:20px}

/* ===== 首页 ===== */
.speed-hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.speed-num{font-size:44px;font-weight:600;line-height:1}
.speed-unit{font-size:14px;color:var(--text2);margin-left:4px}
.speed-label{font-size:13px;color:var(--text2);margin-bottom:6px}
.speed-dir{display:flex;align-items:center;gap:12px}
.arrow-dn{color:var(--blue)}.arrow-up{color:var(--green)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.quick-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);transition:.15s}
.quick-btn:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.quick-btn .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--primary-light);color:var(--primary)}
.quick-btn span{font-size:13px}

/* ===== 首页 v2（v1.2.19 新设计）===== */
.hero-card{overflow:hidden}
.hero-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.hero-ttl{font-size:13px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:8px}
.hero-ttl span{font-weight:400;color:var(--text3)}
.hero-legend{display:flex;gap:16px;font-size:11px;color:var(--text3);flex-wrap:wrap;align-items:center}
.hero-legend span{display:inline-flex;align-items:center;gap:6px}
.hero-legend i{width:16px;height:3px;border-radius:2px;display:inline-block}
.hero-legend .lg-dn{background:var(--blue)}
.hero-legend .lg-up{background:var(--green)}
.hero-main{display:grid;grid-template-columns:1fr;gap:16px;align-items:center}
.hero-cols{display:flex;gap:26px;flex-wrap:wrap}
.hero-col .hero-lab{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.hero-col .hero-val{font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.hero-col .hero-unit{font-size:13px;color:var(--text3);font-weight:500;margin-left:5px}
.hero-col .hero-pk{font-size:11px;color:var(--text3);margin-top:8px}
.hero-col.hc-dn .hero-val{color:var(--blue)}
.hero-col.hc-up .hero-val{color:var(--green)}
.hero-chart{position:relative;height:86px;min-width:0}
.hero-chart svg{position:absolute;inset:0;width:100%;height:100%}
.hero-axis{position:absolute;inset:auto 0 0;display:flex;justify-content:space-between;font-size:10px;color:var(--text3);padding-top:2px}
.kpis-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.kpis-head h3{font-size:14px;font-weight:600}
.kpis{display:grid;grid-template-columns:1fr;gap:16px}
.kpi{display:flex;align-items:center;gap:16px;padding:18px 20px;min-width:0;cursor:pointer;transition:.18s}
.kpi:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi-ring{position:relative;width:64px;height:64px;flex:none}
.kpi-ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.kpi-ring .rk-track{stroke:var(--track);fill:none;stroke-width:6}
.kpi-ring .rk-bar{fill:none;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.kpi-ring .rk-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi-info{min-width:0}
.kpi-info .kpi-t{font-size:12px;color:var(--text3);margin-bottom:5px}
.kpi-info .kpi-v{font-size:22px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi-info .kpi-d{font-size:11px;color:var(--text3);margin-top:5px}
.kpi-bars{display:flex;gap:3px;align-items:flex-end;height:26px;margin-top:8px}
.kpi-bars i{flex:1;border-radius:2px;background:var(--track);min-width:3px}
.kpi-ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--primary-light);color:var(--primary)}
.kpi-ic svg{width:20px;height:20px}
.netband{display:flex;flex-wrap:wrap;gap:9px;padding:16px 18px}
.netband .chip{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:11px;font-size:12px;background:var(--hover);border:1px solid var(--border);color:var(--text2);min-height:38px}
.netband .chip b{color:var(--text);font-weight:600}
.netband .chip .k{color:var(--text3)}
.netband .chip .st{width:7px;height:7px;border-radius:50%}
.st-on{background:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.14)}
.st-off{background:var(--text3)}
.row2{display:grid;grid-template-columns:1fr;gap:16px;align-items:start}
.topo2{display:flex;flex-direction:column;gap:10px;padding:8px 4px 4px}
.tp-node{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;border:1px solid var(--border);background:var(--hover);font-size:12px}
.tp-node b{color:var(--text);font-weight:600}
.tp-node i{margin-left:auto;color:var(--text3);font-size:11px;font-style:normal}
.tp-line{display:flex;align-items:center;gap:10px;padding-left:22px;color:var(--text3);font-size:11px}
.tp-line::before{content:"";width:1px;height:16px;background:var(--border);flex:none}
.tp-branch{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-left:22px}
.tp-leaf{border-radius:11px;border:1px dashed var(--border);padding:9px 12px;font-size:11px;color:var(--text2)}
.tp-leaf b{color:var(--text);font-weight:600;display:block;margin-bottom:2px}
.tp-leaf.off{opacity:.5}
@media(min-width:560px){.kpis{grid-template-columns:1fr 1fr}}
@media(min-width:880px){
  .kpis{grid-template-columns:repeat(3,1fr)}
  .hero-main{grid-template-columns:auto 1fr;gap:22px}
  .hero-col .hero-val{font-size:44px}
  .hero-cols{gap:34px}
  .row2{grid-template-columns:3fr 2fr}
}

/* ===== 设备表 ===== */
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:12px;color:var(--text3);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--border)}
.table td{padding:12px;border-bottom:1px solid var(--border);font-size:13px}
.table tr:hover td{background:var(--hover)}
.dev{display:flex;align-items:center;gap:10px}
.dev-ic{width:34px;height:34px;border-radius:9px;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:none}

/* ===== 频段卡 ===== */
.band{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.band-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.band-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.band-name{font-size:16px;font-weight:600}
.band-chip{font-size:11px;color:var(--text2)}
.band-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);padding:5px 0}

/* ===== 组网模式 ===== */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mode{border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;background:var(--card);transition:.15s;text-align:left}
.mode:hover{border-color:var(--primary)}
.mode.sel{border:2px solid var(--primary);background:var(--primary-light)}
.mode .m-name{font-size:14px;font-weight:600}
.mode .m-desc{font-size:12px;color:var(--text2);margin:3px 0 10px}
.mode .m-tag{font-size:12px}
.mode-actions{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.mode-actions li{list-style:none;font-size:13px;padding:5px 0;display:flex;gap:8px;align-items:flex-start}
.mode-actions li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary);margin-top:7px;flex:none}

/* ===== 端口矩阵 ===== */
.ports{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.port{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.port .p-name{font-size:12px;color:var(--text3)}
.port .p-speed{font-size:15px;font-weight:600;margin:6px 0}
.port .p-state{font-size:12px}

/* ===== 进度条 ===== */
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:4px}
.res-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
.res-row:last-child{border-bottom:none}
.res-name{min-width:120px}
.res-ops{display:flex;gap:6px;flex-shrink:0}
.res-name{width:200px;min-width:130px}
.res-name b{display:block;font-size:13px;font-weight:600}
.res-note{font-size:11px;color:var(--text3)}
.res-bar-wrap{flex:1}
.res-pct{width:72px;text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.res-hero{padding:4px 0 2px}
.svc-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.svc-row:last-child{border-bottom:none}
.svc-info{flex:1;min-width:0}
.svc-name{font-size:14px;font-weight:600}
.svc-desc{font-size:12px;color:var(--text3);margin-top:2px}
.svc-status{font-size:12px;color:var(--text3);width:56px;text-align:center;flex:none}
.svc-status.on{color:var(--green);font-weight:600}

/* ===== 点阵屏 ===== */
.matrix-preview{width:200px;height:80px;background:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#39ff88;font-family:monospace;font-size:22px;letter-spacing:2px}
.check-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.check-row:last-child{border-bottom:none}
.check-row input{width:16px;height:16px}

/* ===== 系统 ===== */
.scan-list{display:flex;flex-direction:column;gap:8px}
.scan-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2)}
.scan-item.ok{color:var(--green)}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-row span:first-child{color:var(--text2)}

/* ===== 设置向导 ===== */
.wizard{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:radial-gradient(55% 45% at 20% 12%,rgba(90,167,238,.4),transparent 60%),radial-gradient(50% 45% at 82% 20%,rgba(167,139,250,.36),transparent 60%),radial-gradient(60% 50% at 55% 90%,rgba(91,211,196,.32),transparent 60%),linear-gradient(165deg,#eef3fa,#e4ebf5);padding:20px}
.wizard.show{display:flex}
.wizard-card{background:var(--card);border-radius:16px;padding:32px;width:500px;max-width:94vw;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.wizard-steps{display:flex;gap:8px;margin-bottom:26px}
.wstep{flex:1;height:4px;background:#e5e7eb;border-radius:2px;transition:.3s}
.wstep.done,.wstep.active{background:var(--primary)}
.wizard-body{min-height:200px}
.wizard-body h2{font-size:19px;margin-bottom:6px}
.wizard-body .sub{color:var(--text2);font-size:13px;margin-bottom:22px}
.wizard-foot{display:flex;justify-content:space-between;margin-top:26px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:.15s}
.opt:hover,.opt.sel{border-color:var(--primary);background:var(--primary-light)}
.opt .o-ic{width:36px;height:36px;border-radius:8px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px}
.opt .o-name{font-weight:500;font-size:14px}
.opt .o-desc{font-size:12px;color:var(--text2)}

/* ===== 顶栏图标按钮 / 通知中心 ===== */
.icon-btn{position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);border-radius:50%;color:var(--text2);cursor:pointer;transition:.15s;flex:none}
.icon-btn:hover{color:var(--primary);border-color:var(--primary)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;background:var(--red);color:#fff;font-size:11px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:600}
.notif-panel{position:absolute;top:46px;right:0;width:320px;max-height:420px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.15);display:none;z-index:120;text-align:left}
.notif-panel.show{display:block}
.notif-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;color:var(--text)}
.notif-head button{font-size:12px;color:var(--primary)}
.notif-item{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text)}
.notif-item:last-child{border-bottom:none}
.notif-item .n-ic{width:32px;height:32px;border-radius:8px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.notif-item .n-t{font-size:13px;line-height:1.4}
.notif-item .n-time{font-size:11px;color:var(--text3);margin-top:2px}
.notif-empty{padding:40px 16px;text-align:center;color:var(--text3);font-size:13px}

/* ===== 弹窗 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:130;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex}
.modal{background:var(--card);border-radius:14px;width:400px;max-width:94vw;padding:24px;box-shadow:0 16px 50px rgba(0,0,0,.25)}
.modal.lg{width:min(1180px,94vw);max-height:92vh;overflow-y:auto}
.modal.lg h3{font-size:18px}
.modal h3{font-size:16px;font-weight:600;margin-bottom:6px;color:var(--text)}
.modal .m-sub{font-size:13px;color:var(--text2);margin-bottom:18px}
.modal .m-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.modal input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:var(--input-bg);color:var(--text)}
.modal input[type=number]:focus{border-color:var(--primary)}
.limit-row{display:flex;gap:14px;margin-bottom:14px}
.limit-row>div{flex:1}
.limit-row label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}

/* ===== 插件嵌入面板（iframe 原生页 mock） ===== */
.modal.wide{width:760px}
.pl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px}
.pl-title{font-size:16px;font-weight:700;color:var(--text)}
.pl-sub{font-size:12px;color:var(--text2);margin-top:3px}
.pl-badge{font-size:11px;color:var(--green);background:var(--primary-light);padding:4px 10px;border-radius:12px;white-space:nowrap;flex:none}
.pl-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.pl-tab{padding:6px 14px;border-radius:16px;font-size:13px;color:var(--text2);background:var(--track);border:none;cursor:pointer}
.pl-tab.on{background:var(--primary);color:#fff}
.pl-mode-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.pl-node{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;font-size:13px}
.pl-node .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.pl-node.sel{border-color:var(--primary);background:var(--primary-light)}
.pl-note{font-size:11.5px;color:var(--text3);background:var(--track);border-radius:8px;padding:10px 12px;margin-top:14px;line-height:1.6}

/* ===== 系统日志 ===== */
.log-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.log-search{flex:1;min-width:160px}
.log-chips{display:flex;gap:6px;flex-wrap:wrap}
.log-chip{padding:4px 12px;border-radius:14px;font-size:12px;color:var(--text2);background:var(--track);cursor:pointer;border:1px solid transparent}
.log-chip.on{background:var(--primary);color:#fff}
.log-list{max-height:340px;overflow-y:auto;background:var(--track);border-radius:10px;padding:8px 0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.log-line{display:flex;gap:10px;padding:6px 14px;font-size:12px;line-height:1.55;color:var(--text2)}
.log-line .lt{flex:none;color:var(--text3)}
.log-line .lv{flex:none;width:44px;font-weight:600;text-transform:uppercase;font-size:11px;line-height:1.9}
.log-line .lv.info{color:var(--blue)}
.log-line .lv.warn{color:var(--amber)}
.log-line .lv.err{color:var(--red)}
.log-line .lv.debug{color:var(--text3)}
.log-line .lg{color:var(--text);word-break:break-all}
.log-empty{padding:36px 16px;text-align:center;color:var(--text3);font-size:13px}

/* ===== 软件包管理 ===== */
.pkg-toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pkg-search{flex:1;min-width:180px}
.pkg-tabs{display:flex;gap:6px}
.pkg-tab{padding:6px 14px;border-radius:16px;font-size:13px;color:var(--text2);background:var(--track);border:none;cursor:pointer}
.pkg-tab.on{background:var(--primary);color:#fff}
.pkg-list{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;padding-right:4px}
.pkg-row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--border)}
.pkg-row:last-child{border-bottom:none}
.pkg-info{flex:1;min-width:0}
.pkg-name{font-size:13.5px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.pkg-desc{font-size:12px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkg-ver{font-size:12px;color:var(--text2);flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.pkg-actions{display:flex;gap:6px;flex:none}
.pkg-empty{padding:36px 16px;text-align:center;color:var(--text3);font-size:13px}

/* ===== 移动端底部导航 ===== */
.mnav{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);z-index:50;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.mnav-inner{display:flex;justify-content:space-around}
.mnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--text3);padding:4px 6px;border-radius:8px;min-width:48px;background:none;border:none}
.mnav-item.active{color:var(--primary)}
.mnav-item svg{width:20px;height:20px}

/* ===== 流量趋势图 ===== */
.trend-tabs{display:flex;gap:8px;margin-bottom:16px}
.trend-tab{padding:6px 14px;border-radius:16px;font-size:13px;color:var(--text2);background:var(--track)}
.trend-tab.on{background:var(--primary);color:#fff}
.trend-legend{display:flex;gap:16px;font-size:12px;color:var(--text2);margin-top:12px}
.trend-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* ===== 体检报告 ===== */
.report{display:flex;gap:20px;align-items:center;margin-bottom:18px}
.report-score{width:88px;height:88px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--primary-light);color:var(--primary);flex:none}
.report-score b{font-size:28px;line-height:1}
.report-score span{font-size:11px;margin-top:2px}
.report-verdict{font-size:15px;font-weight:600;color:var(--text)}
.report-verdict small{display:block;font-size:12px;color:var(--text2);font-weight:400;margin-top:4px}
.report-advice{margin-top:14px;padding:12px 14px;background:var(--primary-light);border-radius:10px;font-size:13px;color:var(--text)}

/* ===== 暗黑模式针对性覆盖 ===== */
body.dark .nav-item.active,body.dark .dev-ic,body.dark .quick-btn .ic,body.dark .opt .o-ic{color:#7ab3e8}
body.dark .tag{background:#1f3a54;color:#9cc3e5}
body.dark .login{background:linear-gradient(160deg,#08121f 0%,#0f2438 55%,#14324f 100%)}

/* ===== 液态玻璃质感 ===== */
.card,.metric,.band-card,.quick-btn,.port,.pill,.icon-btn,.login-card,.wizard-card,.modal,.notif-panel,.mode-actions,.mode:not(.sel){
  background:var(--card);
  -webkit-backdrop-filter:var(--glass);
  backdrop-filter:var(--glass);
  box-shadow:var(--shadow),var(--glass-border);
}
.card,.metric,.login-card,.wizard-card,.modal{position:relative}
.card::before,.metric::before,.login-card::before,.wizard-card::before,.modal::before{
  content:"";position:absolute;inset:0;border-radius:inherit;padding:1.2px;
  background:linear-gradient(120deg,rgba(255,138,122,.42),rgba(255,196,107,.38),rgba(184,224,106,.32),rgba(107,216,200,.4),rgba(107,184,255,.5),rgba(155,138,255,.42),rgba(215,138,255,.4));
  -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  pointer-events:none;opacity:var(--iri-op);
}
.sidebar,.topbar,.mnav{
  background:rgba(255,255,255,.42);
  -webkit-backdrop-filter:blur(26px) saturate(170%);
  backdrop-filter:blur(26px) saturate(170%);
}
body.dark{
  background:radial-gradient(60% 50% at 15% 6%,rgba(var(--blob-c1),var(--blob-op1)),transparent 60%),radial-gradient(55% 45% at 88% 18%,rgba(var(--blob-c2),var(--blob-op2)),transparent 60%),radial-gradient(60% 50% at 55% 94%,rgba(var(--blob-c3),var(--blob-op3)),transparent 60%),var(--base-grad);
}
body.dark .sidebar,body.dark .topbar,body.dark .mnav{background:rgba(14,18,28,.55)}
body.dark .card::before,body.dark .metric::before,body.dark .login-card::before,body.dark .wizard-card::before,body.dark .modal::before{opacity:calc(var(--iri-op)*.55)}

/* ===== 液态玻璃主题设置弹窗 ===== */
.theme-presets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.theme-preset{display:flex;flex-direction:column;gap:4px;text-align:left;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--bg);transition:.15s;align-items:flex-start;cursor:pointer}
.theme-preset:hover{border-color:var(--primary)}
.theme-preset.on{border:2px solid var(--primary);background:var(--primary-light)}
.theme-preset .tp-ic{font-size:20px;line-height:1}
.theme-preset .tp-name{font-size:13px;font-weight:600;color:var(--text)}
.theme-preset .tp-desc{font-size:11.5px;color:var(--text3);line-height:1.5}
.theme-sec{font-size:13px;font-weight:600;color:var(--text);margin:18px 0 4px;padding-top:14px;border-top:1px solid var(--border)}
.theme-row{display:flex;align-items:center;gap:12px;padding:8px 0}
.theme-row label{font-size:13px;color:var(--text2);flex:0 0 88px}
.theme-row input[type=range]{flex:1;accent-color:var(--primary);height:4px;cursor:pointer}
.theme-row .tr-val{font-size:12px;color:var(--text);width:38px;text-align:right;flex:none;font-variant-numeric:tabular-nums}
.swatches{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.swatch{width:34px;height:34px;border-radius:10px;border:2px solid transparent;cursor:pointer;position:relative}
.swatch.on{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light)}

/* ===== 家长控制 / 防蹭网 / 文件共享（新增） ===== */
.pc-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap}
.pc-row:last-child{border-bottom:none}
.pc-dev{flex:1;min-width:150px;display:flex;align-items:center;gap:10px}
.pc-mac{font-size:11px;color:var(--text3);font-family:ui-monospace,Consolas,monospace}
.new-tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11px;background:#FDF1E0;color:var(--amber);font-weight:600}
.week-row{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.day-btn{padding:4px 10px;border-radius:14px;font-size:12px;color:var(--text2);background:var(--track);border:1px solid transparent;cursor:pointer}
.day-btn.on{background:var(--primary);color:#fff}
.time-row{display:flex;gap:10px;align-items:center;margin:4px 0}
.time-row input[type=time]{width:110px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:var(--input-bg);color:var(--text)}
.share-card{border:1px dashed var(--border);border-radius:12px;padding:16px;text-align:center}
.share-card .sc-ic{width:44px;height:44px;border-radius:12px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:20px}

@media(max-width:768px){
  .sidebar{display:none}
  .main{margin-left:0;padding:0 16px 96px}
  .speed-num{font-size:34px}
  .mnav{display:block}
  .notif-panel{width:280px;right:-70px}
  .pill.hide-m{display:none}
}
/* ===== 全站 v2 组件层（从预览稿注入，适配本后台变量）===== */
/* 主题化自定义下拉：隐藏原生 select，浮层玻璃化 */
.csel{position:relative;font-size:14px;min-width:0;display:block}
.csel-head{height:42px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 14px;border:1px solid var(--border);border-radius:12px;background:var(--input-bg);box-shadow:inset 0 1px 0 rgba(255,255,255,.05);color:var(--text);cursor:pointer;backdrop-filter:blur(4px);transition:.18s;user-select:none}
.csel-head:hover{border-color:var(--primary)}
.csel-head.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--track)}
.csel-head .arr{flex:none;width:16px;height:16px;transition:transform .2s;color:var(--text3)}
.csel-head.on .arr{transform:rotate(180deg);color:var(--primary)}
.csel-pop{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);z-index:40;display:none;max-height:224px;overflow-y:auto;padding:4px;scrollbar-width:thin;scrollbar-color:var(--text3) transparent}
.csel-pop::-webkit-scrollbar{width:6px}
.csel-pop::-webkit-scrollbar-thumb{background:var(--text3);border-radius:99px}
.csel-pop.open{display:block}
.csel-opt{padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--text);font-size:13.5px;line-height:1.4;transition:.12s}
.csel-opt:hover{background:var(--primary-light);color:var(--primary)}
.csel-opt.on{background:var(--primary-light);color:var(--primary);font-weight:600}
.sel-real{display:none !important}
/* 密码明文眼睛 */
.pwd-wrap{position:relative}
.pwd-wrap input{padding-right:42px}
.pwd-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;background:transparent;color:var(--text3);cursor:pointer;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.15s}
.pwd-eye:hover{background:var(--primary-light);color:var(--primary)}
.pwd-eye.on{color:var(--primary)}
/* 固件升级上传进度条 */
.up-bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden;margin-top:14px}
.up-fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--blue));transition:width .12s linear}
@keyframes spin{to{transform:rotate(360deg)}}
/* 移动端：底部导航 4×2 网格全显 + 列表窄屏舒展 */
@media (max-width:559px){
  .mnav-inner{flex-wrap:wrap;gap:4px}
  .mnav-item{flex:1 1 calc(25% - 4px);min-width:0}
  #views .table th:nth-child(2),#views .table td:nth-child(2){display:none}
  .svc-row .svc-info{flex:1 1 100%;min-width:0}
  .svc-row .btn.sm{flex:1;padding:0 6px;font-size:11px;height:30px;min-width:0}
  .res-row{gap:8px;padding:12px 0}
  .res-row .btn.sm{flex:1;padding:0 6px;font-size:11px;height:30px;min-width:0}
}

<script>
'use strict';
/* ========== 基础工具 ========== */
function sGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function sSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function sDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function toast(msg){
  var t=document.getElementById('toastBox');
  if(!t){ t=document.createElement('div'); t.id='toastBox'; t.style.cssText='position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:rgba(20,35,58,.92);color:#fff;padding:10px 20px;border-radius:10px;font-size:13px;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,.25);transition:.25s;opacity:0;pointer-events:none'; document.body.appendChild(t); }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._tm); t._tm=setTimeout(function(){ t.style.opacity='0'; },3200);
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtSpeed(mbps){ if(SPEED_UNIT==='MB/s') return {n:(mbps/8).toFixed(1), u:'MB/s'}; if(SPEED_UNIT==='KB/s') return {n:Math.round(mbps/8*1024), u:'KB/s'}; return {n:Math.round(mbps), u:'Mbps'}; }
function fmtDiskSize(mb){ mb=parseInt(mb,10); if(!mb||mb<=0) return '—'; if(mb>=1048576) return (mb/1048576).toFixed(1)+' TB'; if(mb>=1024) return (mb/1024).toFixed(1)+' GB'; return mb+' MB'; }
function fmtDur(s){ s=parseInt(s,10)||0; if(s<60) return s+' 秒'; if(s<3600) return Math.floor(s/60)+' 分 '+s%60+' 秒'; if(s<86400) return Math.floor(s/3600)+' 小时 '+Math.floor(s%3600/60)+' 分'; return Math.floor(s/86400)+' 天 '+Math.floor(s%86400/3600)+' 小时'; }

/* ========== 后端 RPC 适配层（rpcd file.exec + ubus） ========== */
const athenaRPC = {
  session:null, live:false, user:'root',
  async _call(sid,obj,method,params){
    const ctrl=new AbortController(); const timer=setTimeout(function(){ctrl.abort();},30000);
    try{
      const res=await fetch('/ubus/',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',signal:ctrl.signal,body:JSON.stringify({jsonrpc:'2.0',id:Math.floor(Math.random()*1e9),method:'call',params:[sid||'00000000000000000000000000000000',obj,method,params||{}]})});
      if(!res.ok){ if(res.status===401||res.status===403){ this._authFail(); throw new Error('登录会话已过期，请重新登录'); } throw new Error('HTTP '+res.status); }
      const j=await res.json(); if(j.error) throw new Error(j.error.message||'ubus error'); return j.result;
    }catch(e){ if(e&&e.name==='AbortError') throw new Error('操作超时（30s），请稍后重试'); throw e; }
    finally{ clearTimeout(timer); }
  },
  async tryLogin(user,pwd){
    try{
      const r=await this._call(null,'session','login',{username:user,password:pwd});
      if(r&&r[0]===0&&r[1]&&r[1].ubus_rpc_session){
        this.session=r[1].ubus_rpc_session; this.user=user; this.live=true; this._luciBridge(user,pwd);
        try{ sSet('athena_session',this.session); }catch(e){}
        return 'live';
      }
      if(r&&r[0]===6) return 'denied';
      return 'offline';
    }catch(e){ return 'offline'; }
  },
  async exec(file,args){
    /* rpcd file.exec 的 command 只接受可执行文件路径（含空格会被判 Not found），参数必须走 params 数组 */
    const sid=this.session||'00000000000000000000000000000000';
    const cmd='/usr/libexec/'+file;
    const params=args&&args.length?args.map(function(a){return String(a);}):[];
    const r=await this._call(sid,'file','exec',{command:cmd,params:params});
    if(r&&r[0]===0){
      const out=(r[1]&&r[1].stdout)||''; const rc=(r[1]&&r[1].rc)!=null?r[1].rc:0;
      if(rc!==0) throw new Error('命令返回码 '+rc);
      try{ return JSON.parse(out); }catch(e){ return {ok:true,_raw:out}; }
    }
    if(r&&(r[0]===5||r[0]===6)){ this._authFail(); throw new Error('登录会话已过期，请重新登录'); }
    throw new Error('RPC 调用失败');
  },
  async _write(path,b64){
    const r=await this._call(this.session,'file','write',{path:path,data:b64});
    if(!(r&&r[0]===0)) throw new Error('写入失败');
    return true;
  },
  /* 大文件 base64 分块写入：ubus file.write 一次塞 50MB 会触发 uhttpd/ubus 消息限制
     （表现为 "Failed to fetch" / 写入失败）。每块 512KB base64 字符（解码 384KB），
     offset 按解码字节数递增，第一块建文件，后续追加。 */
  async _writeChunked(path,b64,onProgress){
    const CHUNK=512*1024;                 /* base64 字符数/块 */
    const bytesPerChunk=CHUNK/4*3;        /* 解码字节数 */
    let off=0, idx=0;
    const total=Math.ceil(b64.length/CHUNK);
    if(total>40) toast('文件较大（'+(total/2).toFixed(0)+'MB），分块上传中，请耐心等待…');
    for(let i=0;i<total;i++){
      const part=b64.slice(i*CHUNK,(i+1)*CHUNK);
      const payload={path:path,data:part};
      if(i===0){ payload.mode=0x1a4; }      /* 0644 新建 */
      else{ payload.offset=off; }           /* 追加模式 */
      const r=await this._call(this.session,'file','write',payload);
      if(!(r&&r[0]===0)) throw new Error('写入失败（第'+(i+1)+'/'+total+'块）');
      off+=bytesPerChunk;
      idx++;
      if(typeof onProgress==='function'){ try{ onProgress((i+1)/total); }catch(e){} }
    }
    return true;
  },
  _luciBridge(user,pwd){
    /* 用 LuCI 原生登录表单种会话 cookie（sysauth），否则 /cgi-bin/luci 原生页（服务弹窗/原生界面）会判未登录而跳登录页 */
    try{
      const l=window.location; const base=l.protocol+'//'+l.host;
      const fd=new URLSearchParams(); fd.set('luci_username',user); fd.set('luci_password',pwd);
      fetch(base+'/cgi-bin/luci/',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},credentials:'same-origin',body:fd.toString(),redirect:'manual'}).catch(function(){});
    }catch(e){}
  },
  _authFail(){
    /* RPC 会话失效（HTTP 401/403 或 ubus 会话过期）：清状态并回到登录面板，避免"rpc 调取失败"死循环 */
    try{ this.live=false; this.session=null; sSet('athena_session',''); }catch(e){}
    const lg=document.getElementById('login'), app=document.getElementById('app');
    if(lg){ lg.style.display='flex'; if(app) app.classList.remove('show'); }
  }
};

let _STATUS=null;
async function ensureFreshStatus(){
  try{ const d=await athenaRPC.exec('athena-status.sh'); if(d&&d.system){ _STATUS=d; return true; } return false; }catch(e){ return false; }
}
function applyStatus(d){
  if(!d) return;
  if(d.system){ FIRMWARE_VER=d.system.firmware||''; KERNEL_VER=d.system.kernel||''; UPTIME_S=d.system.uptime||0; SYS_MODEL=d.system.model||''; }
  if(d.cpu){ cpu=parseInt(d.cpu.total||0,10); temp=parseInt(d.cpu.temp||0,10); }
  if(d.memory){ mem=parseInt(d.memory.pct||0,10); _MEM_TOTAL=parseInt(d.memory.total_mb||1024,10); _MEM_USED=parseInt(d.memory.used_mb||0,10); }
  if(d.network){ down=parseFloat(d.network.rx_rate_mbps||0); up=parseFloat(d.network.tx_rate_mbps||0); }
  if(d.ports) _PORTS=d.ports;
  if(d.clients) DEVS=d.clients.map(function(c,i){ return {id:i,name:c.hostname||c.ip,mac:c.mac||'',ip:c.ip||'',band:c.band||'有线',online:!!c.online,vendor:c.vendor||'',type:'other'}; });
  if(d.wan){ WAN_PROTO=d.wan.proto||WAN_PROTO; WAN_USER=d.wan.username||''; WAN_PWD=d.wan.password||''; WAN_DEV=d.wan.device||WAN_DEV; WAN_IP=d.wan.ip||WAN_IP;
    /* VLAN 参数真实回填：status 输出实际 VLAN（单臂模式由脚本配置，界面只读展示） */
    if(d.wan.wan_vlan) WAN_VLAN=d.wan.wan_vlan;
    if(d.wan.ret_vlan) INNER_VLAN=d.wan.ret_vlan;
    IPTV_VLAN=d.wan.iptv_vlan||'';
    if(d.wan.iptv_port) IPTV_PORT=d.wan.iptv_port;
  }
  if(d.matrix){ MATRIX.enabled=d.matrix.enabled; MATRIX.light_level=d.matrix.light_level!=null?d.matrix.light_level:MATRIX.light_level; MATRIX.night=!!d.matrix.night; MATRIX.profile=d.matrix.profile||MATRIX.profile; MATRIX.loaded=true; }
  if(d.mode && !modeUserSet) curMode=d.mode;
  _STATUS=d;
}
async function loadStatus(silent){
  try{
    const d=await athenaRPC.exec('athena-status.sh');
    applyStatus(d);
    if(hasExternalDisk===false && EXT_DISKS.length===0 && d.storage){ d.storage.forEach(function(s){ if(s.name.indexOf('sd')===0||s.name.indexOf('nvme')===0) hasExternalDisk=true; }); }

  }catch(e){}
}

      EXT_DISKS=[]; hasExternalDisk=false;
      d.disks.forEach(function(x){
        if(x.name.indexOf('sd')===0||x.name.indexOf('nvme')===0){ EXT_DISKS.push(x); hasExternalDisk=true; }
        else EMMC_DISK=x;
      });
      if(!hasExternalDisk&&_STORE_TOTAL===0) { /* 首页存储卡默认用 eMMC */ }
      var big=d.disks.slice().sort(function(a,b){return b.size_mb-a.size_mb;})[0];
      if(big){ _STORE_NAME=big.name; _STORE_TOTAL=big.size_mb; _STORE_USED=big.used_mb; _STORE_IS_EXT=(big.name.indexOf('sd')===0||big.name.indexOf('nvme')===0); }
      renderStorage();
    }
  }catch(e){}
}

/* ===== 液态玻璃主题（保留原样式体系） ===== */
const GLASS_PALETTES={aurora:[90,167,238,167,139,250,91,211,196],sunset:[248,173,86,243,114,132,140,93,226],ocean:[42,152,238,20,99,184,108,205,233],forest:[52,199,123,20,140,90,255,196,86],dark:[70,84,110,45,55,80,100,60,40]};
const GLASS_PRESETS=[
  {id:'aurora',name:'极光',desc:'蓝紫青渐变',ic:'🌌'},
  {id:'sunset',name:'日落',desc:'橙粉紫暖调',ic:'🌇'},
  {id:'ocean',name:'海洋',desc:'深海蓝渐变',ic:'🌊'},
  {id:'forest',name:'森林',desc:'绿金自然系',ic:'🌿'},
  {id:'custom',name:'自定义',desc:'自由调整 6 项参数',ic:'🎨'}
];
let GLASS_THEME={palette:'aurora',blob:100,glass:58,blur:20,iri:55,hi:70,_loaded:false};
function applyGlassTheme(){
  const p=GLASS_PALETTES[GLASS_THEME.palette]||GLASS_PALETTES.aurora;
  const r=document.documentElement;
  r.style.setProperty('--blob-c1',p[0]+','+p[1]+','+p[2]);
  r.style.setProperty('--blob-c2',p[3]+','+p[4]+','+p[5]);
  r.style.setProperty('--blob-c3',p[6]+','+p[7]+','+p[8]);
  r.style.setProperty('--blob-op1',(GLASS_THEME.blob/200).toFixed(2));
  r.style.setProperty('--blob-op2',(GLASS_THEME.blob/200*.85).toFixed(2));
  r.style.setProperty('--blob-op3',(GLASS_THEME.blob/200*.75).toFixed(2));
  r.style.setProperty('--glass-alpha',(GLASS_THEME.glass/100).toFixed(2));
  r.style.setProperty('--glass-blur',GLASS_THEME.blur+'px');
  r.style.setProperty('--iri-op',(GLASS_THEME.iri/100).toFixed(2));
  r.style.setProperty('--hi-op',(GLASS_THEME.hi/100).toFixed(2));
}
function loadGlassTheme(){ const t=sGet('athena_glass_theme'); if(t){ try{ const j=JSON.parse(t); Object.assign(GLASS_THEME,j); applyGlassTheme(); }catch(e){} } }
function openThemeModal(){
  openModal('<h3>液态玻璃外观</h3><div class="m-sub">实时预览 · 保存后写入设备配置，重启保留</div>'
    +'<div class="theme-presets">'+GLASS_PRESETS.map(function(pr){return '<button class="theme-preset '+(GLASS_THEME.palette===pr.id?'on':'')+'" data-p="'+pr.id+'" onclick="pickPalette(\''+pr.id+'\')"><span class="tp-ic">'+pr.ic+'</span><span class="tp-name">'+pr.name+'</span><span class="tp-desc">'+pr.desc+'</span></button>';}).join('')+'</div>'
    +'<div class="theme-sec">参数调节</div>'
    +'<div class="theme-row"><label>光斑强度</label><input type="range" min="20" max="200" value="'+GLASS_THEME.blob+'" oninput="window._tblob=this.value;setGlassParam(\'blob\',this.value)"><span class="tr-val">'+GLASS_THEME.blob+'</span></div>'
    +'<div class="theme-row"><label>玻璃不透明</label><input type="range" min="30" max="90" value="'+GLASS_THEME.glass+'" oninput="setGlassParam(\'glass\',this.value)"><span class="tr-val">'+GLASS_THEME.glass+'</span></div>'
    +'<div class="theme-row"><label>模糊程度</label><input type="range" min="4" max="40" value="'+GLASS_THEME.blur+'" oninput="setGlassParam(\'blur\',this.value)"><span class="tr-val">'+GLASS_THEME.blur+'</span></div>'
    +'<div class="theme-row"><label>光晕强度</label><input type="range" min="20" max="100" value="'+GLASS_THEME.iri+'" oninput="setGlassParam(\'iri\',this.value)"><span class="tr-val">'+GLASS_THEME.iri+'</span></div>'
    +'<div class="theme-row"><label>高光强度</label><input type="range" min="30" max="100" value="'+GLASS_THEME.hi+'" oninput="setGlassParam(\'hi\',this.value)"><span class="tr-val">'+GLASS_THEME.hi+'</span></div>'
    +'<div class="m-foot"><button class="btn" onclick="resetTheme()">恢复默认</button><button class="btn primary" onclick="saveGlassTheme()">保存</button></div>');
}
function pickPalette(p){ GLASS_THEME.palette=p; applyGlassTheme(); document.querySelectorAll('.theme-preset').forEach(function(x){x.classList.toggle('on',x.dataset.p===p);}); }
function setGlassParam(k,v){ GLASS_THEME[k]=parseInt(v,10); applyGlassTheme(); const s=document.querySelectorAll('.theme-row'); if(s.length){ s.forEach(function(x){ const l=x.querySelector('label'); if(l&&l.textContent.indexOf({blob:'光斑',glass:'玻璃',blur:'模糊',iri:'光晕',hi:'高光'}[k])>=0){ x.querySelector('.tr-val').textContent=v; } }); } }
function resetTheme(){ GLASS_THEME.palette='aurora'; GLASS_THEME.blob=100; GLASS_THEME.glass=58; GLASS_THEME.blur=20; GLASS_THEME.iri=55; GLASS_THEME.hi=70; applyGlassTheme(); pickPalette('aurora'); }
function saveGlassTheme(){
  if(!athenaRPC.live){ sSet('athena_glass_theme',JSON.stringify(GLASS_THEME)); toast('预览模式已保存到浏览器'); return; }
  athenaRPC.exec('athena-theme.sh',['set',GLASS_THEME.palette,String(GLASS_THEME.blob),String(GLASS_THEME.glass),String(GLASS_THEME.blur),String(GLASS_THEME.iri),String(GLASS_THEME.hi)]).then(function(){ sSet('athena_glass_theme',JSON.stringify(GLASS_THEME)); toast('主题已保存'); }).catch(function(e){ toast('保存失败：'+(e.message||'') ); });
}

/* ===== 导航 ===== */
function go(id){
  const tabs=['overview','wifi','devices','network','storage','lighting','maintain','advanced'];
  if(tabs.indexOf(id)<0) id='overview';
  document.querySelectorAll('.nav-item').forEach(function(n){n.classList.toggle('active',n.dataset.v===id);});
  document.querySelectorAll('.mnav-item').forEach(function(n){n.classList.toggle('active',n.dataset.v===id);});
  const v=document.getElementById('views'); v.dataset.view=id;
  document.getElementById('pageTitle').textContent=PAGE_TITLES[id];
  v.innerHTML=VIEWS[id]();
  window.scrollTo(0,0);
  if(id==='devices'&&!athenaRPC.live&&DEVS.length===0) loadClients();
  if(id==='network'){ loadStatus(true).then(function(){ renderNetwork(); }); renderModeActs(); }
  if(id==='lighting'){ if(!MATRIX.loaded) loadMatrix(); if(!LED.loaded) loadLed(); }
  if(id==='maintain'){ loadBackupList(); loadRebootStatus(); }
  if(id==='advanced'){ loadResources(); loadServices(); loadPackageList(); if(!UI_MODE.loaded) loadUiMode(); }
  if(id==='storage'){ if(athenaRPC.live) loadDisks(); else renderStorage(); }
}
function renderNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML=NAV.map(function(n){return '<button class="nav-item'+(n.id==='overview'?' active':'')+'" data-v="'+n.id+'" onclick="go(\''+n.id+'\')">'+iconSVG(n.id)+'<span>'+n.name+'</span></button>';}).join('');
  const mn=document.getElementById('mnavInner');
  mn.innerHTML=NAV.map(function(n){return '<button class="mnav-item'+(n.id==='overview'?' active':'')+'" data-v="'+n.id+'" onclick="go(\''+n.id+'\')">'+iconSVG(n.id)+'<span>'+n.name+'</span></button>';}).join('');
}

/* ===== 首页 v2 双曲线实时网速（v1.2.19） ===== */
const SPARK_MAX=60; let _sparkDn=[], _sparkUp=[];
function pushSpark(d,u){
  _sparkDn.push(d||0); _sparkUp.push(u||0);
  if(_sparkDn.length>SPARK_MAX){ _sparkDn.shift(); _sparkUp.shift(); }
  drawSpark();
}
function drawSpark(){
  const lnD=document.getElementById('spLineDn'), arD=document.getElementById('spAreaDn');
  const lnU=document.getElementById('spLineUp'), arU=document.getElementById('spAreaUp');
  if(!lnD) return;
  const W=300,H=86,PAD=2,h=H-18;
  const aD=_sparkDn.length?_sparkDn:[0], aU=_sparkUp.length?_sparkUp:[0];
  const maxD=Math.max.apply(null,aD.concat([1]))*1.15;
  const maxU=Math.max.apply(null,aU.concat([1]))*1.15;
  function line(a,max){
    let s='M'+PAD+' '+(h-(a[0]/max)*h).toFixed(1);
    for(let i=1;i<a.length;i++){ s+=' L'+(PAD+(W-PAD*2)*i/(SPARK_MAX-1)).toFixed(1)+' '+(h-(a[i]/max)*h).toFixed(1); }
    return s;
  }
  function area(a,max){ return line(a,max)+' L'+(W-PAD)+' '+H+' L'+PAD+' '+H+' Z'; }
  lnD.setAttribute('d',line(aD,maxD)); arD.setAttribute('d',area(aD,maxD));
  lnU.setAttribute('d',line(aU,maxU)); arU.setAttribute('d',area(aU,maxU));
  const pk=document.getElementById('pkTxt');
  if(pk){ const v=Math.max.apply(null,aD.concat(aU)); pk.textContent=(v>100?Math.round(v):v.toFixed(1))+' Mbps'; }
  const dnPk=document.getElementById('dnPk'), upPk=document.getElementById('upPk');
  if(dnPk){ const m=Math.max.apply(null,aD); dnPk.textContent=(m>100?Math.round(m):m.toFixed(1))+' Mbps'; }
  if(upPk){ const m=Math.max.apply(null,aU); upPk.textContent=(m>100?Math.round(m):m.toFixed(1))+' Mbps'; }
}
function updateLiveNumbers(){
  const dn=document.getElementById('dnV'), up=document.getElementById('upV');
  const dnU=document.getElementById('dnUnit'), upU=document.getElementById('upUnit');
  if(dn){ const f=fmtSpeed(down); dn.textContent=f.n; dnU.textContent=f.u; }
  if(up){ const f=fmtSpeed(up); up.textContent=f.n; upU.textContent=f.u; }

function drawTrend(){
  const c=document.getElementById('trendCanvas'); if(!c) return;
  const dpr=2; c.width=c.clientWidth*dpr; c.height=110*dpr;
  const g=c.getContext('2d'); g.scale(dpr,dpr);
  const w=c.clientWidth,h=110;
  g.clearRect(0,0,w,h);
  const max=Math.max.apply(null,_trend.length?_trend:[1])*1.15;
  g.strokeStyle='rgba(24,95,165,.12)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke();
  g.strokeStyle='#185FA5'; g.lineWidth=2; g.lineJoin='round';
  if(_trend.length<2) return;
  g.beginPath();
  _trend.forEach(function(v,i){ const x=(i/(TREND_MAX-1))*w; const y=h-4-(v/max)*(h-8); i===0?g.moveTo(x,y):g.lineTo(x,y); });
  g.stroke();
  g.strokeStyle='rgba(24,95,165,.06)';
  g.beginPath(); g.moveTo(0,h); _trend.forEach(function(v,i){ g.lineTo((i/(TREND_MAX-1))*w,h); }); g.lineTo(w,h); g.closePath(); g.fillStyle='rgba(24,95,165,.05)'; g.fill();
}

function saveWan(){
  const proto=WAN_PROTO;
  let args=[];
  if(proto==='pppoe'){
    const u=document.getElementById('wanUser').value.trim(), p=document.getElementById('wanPwd').value;
    if(!u){ toast('请填写宽带账号'); return; }
    args=[u,p];

    const ip=document.getElementById('stIp').value.trim(), mask=document.getElementById('stMask').value.trim(), gw=document.getElementById('stGw').value.trim(), dns=document.getElementById('stDns').value.trim();

    args=[ip,mask,gw,dns];
  }

  confirmApply('athena-mode.sh',['ap'],function(){ curMode='ap'; modeUserSet=true; toast('AP 桥接模式已应用'); loadStatus(true); });

function saveBypass(){
  const ip=document.getElementById('bpIp').value.trim(), gw=document.getElementById('bpGw').value.trim(), dns=document.getElementById('bpDns').value.trim();

function confirmApply(file,args,onOk){
  /* 参数存入全局对象再弹确认：内联 onclick 作用域解析不到形参（ReferenceError），
     必须由 doApply() 无参读取，否则确认应用按钮完全失效 */
  window._applyCfg={f:file,a:args,ok:onOk};
  openModal('<h3>应用网络配置？</h3><div class="m-sub">切换上网模式会重建网络接口，WiFi 与有线会短暂断开（约 10-30 秒），属正常现象。</div><div class="m-foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" onclick="closeModal();doApply()">确认应用</button></div>');
  window.doApply=function(){
    const cfg=window._applyCfg||{};
    const f=cfg.f,a=cfg.a,ok=cfg.ok;
    athenaRPC.exec(f,a).then(function(){
      if(ok) ok();
    }).catch(function(e){ toast('应用失败：'+(e.message||'')); });
  };
}
/* ===== 诊断与测速 ===== */
function runScan(){
  const el=document.getElementById('diagList'); el.innerHTML='<div class="scan-item">◌ 正在全面体检…</div>';
  athenaRPC.exec('athena-scan.sh').then(function(d){
    if(!d||!d.items){ el.innerHTML='<div class="scan-item err">体检无返回</div>'; return; }
    const bad=d.items.filter(function(i){return i.ok===false;});
    el.innerHTML=d.items.map(function(i){
      const ok=i.ok===true;
      const st=i.status||(ok?'ok':'err');
      let ic,color;
      if(st==='warn'){ ic='⚠'; color='var(--amber)'; }
      else if(ok){ ic='✓'; color='var(--green)'; }
      else { ic='✗'; color='var(--red)'; }
      return '<div class="scan-item" style="color:'+color+'">'+ic+' '+esc(i.detail||i.msg||i.name)+'</div>';
    }).join('')
      +(d.score!=null?'<div style="margin-top:10px;font-weight:600;font-size:13px">体检评分：'+(bad.length?'<span style="color:var(--amber)">'+d.score+' 分</span>':'<span style="color:var(--green)">'+d.score+' 分</span>')+'（'+bad.length+' 项异常）</div>':'');
  }).catch(function(e){ el.innerHTML='<div class="scan-item err">体检失败：'+esc(e.message||'')+'</div>'; });
}
function runDiag(){
  const el=document.getElementById('diagList'); el.innerHTML='<div class="scan-item">◌ 正在检测外网连通性…</div>';
  athenaRPC.exec('athena-diag.sh',['check']).then(function(d){
    el.innerHTML=(d.items||[]).map(function(i){return '<div class="scan-item '+(i.ok?'ok':'')+'" style="color:'+(i.ok?'var(--green)':'var(--red)')+'">'+(i.ok?'✓':'✗')+' '+esc(i.name)+'（'+esc(i.msg||'—')+'）</div>';}).join('')||'<div class="scan-item err">无结果</div>';
  }).catch(function(e){ el.innerHTML='<div class="scan-item err">检测失败：'+esc(e.message||'')+'</div>'; });
}
function runPing(){
  const host=document.getElementById('pingHost').value.trim()||'223.5.5.5';
  const r=document.getElementById('pingResult'); r.innerHTML='正在 Ping '+esc(host)+'（4 次）…';
  athenaRPC.exec('athena-diag.sh',['ping',host,'4']).then(function(d){
    if(d&&d.error){ r.innerHTML='<span style="color:var(--red)">'+esc(d.error)+'</span>'; return; }
    r.innerHTML='延迟：<b>'+((d.avg_ms!=null)?d.avg_ms:'—')+'ms</b>（丢包 '+d.loss_pct+'% · 抖动 '+((d.jitter_ms!=null)?d.jitter_ms:'—')+'ms）';
  }).catch(function(e){ r.innerHTML='<span style="color:var(--red)">Ping 失败：'+esc(e.message||'')+'</span>'; });

let resTab='cpu'; let SERVICES=[], PKGS=[];
function pickRes(t){ resTab=t;

function loadResources(){
  athenaRPC.exec('athena-resources.sh').then(function(d){
    if(!d) return;
    const head=document.getElementById('resHead'); if(head){
      const v=resTab==='cpu'?d.cpu:d.memory;
      head.innerHTML='<div class="res-hero"><div class="speed-label">'+(resTab==='cpu'?'CPU 占用':'内存占用')+'</div><div class="speed-num" style="font-size:38px">'+(resTab==='cpu'?(d.cpu&&d.cpu.total||0):(v?v.pct||0:0))+'<span class="speed-unit">%</span></div><div class="speed-label" style="font-size:11px;margin-top:2px">'+(resTab==='cpu'?'进程 % 为占单核比例（多核可叠加）':'已用内存含系统缓存，进程 % 为实际占用')+'</div></div>';
    }
    const list=document.getElementById('resList'); if(list){
      const procs=(d.procs||[]).slice();
      const useMem=(resTab==='mem');
      // 按当前 tab 口径重新排序：CPU tab 按 CPU% 降序，内存 tab 按内存% 降序，保证与概览总量一致
      procs.sort(function(a,b){ return ((useMem?b.mem:b.cpu)||0)-((useMem?a.mem:a.cpu)||0); });
      const top=procs.slice(0,12);
      const isPrev=!!(window.ATHENA_PREVIEW&&window.ATHENA_PREVIEW.on);
      list.innerHTML=top.length?top.map(function(p){
        const pct=(useMem?p.mem:p.cpu)||0;
        const name=p.label||p.name||'?';
        const note=p.desc||('PID '+p.pid);
        const pid=parseInt(p.pid,10)||0;
        return '<div class="res-row"><div class="res-name"><b>'+esc(name)+'</b><span class="res-note">'+esc(note)+'</span></div><div class="res-bar-wrap"><div class="bar"><i style="width:'+Math.min(100,parseInt(pct,10))+'%"></i></div></div><div class="res-pct">'+pct+'%</div><div class="res-ops">'
          +((pid>1&&!p.prot)?'<button class="btn sm" onclick="procAction('+pid+',\''+esc(name.replace(/'/g,"\\'"))+'\',\'restart\')">重启</button><button class="btn sm danger" onclick="procAction('+pid+',\''+esc(name.replace(/'/g,"\\'"))+'\',\'stop\')">停止</button>':'')
          +'</div></div>';
      }).join(''):'<div style="padding:16px 0;color:var(--text3);font-size:13px">'+(isPrev?'预览模式：未连接路由器，暂无数据':'正在读取进程数据…')+'</div>';
    }
  }).catch(function(){
    const list=document.getElementById('resList');
    if(list&&window.ATHENA_PREVIEW&&window.ATHENA_PREVIEW.on&&list.innerHTML.indexOf('正在读取进程数据')>=0){
      list.innerHTML='<div style="padding:16px 0;color:var(--text3);font-size:13px">预览模式：未连接路由器，暂无数据</div>';
    }
  });
}

/* ===== 设置向导（新机引导） ===== */
let WIZ={step:0,mode:'router',user:'',pwd:'',ip:'',gw:'',vlan:'',ret:'',iptv:'',iptvPort:'lan4',proto:'pppoe',nss:'on'};
const WIZ_STEPS=['欢迎','上网方式','账号信息','完成'];
function wizardShow(){ document.getElementById('wizard').classList.add('show'); WIZ.step=0; WIZ.user=''; WIZ.pwd=''; WIZ.ip=''; WIZ.gw=''; wRender(); }
function wizardClose(){ document.getElementById('wizard').classList.remove('show'); }
function skipWizard(){
  sSet('athena_wizard_done','1');
  wizardClose();
  toast('已跳过，之后可在「网络」页随时配置');
}
function wRender(){
  const steps=document.getElementById('wsteps');
  steps.innerHTML=WIZ_STEPS.map(function(s,i){return '<div class="wstep '+(i<WIZ.step?'done':i===WIZ.step?'active':'')+'"></div>';}).join('');
  const body=document.getElementById('wbody');
  const next=document.getElementById('wnext'); next.textContent='下一步';
  const prev=document.getElementById('wprev'); prev.style.visibility=WIZ.step>0?'visible':'hidden';
  if(WIZ.step===0){
    body.innerHTML='<h2>欢迎使用 AthenaWrt</h2><div class="sub">几步完成上网配置，全家设备即可正常上网</div>'
      +'<button class="opt sel" data-m="router" onclick="wPickMode(\'router\')"><span class="o-ic">🔌</span><span><div class="o-name">宽带拨号（主路由）</div><div class="o-desc">输入宽带账号密码，路由器负责拨号上网</div></span></button>'
      +'<button class="opt" data-m="ap" onclick="wPickMode(\'ap\')"><span class="o-ic">📶</span><span><div class="o-name">AP 扩展</div><div class="o-desc">接在主路由下面，扩展全家 WiFi 信号</div></span></button>'
      +'<button class="opt" data-m="bypass" onclick="wPickMode(\'bypass\')"><span class="o-ic">🌐</span><span><div class="o-name">旁路由</div><div class="o-desc">作为透明网关使用（高级）</div></span></button>';
  } else if(WIZ.step===1){
    body.innerHTML='<h2>'+(WIZ.mode==='router'?'宽带拨号设置':WIZ.mode==='ap'?'AP 扩展设置':'旁路由设置')+'</h2><div class="sub">'+({router:'输入运营商提供的宽带账号和密码',ap:'把 2.5G 口接到主路由 LAN 口即可',bypass:'填写旁路由与主路由网关'}[WIZ.mode])+'</div>';
    if(WIZ.mode==='router'){
      body.innerHTML+='<div class="limit-row"><div><label>宽带账号</label><input id="wUser" value="'+esc(WIZ.user)+'"></div><div><label>宽带密码</label><input id="wPwd" type="password" value="'+esc(WIZ.pwd)+'"></div></div>';
    } else if(WIZ.mode==='bypass'){
      body.innerHTML+='<div class="limit-row"><div><label>旁路由 IP</label><input id="wIp" value="'+esc(WIZ.ip||'192.168.10.2')+'"></div><div><label>主路由网关</label><input id="wGw" value="'+esc(WIZ.gw||'192.168.10.1')+'"></div></div>';
    } else {
      body.innerHTML+='<div style="font-size:13px;color:var(--text2);padding:10px 0">请确认 2.5G 口已用网线连接主路由 LAN 口，然后点「完成」。</div>';
    }
  } else {
    body.innerHTML='<h2>即将应用配置</h2><div class="sub">应用后网络会短暂断开（10-30 秒），属正常现象</div>'
      +'<div style="font-size:13px;color:var(--text2);padding:10px 0">模式：'+(WIZ.mode==='router'?'宽带拨号':WIZ.mode==='ap'?'AP 扩展':'旁路由')+(WIZ.mode==='router'?' · 账号：'+esc(WIZ.user):'')+'</div>';

}
function wPickMode(m){ WIZ.mode=m; document.querySelectorAll('#wbody .opt').forEach(function(x){x.classList.toggle('sel',x.dataset.m===m);}); }
function wPrev(){ if(WIZ.step>0){ WIZ.step--; wRender(); } }
function wNext(){
  if(WIZ.step===1){
    const u=document.getElementById('wUser'), p=document.getElementById('wPwd');
    const ip=document.getElementById('wIp'), gw=document.getElementById('wGw');
    if(u) WIZ.user=u.value; if(p) WIZ.pwd=p.value;
    if(ip) WIZ.ip=ip.value; if(gw) WIZ.gw=gw.value;
  }
  if(WIZ.step<2){ WIZ.step++; wRender(); return; }
  applyWizardConfig();
}
function applyWizardConfig(){
  const args=(function(){
    if(WIZ.mode==='router'){
      const u=(WIZ.user||'').trim(), p=WIZ.pwd;
      if(!u){ toast('请填写宽带账号'); WIZ.step=1; wRender(); return null; }
      return ['router','pppoe',u,p];
    }
    if(WIZ.mode==='ap') return ['ap'];
    const ip=(WIZ.ip||'').trim(), gw=(WIZ.gw||'').trim();
    if(!ip||!gw){ toast('请填写旁路由 IP 与网关'); WIZ.step=1; wRender(); return null; }
    return ['bypass',ip,gw,gw];
  })();
  if(!args) return;
  document.getElementById('wnext').disabled=true;
  /* 网络配置类应用：切换时连接会短暂断开，fetch 报 "Failed to fetch" 是预期而非失败。
     流程：发出请求 → 若连接被切换打断 → 轮询等待网络恢复 → 恢复后执行成功分支；
           若请求被拒绝（参数错误等）→ 真失败。 */
  let cmdFailed=false;
  athenaRPC.exec('athena-mode.sh',args).then(function(){}).catch(function(e){
    const m=String((e&&e.message)||'');
    /* 仅"命令返回码"= 后端真拒绝（参数/脚本错误），必须提示失败，不能吞掉；
       "Failed to fetch" 是网络切换导致的连接中断，属预期，继续轮询等待网络恢复 */
    if(m.indexOf('返回码')>=0) cmdFailed=true;
  });
  /* 后端脚本很快完成（uci 写盘 + 重启网络），等 1.2s 让配置真正应用、网络开始切换 */
  setTimeout(function(){
    if(cmdFailed){
      document.getElementById('wnext').disabled=false;
      toast('配置命令执行失败，请检查参数后重试');
      return;
    }
    let tries=0;
    const poll=setInterval(function(){
      tries++;
      if(tries>30){ clearInterval(poll); document.getElementById('wnext').disabled=false; toast('网络恢复等待超时，请刷新页面确认配置是否生效'); return; }
      athenaRPC.exec('athena-status.sh').then(function(d){
        clearInterval(poll);
        wizardApplied(args,d);
      }).catch(function(){ /* 网络还没恢复，继续轮询 */ });
    },2000);
  },1200);
}
function wizardApplied(args,d){
  sSet('athena_wizard_done','1'); toast('配置完成，正在生效'); wizardClose();
  loadStatus(true);
}

/* ===== 全站 v2 组件层（从预览稿注入，自动增强，无需改动页面模板）===== */
/* 1. 主题化自定义下拉：所有原生 select 自动替换为玻璃浮层（含动态弹窗） */
function buildCsel(sel){
  if(sel._csel) return;
  sel._csel=true;
  const wrap=document.createElement('div'); wrap.className='csel';
  if(sel.getAttribute('style')){ wrap.setAttribute('style',sel.getAttribute('style')); }
  const head=document.createElement('div'); head.className='csel-head'; head.setAttribute('tabindex','0');
  head.innerHTML='<span class="csel-val"></span><svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>';
  const pop=document.createElement('div'); pop.className='csel-pop';
  function sync(){
    const v=sel.options[sel.selectedIndex]?sel.options[sel.selectedIndex].text:'';
    head.querySelector('.csel-val').textContent=v;
    pop.innerHTML='';
    const opts=sel.querySelectorAll('option');
    for(let j=0;j<opts.length;j++){
      (function(j,o){
        const d=document.createElement('div'); d.className='csel-opt'+(o.selected?' on':'');
        d.textContent=o.textContent;
        d.onclick=function(){
          sel.selectedIndex=j;
          try{ sel.dispatchEvent(new Event('change',{bubbles:true})); }catch(e){}
          pop.classList.remove('open'); head.classList.remove('on');
          sync();
        };
        pop.appendChild(d);
      })(j,opts[j]);
    }
  }
  function toggle(force){
    const open=force!=null?force:!pop.classList.contains('open');
    pop.classList.toggle('open',open); head.classList.toggle('on',open);
    if(open) sync();
  }
  head.onclick=function(e){ e.stopPropagation(); toggle(); };
  head.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(); } };
  document.addEventListener('click',function(e){ if(!wrap.contains(e.target)) toggle(false); });
  sel.classList.add('sel-real');
  wrap.appendChild(head); wrap.appendChild(pop);
  sel.parentNode.insertBefore(wrap,sel.nextSibling);
  sync();
}
function enhanceSelects(root){
  const sels=(root&&root.querySelectorAll?root:document).querySelectorAll('select');
  for(let i=0;i<sels.length;i++){ try{ buildCsel(sels[i]); }catch(e){} }
}
try{
  const selMO=new MutationObserver(function(muts){
    for(let i=0;i<muts.length;i++){
      const nodes=muts[i].addedNodes;
      for(let j=0;j<nodes.length;j++){ if(nodes[j].querySelectorAll){ enhanceSelects(nodes[j]); enhancePwds(nodes[j]); } }
    }
  });
  selMO.observe(document.body,{childList:true,subtree:true});
}catch(e){}
/* 2. 密码明文眼睛：所有密码框自动包眼睛（登录/网络表单/修改密码/向导全覆盖） */
window.togglePwd=function(btn){
  let inp=btn.previousElementSibling;
  if(!inp||inp.tagName!=='INPUT'){
    const w=btn.closest('.pwd-wrap'); inp=w?w.querySelector('input'):null;
  }
  if(!inp) return;
  const show=inp.type==='password';
  inp.type=show?'text':'password';
  btn.classList.toggle('on',show);
};
function enhancePwds(root){
  const scope=root&&root.querySelectorAll?root:document;
  const ins=scope.querySelectorAll('input[type="password"]');
  for(let i=0;i<ins.length;i++){
    const p=ins[i];
    if(p.closest('.pwd-wrap')) continue;
    const wrap=document.createElement('div'); wrap.className='pwd-wrap';
    p.parentNode.insertBefore(wrap,p);
    wrap.appendChild(p);
    const eye=document.createElement('button'); eye.type='button'; eye.className='pwd-eye'; eye.title='显示/隐藏密码';
    eye.innerHTML='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
    eye.onclick=function(e){ e.preventDefault(); window.togglePwd(eye); };
    wrap.appendChild(eye);
  }
}
/* 3. 固件升级：上传进度条版（分块上传逐块推进，100% 后进入校验升级） */
window.openUpgrade=function(){
  openModal('<h3>固件升级</h3><div class="m-sub">升级需要先上传固件文件（.bin）。升级会保留配置。设备将自动重启，请勿断电。</div>'
    +'<div class="limit-row"><div><label>选择固件文件</label><input type="file" id="fwFile" accept=".bin"></div></div>'
    +'<div id="upWrap" style="display:none"><div class="up-bar"><div class="up-fill" id="upFill" style="width:0"></div></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span id="upPct" style="font-size:12px;color:var(--text3)">0%</span><span id="upSpd" style="font-size:12px;color:var(--text3)">0.0 MB/s</span></div></div>'
    +'<div class="m-foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" id="upGo" onclick="doUpgrade()">上传并升级</button></div>');
};
window.doUpgrade=function(){
  const f=document.getElementById('fwFile').files[0];
  if(!f){ toast('请先选择固件文件'); return; }
  const btn=document.getElementById('upGo'); if(btn){ btn.disabled=true; btn.textContent='上传中…'; }
  const wrap=document.getElementById('upWrap'); if(wrap) wrap.style.display='block';
  const fr=new FileReader();
  fr.onload=function(){
    const b64=fr.result.split(',')[1];
    const t0=Date.now(), total=b64.length;
    athenaRPC._writeChunked('/tmp/athena-fw.b64',b64,function(p){
      const el=document.getElementById('upFill'), pc=document.getElementById('upPct'), sp=document.getElementById('upSpd');
      if(el) el.style.width=Math.round(p*100)+'%';
      if(pc) pc.textContent=Math.round(p*100)+'%';
      if(sp&&p>0) sp.textContent=((total*p/1024/1024)/((Date.now()-t0)/1000)).toFixed(1)+' MB/s';
    }).then(function(){
      const el=document.getElementById('upFill'); if(el) el.style.width='100%';
      const pc=document.getElementById('upPct'); if(pc) pc.textContent='100%';
      toast('上传完成，正在校验并升级…');
      athenaRPC.exec('athena-upgrade.sh',['flash','/tmp/athena-fw.b64']).then(function(){ toast('升级已开始，路由器将重启'); setTimeout(function(){ location.reload(); },15000); }).catch(function(e){ toast('升级失败：'+(e.message||'')); });
    }).catch(function(e){ toast('上传失败：'+(e.message||'')); });
  };
  fr.readAsDataURL(f);
};
/* 注入完成后：增强当前已渲染的 select 与密码框 */
enhanceSelects(document);
enhancePwds(document);

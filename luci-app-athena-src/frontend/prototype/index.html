<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AthenaWrt · 雅典娜管理台</title>
<style>
:root{
  --primary:#185FA5; --primary-light:#E6F1FB; --primary-dark:#0C447C;
  --bg:#eef2f7; --card:rgba(255,255,255,var(--glass-alpha)); --text:#14233a; --text2:#5b6b82; --text3:#8a97a8;
  --border:rgba(255,255,255,.7); --green:#16a34a; --red:#dc2626; --amber:#d97706; --blue:#378ADD;
  --track:rgba(24,95,165,.10); --hover:rgba(255,255,255,.62);
  --radius:18px; --shadow:0 10px 36px rgba(31,61,110,.10);
  --input-bg:rgba(255,255,255,.5);
  --glass:blur(var(--glass-blur)) saturate(var(--glass-sat));
  --glass-border:inset 0 1px 0 rgba(255,255,255,var(--hi-op));
  /* 液态玻璃主题变量（可在「系统工具→液态玻璃外观」自定义） */
  --blob-c1:90,167,238; --blob-c2:167,139,250; --blob-c3:91,211,196;
  --blob-op1:.5; --blob-op2:.42; --blob-op3:.38;
  --glass-alpha:.58; --glass-blur:20px; --glass-sat:160%;
  --iri-op:.55; --hi-op:.7;
  --base-grad:linear-gradient(165deg,#f3f6fb 0%,#e7edf6 100%);
}
body.dark{
  --primary-light:#14324f; --bg:#0a0e16; --card:rgba(22,27,38,var(--glass-alpha-dark)); --text:#e8ecf4; --text2:#9aa6b8; --text3:#5f6b7d;
  --border:rgba(255,255,255,.10); --track:rgba(255,255,255,.07); --hover:rgba(255,255,255,.06); --shadow:0 10px 36px rgba(0,0,0,.5);
  --input-bg:rgba(255,255,255,.08);
  --glass-border:inset 0 1px 0 rgba(255,255,255,var(--hi-op-dark));
  --glass-alpha-dark:.55; --hi-op-dark:.06;
  --blob-op1:.28; --blob-op2:.22; --blob-op3:.18;
  --base-grad:linear-gradient(165deg,#0a0e16,#0d1320);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(60% 50% at 15% 6%,rgba(var(--blob-c1),var(--blob-op1)),transparent 60%),radial-gradient(55% 45% at 88% 18%,rgba(var(--blob-c2),var(--blob-op2)),transparent 60%),radial-gradient(60% 50% at 55% 94%,rgba(var(--blob-c3),var(--blob-op3)),transparent 60%),var(--base-grad);background-attachment:fixed;color:var(--text);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
svg{display:block}

/* ===== 登录页 ===== */
.login{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:radial-gradient(55% 45% at 20% 12%,rgba(var(--blob-c1),var(--blob-op1)),transparent 60%),radial-gradient(50% 45% at 82% 20%,rgba(var(--blob-c2),var(--blob-op2)),transparent 60%),radial-gradient(60% 50% at 55% 90%,rgba(var(--blob-c3),var(--blob-op3)),transparent 60%),var(--base-grad)}
.login-card{background:var(--card);border-radius:16px;padding:40px;width:360px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.logo-badge{width:40px;height:40px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:20px}
.login-card h1{font-size:18px;font-weight:600}
.login-card .sub{color:var(--text2);font-size:13px;margin-bottom:28px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}
.field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:var(--input-bg);color:var(--text);transition:border-color .15s}
.field input:focus{border-color:var(--primary)}
/* 统一玻璃化表单控件：覆盖所有散落的 input/select，避免浏览器默认白底直角 */
.limit-row input,.modal input[type=text],.modal input[type=password],.modal input[type=time],.modal input[type=number],.modal input[type=file],.field select,.modal select{
  width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;
  background:var(--input-bg);color:var(--text);font-family:inherit;transition:border-color .15s;
}
.limit-row input:focus,.modal input:focus,.field select:focus,.modal select:focus{border-color:var(--primary)}
body.dark .limit-row input,body.dark .modal input,body.dark .field select,body.dark .modal select{color-scheme:dark}
.login-btn{width:100%;padding:12px;background:var(--primary);color:#fff;border-radius:8px;font-size:15px;font-weight:500}
.login-btn:hover{background:var(--primary-dark)}
.login-tip{margin-top:16px;font-size:12px;color:var(--text3);text-align:center}
.login-err{margin-top:12px;font-size:12px;color:var(--red);text-align:center;display:none}

/* ===== 主框架 ===== */
.app{display:none;min-height:100vh}
.app.show{display:flex}
.sidebar{width:232px;background:var(--card);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:18px 20px;border-bottom:1px solid var(--border)}
.sidebar .brand .logo-badge{width:34px;height:34px;border-radius:9px;font-size:17px}
.sidebar .brand span{font-weight:600;font-size:15px}
.sidebar .brand small{display:block;color:var(--text3);font-size:11px;font-weight:400}
.nav{flex:1;padding:12px 10px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:9px;color:var(--text2);font-size:14px;margin-bottom:2px;transition:.15s;width:100%;text-align:left}
.nav-item:hover{background:var(--bg)}
.nav-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:500}
.nav-item svg{flex:none;opacity:.9}
.sidebar .foot{padding:14px 20px;border-top:1px solid var(--border)}
.sidebar .foot .adv{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed var(--border);border-radius:9px;color:var(--text2);font-size:13px;width:100%}

.main{flex:1;margin-left:232px;padding:0 28px 40px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;margin:14px 0 18px;position:sticky;top:12px;border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow),var(--glass-border);z-index:10}
.topbar h2{font-size:20px;font-weight:600}
.topbar .meta{display:flex;align-items:center;gap:16px;color:var(--text2);font-size:13px}
.pill{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--card);border:1px solid var(--border);border-radius:20px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.metric.clickable{cursor:pointer;transition:.15s}
.metric.clickable:hover{border-color:var(--primary)}

.view{display:none;animation:fade .2s}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ===== 通用卡片 ===== */
.grid{display:grid;gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.card h3{font-size:14px;font-weight:600;margin-bottom:14px}
.card .hint{font-size:12px;color:var(--text3);font-weight:400;margin-left:8px}
.row{display:flex;gap:16px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px 24px}
.metric .label{font-size:13px;color:var(--text2)}
.metric .value{font-size:26px;font-weight:600;margin-top:4px}
.metric .delta{font-size:12px;color:var(--text3)}
/* 首页指标卡：默认全显，3 列 → 2 列 → 1 列自适应 */
.metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.metrics-grid .metric{margin:0}
.metric.drag{cursor:grab}
.metric.drag:active{cursor:grabbing}
.metric .drag-handle{position:absolute;top:10px;right:12px;color:var(--text3);opacity:0;transition:.15s;font-size:14px}
.metric:hover .drag-handle{opacity:1}
@media(max-width:1100px){.metrics-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.metrics-grid{grid-template-columns:1fr}}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;background:var(--primary-light);color:var(--primary-dark)}
.tag.green{background:#E8F5EC;color:var(--green)}
.tag.red{background:#FBEAEA;color:var(--red)}
.tag.amber{background:#FDF1E0;color:var(--amber)}
.tag.blue{background:#E8F0FB;color:var(--primary)}
.tag.gray{background:#F1F3F4;color:var(--text2)}
.btn{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid var(--border);color:var(--text2);background:#fff;transition:.15s}
.btn:hover{border-color:var(--primary);color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-dark);color:#fff}
.btn.sm{padding:5px 12px;font-size:12px}
.btn.danger{color:var(--red)}
.btn.danger:hover{border-color:var(--red);color:var(--red)}
.switch{position:relative;width:40px;height:22px;background:#d1d5db;border-radius:11px;transition:.2s;flex:none}
.switch.on{background:var(--green)}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s}
.switch.on::after{left:20px}

/* ===== 首页 ===== */
.speed-hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.speed-num{font-size:44px;font-weight:600;line-height:1}
.speed-unit{font-size:14px;color:var(--text2);margin-left:4px}
.speed-label{font-size:13px;color:var(--text2);margin-bottom:6px}
.speed-dir{display:flex;align-items:center;gap:12px}
.arrow-dn{color:var(--blue)}.arrow-up{color:var(--green)}
.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.quick-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);transition:.15s}
.quick-btn:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.quick-btn .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--primary-light);color:var(--primary)}
.quick-btn span{font-size:13px}

/* ===== 设备表 ===== */
.table{width:100%;border-collapse:collapse}
.table th{text-align:left;font-size:12px;color:var(--text3);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--border)}
.table td{padding:12px;border-bottom:1px solid var(--border);font-size:13px}
.table tr:hover td{background:var(--hover)}
.dev{display:flex;align-items:center;gap:10px}
.dev-ic{width:34px;height:34px;border-radius:9px;background:var(--primary-light);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex:none}

/* ===== 频段卡 ===== */
.band{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.band-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.band-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.band-name{font-size:16px;font-weight:600}
.band-chip{font-size:11px;color:var(--text2)}
.band-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text2);padding:5px 0}

/* ===== 组网模式 ===== */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mode{border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;background:var(--card);transition:.15s;text-align:left}
.mode:hover{border-color:var(--primary)}
.mode.sel{border:2px solid var(--primary);background:var(--primary-light)}
.mode .m-name{font-size:14px;font-weight:600}
.mode .m-desc{font-size:12px;color:var(--text2);margin:3px 0 10px}
.mode .m-tag{font-size:12px}
.mode-actions{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px}
.mode-actions li{list-style:none;font-size:13px;padding:5px 0;display:flex;gap:8px;align-items:flex-start}
.mode-actions li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary);margin-top:7px;flex:none}

/* ===== 端口矩阵 ===== */
.ports{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.port{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.port .p-name{font-size:12px;color:var(--text3)}
.port .p-speed{font-size:15px;font-weight:600;margin:6px 0}
.port .p-state{font-size:12px}

/* ===== 进度条 ===== */
.bar{height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:4px}
.res-row{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.res-row:last-child{border-bottom:none}
.res-name{width:200px;min-width:130px}
.res-name b{display:block;font-size:13px;font-weight:600}
.res-note{font-size:11px;color:var(--text3)}
.res-bar-wrap{flex:1}
.res-pct{width:72px;text-align:right;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.res-hero{padding:4px 0 2px}
.svc-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.svc-row:last-child{border-bottom:none}
.svc-info{flex:1;min-width:0}
.svc-name{font-size:14px;font-weight:600}
.svc-desc{font-size:12px;color:var(--text3);margin-top:2px}
.svc-status{font-size:12px;color:var(--text3);width:56px;text-align:center;flex:none}
.svc-status.on{color:var(--green);font-weight:600}

/* ===== 点阵屏 ===== */
.matrix-preview{width:200px;height:80px;background:#111;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#39ff88;font-family:monospace;font-size:22px;letter-spacing:2px}
.check-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.check-row:last-child{border-bottom:none}
.check-row input{width:16px;height:16px}

/* ===== 系统 ===== */
.scan-list{display:flex;flex-direction:column;gap:8px}
.scan-item{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--text2)}
.scan-item.ok{color:var(--green)}
.info-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-row span:first-child{color:var(--text2)}

/* ===== 设置向导 ===== */
.wizard{position:fixed;inset:0;z-index:90;display:none;align-items:center;justify-content:center;background:radial-gradient(55% 45% at 20% 12%,rgba(90,167,238,.4),transparent 60%),radial-gradient(50% 45% at 82% 20%,rgba(167,139,250,.36),transparent 60%),radial-gradient(60% 50% at 55% 90%,rgba(91,211,196,.32),transparent 60%),linear-gradient(165deg,#eef3fa,#e4ebf5);padding:20px}
.wizard.show{display:flex}
.wizard-card{background:var(--card);border-radius:16px;padding:32px;width:500px;max-width:94vw;box-shadow:0 12px 40px rgba(0,0,0,.12)}
.wizard-steps{display:flex;gap:8px;margin-bottom:26px}
.wstep{flex:1;height:4px;background:#e5e7eb;border-radius:2px;transition:.3s}
.wstep.done,.wstep.active{background:var(--primary)}
.wizard-body{min-height:200px}
.wizard-body h2{font-size:19px;margin-bottom:6px}
.wizard-body .sub{color:var(--text2);font-size:13px;margin-bottom:22px}
.wizard-foot{display:flex;justify-content:space-between;margin-top:26px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:.15s}
.opt:hover,.opt.sel{border-color:var(--primary);background:var(--primary-light)}
.opt .o-ic{width:36px;height:36px;border-radius:8px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:16px}
.opt .o-name{font-weight:500;font-size:14px}
.opt .o-desc{font-size:12px;color:var(--text2)}

/* ===== 顶栏图标按钮 / 通知中心 ===== */
.icon-btn{position:relative;width:38px;height:38px;display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--border);border-radius:50%;color:var(--text2);cursor:pointer;transition:.15s;flex:none}
.icon-btn:hover{color:var(--primary);border-color:var(--primary)}
.badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;background:var(--red);color:#fff;font-size:11px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:600}
.notif-panel{position:absolute;top:46px;right:0;width:320px;max-height:420px;overflow-y:auto;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.15);display:none;z-index:120;text-align:left}
.notif-panel.show{display:block}
.notif-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px;color:var(--text)}
.notif-head button{font-size:12px;color:var(--primary)}
.notif-item{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text)}
.notif-item:last-child{border-bottom:none}
.notif-item .n-ic{width:32px;height:32px;border-radius:8px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.notif-item .n-t{font-size:13px;line-height:1.4}
.notif-item .n-time{font-size:11px;color:var(--text3);margin-top:2px}
.notif-empty{padding:40px 16px;text-align:center;color:var(--text3);font-size:13px}

/* ===== 弹窗 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:130;display:none;align-items:center;justify-content:center;padding:20px}
.modal-mask.show{display:flex}
.modal{background:var(--card);border-radius:14px;width:400px;max-width:94vw;padding:24px;box-shadow:0 16px 50px rgba(0,0,0,.25)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:6px;color:var(--text)}
.modal .m-sub{font-size:13px;color:var(--text2);margin-bottom:18px}
.modal .m-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.modal input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;outline:none;background:var(--input-bg);color:var(--text)}
.modal input[type=number]:focus{border-color:var(--primary)}
.limit-row{display:flex;gap:14px;margin-bottom:14px}
.limit-row>div{flex:1}
.limit-row label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px}

/* ===== 插件嵌入面板（iframe 原生页 mock） ===== */
.modal.wide{width:760px}
.pl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border);margin-bottom:14px}
.pl-title{font-size:16px;font-weight:700;color:var(--text)}
.pl-sub{font-size:12px;color:var(--text2);margin-top:3px}
.pl-badge{font-size:11px;color:var(--green);background:var(--primary-light);padding:4px 10px;border-radius:12px;white-space:nowrap;flex:none}
.pl-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.pl-tab{padding:6px 14px;border-radius:16px;font-size:13px;color:var(--text2);background:var(--track);border:none;cursor:pointer}
.pl-tab.on{background:var(--primary);color:#fff}
.pl-mode-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.pl-node{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;font-size:13px}
.pl-node .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.pl-node.sel{border-color:var(--primary);background:var(--primary-light)}
.pl-note{font-size:11.5px;color:var(--text3);background:var(--track);border-radius:8px;padding:10px 12px;margin-top:14px;line-height:1.6}

/* ===== 系统日志 ===== */
.log-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.log-search{flex:1;min-width:160px}
.log-chips{display:flex;gap:6px;flex-wrap:wrap}
.log-chip{padding:4px 12px;border-radius:14px;font-size:12px;color:var(--text2);background:var(--track);cursor:pointer;border:1px solid transparent}
.log-chip.on{background:var(--primary);color:#fff}
.log-list{max-height:340px;overflow-y:auto;background:var(--track);border-radius:10px;padding:8px 0;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.log-line{display:flex;gap:10px;padding:6px 14px;font-size:12px;line-height:1.55;color:var(--text2)}
.log-line .lt{flex:none;color:var(--text3)}
.log-line .lv{flex:none;width:44px;font-weight:600;text-transform:uppercase;font-size:11px;line-height:1.9}
.log-line .lv.info{color:var(--blue)}
.log-line .lv.warn{color:var(--amber)}
.log-line .lv.err{color:var(--red)}
.log-line .lv.debug{color:var(--text3)}
.log-line .lg{color:var(--text);word-break:break-all}
.log-empty{padding:36px 16px;text-align:center;color:var(--text3);font-size:13px}

/* ===== 软件包管理 ===== */
.pkg-toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.pkg-search{flex:1;min-width:180px}
.pkg-tabs{display:flex;gap:6px}
.pkg-tab{padding:6px 14px;border-radius:16px;font-size:13px;color:var(--text2);background:var(--track);border:none;cursor:pointer}
.pkg-tab.on{background:var(--primary);color:#fff}
.pkg-list{max-height:360px;overflow-y:auto;display:flex;flex-direction:column;padding-right:4px}
.pkg-row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--border)}
.pkg-row:last-child{border-bottom:none}
.pkg-info{flex:1;min-width:0}
.pkg-name{font-size:13.5px;font-weight:600;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.pkg-desc{font-size:12px;color:var(--text3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pkg-ver{font-size:12px;color:var(--text2);flex:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.pkg-actions{display:flex;gap:6px;flex:none}
.pkg-empty{padding:36px 16px;text-align:center;color:var(--text3);font-size:13px}

/* ===== 移动端底部导航 ===== */
.mnav{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--border);z-index:50;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.mnav-inner{display:flex;justify-content:space-around}
.mnav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--text3);padding:4px 6px;border-radius:8px;min-width:48px;background:none;border:none}
.mnav-item.active{color:var(--primary)}
.mnav-item svg{width:20px;height:20px}

/* ===== 流量趋势图 ===== */
.trend-tabs{display:flex;gap:8px;margin-bottom:16px}
.trend-tab{padding:6px 14px;border-radius:16px;font-size:13px;color:var(--text2);background:var(--track)}
.trend-tab.on{background:var(--primary);color:#fff}
.trend-legend{display:flex;gap:16px;font-size:12px;color:var(--text2);margin-top:12px}
.trend-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle}

/* ===== 体检报告 ===== */
.report{display:flex;gap:20px;align-items:center;margin-bottom:18px}
.report-score{width:88px;height:88px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--primary-light);color:var(--primary);flex:none}
.report-score b{font-size:28px;line-height:1}
.report-score span{font-size:11px;margin-top:2px}
.report-verdict{font-size:15px;font-weight:600;color:var(--text)}
.report-verdict small{display:block;font-size:12px;color:var(--text2);font-weight:400;margin-top:4px}
.report-advice{margin-top:14px;padding:12px 14px;background:var(--primary-light);border-radius:10px;font-size:13px;color:var(--text)}

body.dark .nav-item.active,body.dark .dev-ic,body.dark .quick-btn .ic,body.dark .opt .o-ic{color:#7ab3e8}
body.dark .tag{background:#1f3a54;color:#9cc3e5}
body.dark .login{background:linear-gradient(160deg,#08121f 0%,#0f2438 55%,#14324f 100%)}

.sidebar,.topbar,.mnav{

}
body.dark{

function cycleUnit(){

  SPEED_UNIT = SPEED_UNITS[(i+1)%SPEED_UNITS.length];
  sSet('athena_speed_unit', SPEED_UNIT);
  var p=document.getElementById('unitPill'); if(p) p.textContent=SPEED_UNIT;
  var _dn=document.getElementById('dn'); if(_dn){ var f=fmtSpeed(down); _dn.textContent=f.n; var _du=document.getElementById('dnUnit'); if(_du)_du.textContent=f.u; }
  var _up=document.getElementById('up'); if(_up){ var g=fmtSpeed(up); _up.textContent=g.n; var _uu=document.getElementById('upUnit'); if(_uu)_uu.textContent=g.u; }

/* ========== 首页指标卡：数据驱动 + 可排序 + eMMC 条件显示 ========== */
let METRIC_ORDER = (function(){ try{ var o=JSON.parse(sGet('athena_metric_order')||'null'); return o||['dev','wifi','storage','mem','cpu','temp']; }catch(e){ return ['dev','wifi','storage','mem','cpu','temp']; } })();
function buildMetrics(){
  const ext = hasExternalDisk;
  const wifiOn = WIFI_BANDS.filter(function(b){return b.on;}).length;
  const storePct = _STORE_TOTAL>0 ? Math.round(_STORE_USED/_STORE_TOTAL*100) : 0;
  // 首页存储卡：显示容量最大的那块盘（外挂盘大就显示外挂盘）
  const storeLabel = _STORE_IS_EXT ? '外挂硬盘' : 'eMMC 存储';
  const storeName = _STORE_IS_EXT ? (' · '+_STORE_NAME) : '';
  return {
    dev:{label:'在线设备', value:online, unit:'', delta:'在线 '+online+' 台', click:"go('clients')", title:'查看设备管理'},
    wifi:{label:'三频无线', value:wifiOn, unit:'频全开', delta:'2.4G · 5.2G · 5.8G', click:"go('wireless')", title:'查看无线三频'},
    storage:{label: storeLabel, value:storePct, unit:'%', delta:'已用 '+fmtDiskSize(_STORE_USED)+' / '+fmtDiskSize(_STORE_TOTAL)+storeName, click:"go('storage')", title:'查看存储共享'},
    mem:{label:'运存占用', value:mem, unit:'%', delta:'已用 '+_MEM_USED+'MB / '+_MEM_TOTAL+'MB', click:"showRes('mem')", title:'查看内存占用详情'},
    cpu:{label:'CPU 占用', value:cpu, unit:'%', delta:'四核 · 负载正常', click:"showRes('cpu')", title:'查看 CPU 占用详情'},
    temp:{label:'CPU 温度', value:temp, unit:'°C', delta:'被动散热 · 正常', click:"go('system')", title:'查看系统温度'}
  };
}
function metricsHTML(){
  var m = buildMetrics();
  return METRIC_ORDER.map(function(id){
    var it = m[id]; if(!it) return '';
    return '<div class="metric clickable drag" data-mid="'+id+'" style="position:relative" onclick="'+it.click+'" title="'+it.title+'">'
      + '<span class="drag-handle" onclick="event.stopPropagation();openSortModal()" title="排序">⠿</span>'
      + '<div class="label">'+it.label+'</div>'
      + '<div class="value">'+it.value+'<span class="speed-unit">'+it.unit+'</span></div>'
      + '<div class="delta">'+it.delta+'</div></div>';
  }).join('');
}
function renderMetrics(){ var g=document.getElementById('metricsGrid'); if(g) g.innerHTML=metricsHTML(); }
function openSortModal(){
  var m = buildMetrics();
  var rows = METRIC_ORDER.map(function(id,i){
    return '<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)">'
      + '<span style="flex:1;font-size:13px">'+m[id].label+'</span>'
      + '<button class="btn sm" '+(i===0?'disabled style="opacity:.3"':'')+' onclick="moveMetric(\''+id+'\',-1)">↑</button>'
      + '<button class="btn sm" '+(i===METRIC_ORDER.length-1?'disabled style="opacity:.3"':'')+' onclick="moveMetric(\''+id+'\',1)">↓</button></div>';
  }).join('');
  openModal('<h3>自定义指标卡排序</h3><div class="m-sub">调整首页 6 个指标卡的显示顺序（默认全部显示，窄屏自动换行）</div>'+rows+'<div class="m-foot"><button class="btn primary" onclick="closeModal()">完成</button></div>');
}
function moveMetric(id,dir){
  var i=METRIC_ORDER.indexOf(id), j=i+dir;
  if(j<0||j>=METRIC_ORDER.length) return;
  var t=METRIC_ORDER[i]; METRIC_ORDER[i]=METRIC_ORDER[j]; METRIC_ORDER[j]=t;
  sSet('athena_metric_order', JSON.stringify(METRIC_ORDER));
  renderMetrics(); openSortModal();
}

// 预览环境可能是沙箱 iframe，localStorage 会抛 SecurityError，这里做安全封装
function sGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function sSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

/* ========== 后端 RPC 适配层 ==========
 * 真机：通过 ubus JSON-RPC 调用 rpcd（session.login + file.exec）
 * 本地原型：无后端（/ubus/ 不可达），自动降级为模拟数据
 */
const athenaRPC = {
  session: null,
  live: false,
  user: 'root',
  // ubus JSON-RPC 调用，返回 [code, data]
  async _call(sid, obj, method, params){
    const res = await fetch('/ubus/', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'same-origin',
      body: JSON.stringify({jsonrpc:'2.0', id: Math.floor(Math.random()*1e9), method:'call',
        params: [sid || '00000000000000000000000000000000', obj, method, params || {}]})
    });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const j = await res.json();
    if(j.error) throw new Error(j.error.message || 'ubus error');
    return j.result;
  },
  // 尝试登录：'live'=认证成功 | 'denied'=密码错 | 'offline'=非真机环境
  async tryLogin(user, pwd){
    try {
      const r = await this._call(null, 'session', 'login', {username: user, password: pwd});
      if(r && r[0] === 0 && r[1] && r[1].ubus_rpc_session){
        this.session = r[1].ubus_rpc_session;
        this.user = user;
        this.live = true;
        this._luciBridge(user, pwd);
        return 'live';
      }
      return 'denied';
    } catch(e) {
      this.live = false;
      return 'offline';
    }
  },
  // 打通 LuCI 登录：SPA 登录成功后同步用同一组凭证走 LuCI 官方登录，使浏览器拿到
  // sysauth_http(HttpOnly) cookie，这样「高级模式」打开 LuCI 时免二次登录。
  _luciBridge(user, pwd){
    try {
      fetch('/cgi-bin/luci/admin/status/overview', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        credentials: 'same-origin',
        body: 'luci_username='+encodeURIComponent(user)+'&luci_password='+encodeURIComponent(pwd)
      }).catch(function(){});
    } catch(e) {}
  },
  // 执行后端脚本，返回解析后的 JSON（失败抛异常）
  async exec(script, params){
    if(!this.live) throw new Error('not live');
    const r = await this._call(this.session, 'file', 'exec',
      {command: '/usr/libexec/'+script, params: params || []});
    if(!r || r[0] !== 0 || !r[1]) throw new Error('exec failed');
    const out = (r[1].stdout || '').trim();
    const err = (r[1].stderr || '').trim();
    // 优先解析 JSON；即便脚本退出码非 0，只要带 JSON 就返回（调用方按 ok 字段判断）
    if(out){ try { return JSON.parse(out); } catch(e){ /* fallthrough */ } }
    if(r[1].code !== 0) throw new Error(err || ('exit '+r[1].code));
    return {ok:true, raw: out};
  },
  // 同步真实状态（首页指标），成功后回调刷新
  async syncStatus(cb){
    try {
      const d = await this.exec('athena-status.sh');
      if(d){
        _STATUS = d;
        if(d.network){ down = d.network.rx_rate_mbps || 0; up = d.network.tx_rate_mbps || 0; }
        if(d.cpu){ temp = d.cpu.temp || temp; cpu = d.cpu.total || cpu; }
        if(d.memory){ mem = d.memory.pct || mem; if(d.memory.total_mb) _MEM_TOTAL = d.memory.total_mb; if(d.memory.used_mb!=null) _MEM_USED = d.memory.used_mb; }
        if(d.clients){ online = d.clients.filter(function(c){return c.online;}).length; }
        if(d.mode){ curMode = d.mode; }
        // 回读 WAN 配置（避免"已设宽带账号密码又变默认"）
        if(d.wan){
          if(d.wan.proto) WAN_PROTO = d.wan.proto;
          if(d.wan.username) WAN_USER = d.wan.username;
          if(d.wan.password) WAN_PWD = d.wan.password;
          if(d.wan.wan_vlan) VLAN_LAN = d.wan.wan_vlan;
          if(d.wan.ret_vlan) RETURN_VLAN = d.wan.ret_vlan;
          if(d.wan.iptv_vlan !== undefined) IPTV_VLAN = d.wan.iptv_vlan || '';
        }
        // 回读存储（选中容量最大的盘作为首页存储卡）
        if(d.storage && d.storage.length){
          var biggest = null;
          d.storage.forEach(function(s){ if(!biggest || (+s.size_mb||0) > (+biggest.size_mb||0)) biggest = s; });
          if(biggest){
            _STORE_TOTAL = (+biggest.size_mb) || _STORE_TOTAL;
            _STORE_USED = (+biggest.used_mb) || 0;
            _STORE_NAME = biggest.name || '';
            _STORE_IS_EXT = (biggest.name.indexOf('mmcblk0') !== 0);
          }
        }
        // 端口状态（供网络组网页矩阵）
        if(d.ports){ _PORTS = d.ports; }
        // 点阵屏状态
        if(d.matrix){ MATRIX.enabled = !!d.matrix.enabled; if(d.matrix.light_level!=null) MATRIX.light_level = +d.matrix.light_level; MATRIX.night = !!d.matrix.night; if(d.matrix.profile) MATRIX.profile = d.matrix.profile; }
      }
      if(cb) cb();
    } catch(e) { /* 后端暂不可达，保持当前值 */ }
  }
};

/* ========== 真实数据加载层（字段映射 + 失败降级） ========== */
let _STATUS = null;      // 最近一次 athena-status.sh 完整结果缓存

// 秒 → 时长文本（"2h 14m" / "45m" / "12s"）
function fmtDur(sec){
  sec = parseInt(sec, 10) || 0;
  if(sec <= 0) return '—';
  var d = Math.floor(sec/86400), h = Math.floor(sec%86400/3600), m = Math.floor(sec%3600/60);
  if(d > 0) return d+'d '+h+'h';
  if(h > 0) return h+'h '+m+'m';
  if(m > 0) return m+'m';
  return sec+'s';
}
// vendor 文本 → 设备类型（图标 / 分类）
function guessType(vendor){
  var v = (vendor || '');
  if(/苹果|Apple|iPhone|iPad/i.test(v)) return 'phone';
  if(/电视|TV|创维|海信|TCL|乐视/i.test(v)) return 'tv';
  if(/电脑|笔记本|MacBook|ThinkPad|PC|华硕/i.test(v)) return 'pc';
  if(/音箱|音响|Speaker|小爱|Sonos/i.test(v)) return 'speaker';
  if(/摄像头|Camera|监控|海康|大华/i.test(v)) return 'cam';
  if(/灯泡|智能|小米|华为|荣耀|OPPO|vivo|手机/i.test(v)) return /手机/i.test(v) ? 'phone' : 'bulb';
  return 'other';
}

const athenaData = {
  async _run(script, params){
    if(!athenaRPC.live) throw new Error('offline');
    return athenaRPC.exec(script, params);
  },
  // 资源进程排行（resources.sh → procs[]）
  async procs(){
    const d = await this._run('athena-resources.sh');
    const ps = (d && d.procs) || [];
    return ps.map(p => ({ name:p.name||'?', pid:p.pid||0, cpu:+p.cpu||0, mem:+p.mem||0, note:'', restartable:false, critical:false }));
  },
  // 客户端列表（status.sh → clients[]，含真实 online 判定）
  async clients(){
    const d = _STATUS || await this._run('athena-status.sh');
    const list = (d && d.clients) || [];
    return list.map((c,i) => ({
      id:i+1, name: c.hostname || c.ip || c.mac || ('设备'+(i+1)),
      type: guessType(c.vendor || ''),
      ip: c.ip || '—', mac: c.mac || '',
      band: c.band || '有线', online: !!c.online,
      dur: '—', down: null, up: null, rssi: null, total: null
    }));
  },
  // 运行服务（services.sh → services[]）
  async services(){
    const d = await this._run('athena-services.sh');
    const svc = (d && d.services) || [];
    if(!svc.length) return SERVICES;
    return svc.map(s => ({ id:s.id, name:s.name, desc:s.desc||'', on:!!s.on, path:s.path||'' }));
  },
  // 系统日志（log.sh → logs[]）
  async logs(){
    const d = await this._run('athena-log.sh');
    const logs = (d && d.logs) || [];
    return logs.map(l => ({ t:'', lv: l.level||'info', tag:'', msg: l.msg||'' }));
  },
  // 软件包（packages.sh → packages[]，sub: installed|available）
  async packages(sub){
    const d = await this._run('athena-packages.sh', ['list', sub || 'installed']);
    const pkgs = (d && d.packages) || [];
    if(!pkgs.length) return PKGS;
    return pkgs.map(p => ({ name:p.name||'', ver:p.version||'', desc:'', installed:!!p.installed, update:false }));
  }
};

function doLogin(){
  var user = document.getElementById('user') ? document.getElementById('user').value : 'root';
  var pwd = document.getElementById('pwd').value;
  if(!pwd){ document.getElementById('loginErr').style.display='block'; return; }
  athenaRPC.tryLogin(user, pwd).then(function(state){
    if(state === 'live'){
      enterApp();
    } else if(state === 'offline' && (pwd === 'admin' || pwd === 'password')){
      enterApp();  // 本地原型：无后端，演示模式
    } else {
      document.getElementById('loginErr').style.display='block';
      document.getElementById('pwd').value=''; document.getElementById('pwd').focus();
    }
  });
}
function enterApp(){
  document.getElementById('login').style.display='none';
  if(sGet('athena_wizard_done')==='1'){ showApp(); }
  else { showWizard(); }
}

function pickRes(t){ resTab=t; renderRes(); }
function renderRes(){
  var tabs=document.querySelectorAll('.trend-tab');
  if(tabs.length>=2){ tabs[0].classList.toggle('on', resTab==='cpu'); tabs[1].classList.toggle('on', resTab==='mem'); }
  var head=document.getElementById('resHead'); if(!head) return;
  if(resTab==='cpu'){
    head.innerHTML='<div class="res-hero"><div class="speed-num" style="font-size:34px" id="resCpuNum">'+cpu+'<span class="speed-unit">%</span></div><div class="delta">四核 A53 @1.8GHz · 当前 CPU 总占用</div></div>';
    renderResRows('cpu');
  } else {
    head.innerHTML='<div class="res-hero"><div class="speed-num" style="font-size:34px" id="resMemNum">'+mem+'<span class="speed-unit">%</span></div><div class="delta">已用 '+_MEM_USED+'MB / '+_MEM_TOTAL+'MB · 当前内存总占用</div></div>';
    renderResRows('mem');
  }
}
function renderResRows(type){
  var list=document.getElementById('resList'); if(!list) return;
  if(!RES_PROCS.length){
    list.innerHTML='<div style="padding:32px 0;text-align:center;color:var(--text3);font-size:13px">'+(athenaRPC.live?'正在读取进程数据…':'进程数据由后端实时采集')+'</div>';
    return;
  }
  var rows=RES_PROCS.slice().sort(function(a,b){ return (type==='cpu'?b.cpu:b.mem)-(type==='cpu'?a.cpu:a.mem); });
  list.innerHTML=rows.map(function(p){
    var pct=type==='cpu'?p.cpu:p.mem;
    return '<div class="res-row"><div class="res-name"><b>'+p.name+'</b><span class="res-note">PID '+p.pid+'</span></div><div class="res-bar-wrap"><div class="bar"><i style="width:'+Math.min(100,pct)+'%"></i></div></div><div class="res-pct">'+pct.toFixed(1)+'%</div></div>';
  }).join('');
}

function toggleSvc(id){
  var s=SERVICES.find(function(x){return x.id===id;}); if(!s) return;
  var target = !s.on;
  s.on = target;
  var row=document.getElementById('svc-'+id); if(!row) return;
  var st=row.querySelector('.svc-status');
  st.className='svc-status '+(s.on?'on':'');
  st.textContent=s.on?'运行中':'已停止';
  row.querySelector('.switch').classList.toggle('on', s.on);
  if(!athenaRPC.live){ toast(s.on? s.name+' 已启动' : s.name+' 已停止'); return; }
  toast('正在'+(target?'启动':'停止')+' '+s.name+' …');
  athenaRPC.exec('athena-services.sh', ['set', id, target?'1':'0']).then(function(r){
    if(r && r.ok!==false){ toast(s.name+(target?' 已启动':' 已停止')); }

function go(id){
  currentView = id;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.v===id));
  document.querySelectorAll('.mnav-item').forEach(n=>n.classList.toggle('active', n.dataset.m===id));
  document.getElementById('pageTitle').textContent = NAV.find(n=>n.id===id).name;
  document.getElementById('views').innerHTML = VIEWS[id]();
  if(id==='network') renderModeActs(curMode);
  if(id==='overview'){ startSpark(); drawTrend(); }
  if(id==='resources'){ renderRes(); loadResProcs(); }
  if(id==='clients') loadClients();
  if(id==='services') loadServices();
  if(id==='wireless'){ loadWireless(); loadGuest(); }
  if(id==='storage') loadDisks();

  if(id==='led'){ loadLed(); }

function toast(msg){
  let t=document.getElementById('toast');
  if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:200;transition:.3s';document.body.appendChild(t);}
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.opacity='0',1800);
}

];
const GLASS_DEFAULT = GLASS_PRESETS[0].cfg;
let GLASS_THEME = loadGlassTheme();
function _gnum(v,d){ v=parseInt(v,10); return isNaN(v)?d:Math.max(0,Math.min(100,v)); }
function loadGlassTheme(){
  try{
    var o = JSON.parse(sGet('athena_glass_theme')||'null');
    if(o && typeof o.palette==='string' && GLASS_PALETTES[o.palette]){
      return {palette:o.palette, blob:_gnum(o.blob,GLASS_DEFAULT.blob), glass:_gnum(o.glass,GLASS_DEFAULT.glass), blur:_gnum(o.blur,GLASS_DEFAULT.blur), iri:_gnum(o.iri,GLASS_DEFAULT.iri), hi:_gnum(o.hi,GLASS_DEFAULT.hi)};
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(GLASS_DEFAULT));
}
function saveGlassTheme(){
  sSet('athena_glass_theme', JSON.stringify(GLASS_THEME));
  if(athenaRPC.live){
    athenaRPC.exec('athena-theme.sh', ['set', GLASS_THEME.palette, GLASS_THEME.blob, GLASS_THEME.glass, GLASS_THEME.blur, GLASS_THEME.iri, GLASS_THEME.hi]).catch(function(){});
  }
}
function loadThemeFromBackend(){
  if(!athenaRPC.live) return;
  athenaRPC.exec('athena-theme.sh', ['get']).then(function(d){
    if(d && d.ok!==false && GLASS_PALETTES[d.palette]){
      GLASS_THEME = {
        palette: d.palette,
        blob: _gnum(d.blob, GLASS_DEFAULT.blob),
        glass: _gnum(d.glass, GLASS_DEFAULT.glass),
        blur: _gnum(d.blur, GLASS_DEFAULT.blur),
        iri: _gnum(d.iri, GLASS_DEFAULT.iri),
        hi: _gnum(d.hi, GLASS_DEFAULT.hi)
      };
      applyGlassTheme();
    }
  }).catch(function(){});
}
function applyGlassTheme(){
  var t=GLASS_THEME, p=GLASS_PALETTES[t.palette]||GLASS_PALETTES.aurora;
  var dark=document.body.classList.contains('dark');
  var r=document.documentElement;
  r.style.setProperty('--blob-c1', p.c1);
  r.style.setProperty('--blob-c2', p.c2);
  r.style.setProperty('--blob-c3', p.c3);
  var k=t.blob/100;
  r.style.setProperty('--blob-op1', ((dark?0.28:0.5)*k).toFixed(3));
  r.style.setProperty('--blob-op2', ((dark?0.22:0.42)*k).toFixed(3));
  r.style.setProperty('--blob-op3', ((dark?0.18:0.38)*k).toFixed(3));
  r.style.setProperty('--base-grad', 'linear-gradient(165deg,'+(dark?p.baseDark:p.base)+')');
  r.style.setProperty('--glass-alpha', (t.glass/100).toFixed(3));
  r.style.setProperty('--glass-alpha-dark', (t.glass/100*0.95).toFixed(3));
  r.style.setProperty('--glass-blur', t.blur+'px');
  r.style.setProperty('--iri-op', (t.iri/100).toFixed(3));
  r.style.setProperty('--hi-op', (t.hi/100).toFixed(3));
  r.style.setProperty('--hi-op-dark', (t.hi/100*0.09).toFixed(3));
}
function _themeSlider(key,label,val){

function openThemeModal(){
  var t=GLASS_THEME;

    var on = p.cfg.palette===t.palette && p.cfg.blob===t.blob && p.cfg.glass===t.glass && p.cfg.blur===t.blur && p.cfg.iri===t.iri && p.cfg.hi===t.hi;
    return '<button class="theme-preset'+(on?' on':'')+'" onclick="applyThemePreset(\''+p.id+'\')"><span class="tp-ic">'+p.ic+'</span><span class="tp-name">'+p.name+'</span><span class="tp-desc">'+p.desc+'</span></button>';

    return '<div class="swatch'+(t.palette===k?' on':'')+'" style="background:'+bg+'" title="'+p.name+'" onclick="setThemePalette(\''+k+'\')"></div>';

    + '<div class="theme-presets">'+presets+'</div>'

    + _themeSlider('glass','玻璃通透度',t.glass)
    + _themeSlider('blur','模糊强度',t.blur)
    + _themeSlider('iri','虹彩描边',t.iri)
    + _themeSlider('hi','高光强度',t.hi)
    + '<div class="m-foot"><button class="btn" onclick="resetTheme()">恢复默认</button><button class="btn primary" onclick="closeModal()">完成</button></div>';
  document.getElementById('modalBody').classList.add('wide');
  openModal(html);

function updateThemeCfg(key,val){
  val=parseInt(val,10); if(isNaN(val)) return;
  GLASS_THEME[key]=val;
  saveGlassTheme(); applyGlassTheme();
  var el=document.getElementById('tv-'+key);
  if(el) el.textContent = val+(key==='blur'?'px':'%');
  refreshPresetHl();
}
function setThemePalette(k){
  GLASS_THEME.palette=k;
  saveGlassTheme(); applyGlassTheme();
  openThemeModal();
}
function applyThemePreset(id){
  var p=GLASS_PRESETS.find(function(x){return x.id===id;}); if(!p) return;
  GLASS_THEME=JSON.parse(JSON.stringify(p.cfg));
  saveGlassTheme(); applyGlassTheme();
  openThemeModal();
  toast('已应用「'+p.name+'」主题');
}
function resetTheme(){
  GLASS_THEME=JSON.parse(JSON.stringify(GLASS_DEFAULT));
  saveGlassTheme(); applyGlassTheme();
  openThemeModal();
  toast('已恢复默认液态玻璃主题');
}
function refreshPresetHl(){
  var t=GLASS_THEME;
  document.querySelectorAll('.theme-preset').forEach(function(b,i){
    var p=GLASS_PRESETS[i];
    var on = p && p.cfg.palette===t.palette && p.cfg.blob===t.blob && p.cfg.glass===t.glass && p.cfg.blur===t.blur && p.cfg.iri===t.iri && p.cfg.hi===t.hi;
    b.classList.toggle('on', !!on);
  });
}

function loadWireless(){
  if(!athenaRPC.live) return;
  athenaRPC.exec('athena-wireless.sh', ['get']).then(function(d){

    var anyOn = false;

      var w=WIFI_BANDS.find(function(x){return x.id===b.id;}); if(!w) return;
      if(b.on!==undefined) w.on=b.on;
      if(b.ssid!==undefined && b.ssid!=='') w.ssid=b.ssid;
      if(b.ch!==undefined) w.ch=b.ch;
      if(b.bw!==undefined) w.bw=b.bw;
      if(b.enc!==undefined) w.enc=b.enc;
      if(w.on) anyOn=true;

const _selStyle = 'width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:14px;outline:none';
// 端口显示名映射（DSA 端口：lan1-4 千兆，wan 2.5G；其余虚拟接口跳过）
function portDisplayName(name){
  if(name === 'wan') return 'WAN · 2.5G';
  var m = /^lan([1-4])$/.exec(name);
  if(m) return 'LAN '+m[1];
  return null;
}
// 2.5G WAN 口真实数据（status.sh 的 wan.proto + ports[] 里 wan 的 speed/state）
function wanPort(){ return _PORTS.find(function(p){return p.name==='wan';}) || {}; }
function wanProtoName(){ var p=WAN_PROTOS.find(function(x){return x.id===WAN_PROTO;}); return (p&&p.name)||String(WAN_PROTO||'pppoe').toUpperCase(); }
function wanSpeedTxt(){ var s=(+wanPort().speed)||0; return s>0 ? s+' Mbps' : '—'; }
function wanStateTag(){ return wanPort().state==='up' ? '<span class="tag green">已连接</span>' : '<span class="tag gray">未连接</span>'; }
function portMatrixHTML(){
  var order = ['wan','lan1','lan2','lan3','lan4'];
  var byName = {};
  _PORTS.forEach(function(p){ byName[p.name] = p; });
  return order.map(function(n){
    var p = byName[n];
    if(!p) return '<div class="port"><div class="p-name">'+portDisplayName(n)+'</div><div class="p-speed">—</div><div class="p-state"><span class="tag gray">空闲</span></div></div>';
    var up = (p.state === 'up');
    var speed = (+p.speed)||0;
    var speedTxt = speed>0 ? speed+'M' : '—';

function diskRowDisk(disk, isSystem){

    if(mounted){

function loadDisks(){

    hasExternalDisk = EXT_DISKS.length > 0;

/* ========== 流量趋势图 ========== */
let trendRange='day';
// 设备类型 → 拓扑图 emoji
function topoEmoji(type){ return {phone:'📱',pc:'💻',tv:'📺',tablet:'📱',bulb:'💡',speaker:'🔊',cam:'📷'}[type]||'📶'; }
// 家庭网络拓扑：光猫 → 雅典娜 → 真实在线设备（最多 4 个）
function topologyHTML(){
  var clients = (_STATUS && _STATUS.clients) ? _STATUS.clients.filter(function(c){return c.online;}) : [];
  var nodes = clients.slice(0,4).map(function(c){
    var t = guessType(c.vendor || '');
    return { name: (c.hostname||c.ip||c.mac||'设备'), band: (c.band||'有线'), emoji: topoEmoji(t) };
  });
  // 在线设备节点位置（最多4个，2×2 布局）
  var pos = [[290,20],[420,20],[290,110],[420,110]];
  var svg = '<svg width="100%" height="200" viewBox="0 0 600 200">';
  svg += '<defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#9aa0a6" stroke-width="1.5"/></marker></defs>';
  svg += '<line x1="70" y1="100" x2="150" y2="100" stroke="#9aa0a6" stroke-width="1.5" marker-end="url(#arr)"/>';
  svg += '<g><rect x="10" y="80" width="60" height="40" rx="8" fill="#fff" stroke="#9aa0a6" stroke-width="1"/><text x="40" y="104" text-anchor="middle" font-size="12" fill="#5f6368">光猫</text></g>';
  svg += '<g><rect x="150" y="70" width="90" height="60" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/><text x="195" y="96" text-anchor="middle" font-size="13" fill="#0C447C" font-weight="600">雅典娜</text><text x="195" y="116" text-anchor="middle" font-size="11" fill="#185FA5">AX6600</text></g>';
  nodes.forEach(function(n,i){
    var p = pos[i];
    svg += '<line x1="240" y1="100" x2="'+(p[0])+'" y2="'+(p[1]+22)+'" stroke="#d1d5db" stroke-width="1"/>';
    svg += '<g transform="translate('+p[0]+','+p[1]+')" onclick="go(\'clients\')" style="cursor:pointer"><rect x="0" y="0" width="120" height="44" rx="9" fill="#fff" stroke="#e5e7eb"/><circle cx="16" cy="22" r="12" fill="#E6F1FB"/><text x="16" y="27" text-anchor="middle" font-size="11">'+n.emoji+'</text><text x="36" y="19" font-size="12" fill="#1a1a1a">'+n.name.slice(0,10)+'</text><text x="36" y="34" font-size="11" fill="#9aa0a6">'+n.band+'</text></g>';
  });
  if(!nodes.length){
    svg += '<text x="350" y="70" text-anchor="middle" font-size="12" fill="#9aa0a6">暂无在线设备</text>';
  }
  svg += '</svg>';
  return svg;
}
function trendHTML(){
  return '<div class="card"><h3>流量统计 <span class="hint">总流量趋势</span></h3><div class="trend-tabs">'
    + '<button class="trend-tab '+(trendRange==='hour'?'on':'')+'" onclick="pickTrend(\'hour\')">近 24 小时</button>'
    + '<button class="trend-tab '+(trendRange==='day'?'on':'')+'" onclick="pickTrend(\'day\')">近 7 天</button>'
    + '<button class="trend-tab '+(trendRange==='week'?'on':'')+'" onclick="pickTrend(\'week\')">近 30 天</button>'
    + '</div><svg width="100%" height="150" viewBox="0 0 600 150" preserveAspectRatio="none" id="trendSvg"></svg>'
    + '<div class="trend-legend"><span><i style="background:#185FA5"></i>下载</span><span><i style="background:#16a34a"></i>上传</span></div>'
    + '<div id="trendStats" style="display:flex;gap:28px;font-size:13px;color:var(--text2);margin-top:12px;border-top:1px solid var(--border);padding-top:12px;flex-wrap:wrap"></div></div>';
}
function pickTrend(r){
  trendRange=r;
  var tabs=document.querySelectorAll('.trend-tab');
  tabs[0].classList.toggle('on', r==='hour');
  tabs[1].classList.toggle('on', r==='day');
  tabs[2].classList.toggle('on', r==='week');
  drawTrend();
}
function drawTrend(){
  var svg=document.getElementById('trendSvg'); if(!svg) return;
  var n = trendRange==='hour'?24 : trendRange==='day'?7 : 30;
  var data=Array.from({length:n},(_,i)=>({d:25+Math.round(Math.abs(Math.sin(i/3))*280+Math.random()*30), u:6+Math.round(Math.abs(Math.cos(i/2.5))*70+Math.random()*15)}));
  var W=600,H=150,pad=8, max=Math.max.apply(null,data.map(x=>x.d))*1.15;
  var step=W/n;
  var down=data.map((p,i)=>(i===0?'M':'L')+(i*step+step/2).toFixed(1)+','+(H-pad-(p.d/max)*(H-2*pad)).toFixed(1)).join(' ');
  var up=data.map((p,i)=>(i===0?'M':'L')+(i*step+step/2).toFixed(1)+','+(H-pad-(p.u/max)*(H-2*pad)).toFixed(1)).join(' ');
  svg.innerHTML = '<path d="'+down+'" fill="none" stroke="#185FA5" stroke-width="2"></path><path d="'+up+'" fill="none" stroke="#16a34a" stroke-width="2"></path>';
  var peakD=Math.max.apply(null,data.map(x=>x.d)), peakU=Math.max.apply(null,data.map(x=>x.u));
  var sumD=data.reduce((s,x)=>s+x.d,0), sumU=data.reduce((s,x)=>s+x.u,0);
  var factor = trendRange==='hour'?0.32 : trendRange==='day'?2.4 : 10.5;
  var pf=fmtSpeed(peakD), pu=fmtSpeed(peakU);
  var stats=document.getElementById('trendStats');
  if(stats) stats.innerHTML =
    '<span>峰值下载 <b style="color:var(--text)">'+pf.n+' '+pf.u+'</b></span>'
    + '<span>峰值上传 <b style="color:var(--text)">'+pu.n+' '+pu.u+'</b></span>'
    + '<span>总下载 <b style="color:var(--text)">'+(sumD*factor/100).toFixed(1)+' GB</b></span>'
    + '<span>总上传 <b style="color:var(--text)">'+(sumU*factor/100).toFixed(1)+' GB</b></span>';
}

/* ========== 体检报告 ========== */
function renderReport(items){
  const box=document.getElementById('scanList');
  const allOk = items.every(it=>it[1].indexOf('正常')>=0 || it[1].indexOf('在线')>=0);
  const score = allOk? 98 : 82;
  box.innerHTML = '<div class="report"><div class="report-score"><b>'+score+'</b><span>健康度</span></div><div><div class="report-verdict">'+(allOk?'系统状态良好':'存在轻微问题')+'<small>已检查 '+items.length+' 项</small></div></div></div>'

        toast('测速完成：下载 '+fin+' Mbps / 上传 '+fup+' Mbps（'+n.name+'）');
      }
    },200);
    return;
  }
  var dots=0, loader=setInterval(function(){

    var dl=Math.round(parseFloat(r.download_mbps)||0);
    var up=Math.round(parseFloat(r.upload_mbps)||0);
    d.textContent=dl+' Mbps';
    u.textContent=up>0 ? (up+' Mbps') : '—';

    toast('测速完成：下载 '+dl+' Mbps'+(up>0?(' / 上传 '+up+' Mbps'):''));
  }).catch(function(){
    clearInterval(loader);
    if(meta) meta.textContent='测速失败（后端不可达或无网络）';

function downloadBackup(i){
  var b=BACKUPS[i]; if(!b) return;
  if(!athenaRPC.live || !b.file){ toast('已下载 '+b.time+' 的备份'); return; }
  athenaRPC.exec('athena-backup.sh', ['download', b.file]).then(function(r){
    var b64=(r && r.base64) || '';
    if(!b64){ toast('下载失败'); return; }
    var bin=atob(b64);
    var arr=new Uint8Array(bin.length);
    for(var k=0;k<bin.length;k++) arr[k]=bin.charCodeAt(k);
    var blob=new Blob([arr], {type:'application/gzip'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download=b.file; a.click(); a.remove();
    toast('已下载 '+b.file);
  }).catch(function(){ toast('下载失败（后端不可达）'); });
}

let LOGS = [];   // 真实日志由 athena-log.sh list 填充（loadLogs）

function openSyslog(){

function renderLogLines(){

function syslogHTML(){

function setLogFilter(lv){

function clearLog(){

}
function exportLog(){
  var d=new Date(), pad=function(n){return (n<10?'0':'')+n;};
  var fn='AthenaWrt-syslog-'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.log';
  if(!athenaRPC.live){ toast('日志已导出：'+fn); return; }
  athenaRPC.exec('athena-log.sh', ['export']).then(function(r){
    var text = (r && r.base64) ? atob(r.base64) : ((r && r.text) || '');
    if(!text){ toast('导出失败（无日志内容）'); return; }
    var blob = new Blob([text], {type:'text/plain;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = fn;
    document.body.appendChild(a); a.click(); a.remove();

/* ========== 软件包管理（opkg） ========== */
let PKGS = [];   // 真实软件包由 athena-packages.sh 填充（loadPackages）
let PKG_TAB='installed', PKG_QUERY='';
const PKG_TABS=[['installed','已安装'],['available','可用']];
function openPackages(){
  var b=document.getElementById('modalBody');
  b.classList.add('wide');
  b.innerHTML = pkgHTML();
  document.getElementById('modalMask').classList.add('show');
  loadPackages();
}
function pkgFiltered(){
  return PKGS.filter(function(p){
    if(PKG_TAB==='installed' && !p.installed) return false;
    if(PKG_TAB==='available' && p.installed) return false;
    if(PKG_QUERY){ var q=PKG_QUERY.toLowerCase(); if(p.name.toLowerCase().indexOf(q)<0 && p.desc.toLowerCase().indexOf(q)<0) return false; }
    return true;
  });
}
function renderPkgRows(){
  var f=pkgFiltered();
  if(!f.length) return '<div class="pkg-empty">'+(PKG_QUERY?'没有匹配的软件包':'此分类暂无软件包')+'</div>';
  return f.map(function(p){
    var actions;
    if(PKG_TAB==='installed'){
      actions = (p.update?'<button class="btn sm primary" onclick="upgradePkg(\''+p.name+'\')">更新</button>':'') + '<button class="btn sm danger" onclick="removePkg(\''+p.name+'\')">卸载</button>';
    } else {
      actions = '<button class="btn sm primary" onclick="installPkg(\''+p.name+'\')">安装</button>';
    }
    var badge = p.update ? ' <span class="tag amber" style="margin-left:4px">可更新</span>' : '';
    return '<div class="pkg-row"><div class="pkg-info"><div class="pkg-name">'+p.name+badge+'</div><div class="pkg-desc">'+p.desc+'</div></div><div class="pkg-ver">'+p.ver+'</div><div class="pkg-actions">'+actions+'</div></div>';
  }).join('');
}
function pkgHTML(){
  var tabs=PKG_TABS.map(function(t){
    return '<button class="pkg-tab'+(PKG_TAB===t[0]?' on':'')+'" onclick="setPkgTab(\''+t[0]+'\')">'+t[1]+'</button>';
  }).join('');
  return '<h3>软件包管理 <span style="font-weight:400;font-size:12px;color:var(--text3)">apk</span></h3><div class="m-sub">安装、卸载与更新系统软件包</div>'
    + '<div class="pkg-toolbar"><input class="pkg-search" placeholder="搜索软件包名称 / 描述…" oninput="setPkgQuery(this.value)"><div class="pkg-tabs">'+tabs+'</div></div>'
    + '<div class="pkg-list" id="pkgList">'+renderPkgRows()+'</div>'
    + '<div class="m-foot"><button class="btn" onclick="closeModal()">关闭</button><button class="btn sm" onclick="updatePackageList()">更新软件列表</button></div>';
}
function setPkgTab(t){
  PKG_TAB=t;
  var b=document.getElementById('modalBody');
  var tabs=b.querySelectorAll('.pkg-tab');
  PKG_TABS.forEach(function(x,i){ if(tabs[i]) tabs[i].classList.toggle('on', x[0]===t); });
  var list=document.getElementById('pkgList'); if(list) list.innerHTML=renderPkgRows();
  loadPackages(t);
}
function setPkgQuery(q){
  PKG_QUERY=q;
  var list=document.getElementById('pkgList'); if(list) list.innerHTML=renderPkgRows();
}
function installPkg(name){
  if(!athenaRPC.live){ var p0=PKGS.find(function(x){return x.name===name;}); if(p0){p0.installed=true;p0.update=false;} var l0=document.getElementById('pkgList'); if(l0) l0.innerHTML=renderPkgRows(); toast(name+' 安装完成'); return; }
  toast('正在安装 '+name+' …');
  athenaRPC.exec('athena-packages.sh', ['install', name]).then(function(r){
    if(r && r.ok===false){ toast((r&&r.msg)||(name+' 安装失败')); return; }
    toast((r&&r.msg)||(name+' 安装完成'));
    loadPackages();
  }).catch(function(){ toast('安装失败（后端不可达）'); });
}
function removePkg(name){
  var p=PKGS.find(function(x){return x.name===name;}); if(!p) return;
  openModal('<h3 style="color:var(--amber)">卸载软件包</h3><div class="m-sub">确定卸载「'+name+'」吗？卸载后其功能将不可用，可能影响依赖它的服务。</div><div class="m-foot"><button class="btn" onclick="closeModal()">取消</button><button class="btn primary" style="background:var(--amber);border-color:var(--amber)" onclick="confirmRemovePkg(\''+name+'\')">确认卸载</button></div>');
}
function confirmRemovePkg(name){
  if(!athenaRPC.live){ var p0=PKGS.find(function(x){return x.name===name;}); if(p0)p0.installed=false; closeModal(); var l0=document.getElementById('pkgList'); if(l0) l0.innerHTML=renderPkgRows(); toast(name+' 已卸载'); return; }
  closeModal();
  toast('正在卸载 '+name+' …');
  athenaRPC.exec('athena-packages.sh', ['remove', name]).then(function(r){
    if(r && r.ok===false){ toast((r&&r.msg)||(name+' 卸载失败')); return; }
    toast((r&&r.msg)||(name+' 已卸载'));
    loadPackages();
  }).catch(function(){ toast('卸载失败（后端不可达）'); });
}
function upgradePkg(name){
  if(!athenaRPC.live){ var p0=PKGS.find(function(x){return x.name===name;}); if(p0)p0.update=false; var l0=document.getElementById('pkgList'); if(l0) l0.innerHTML=renderPkgRows(); toast(name+' 已更新到最新版本'); return; }
  toast('正在更新 '+name+' …');
  athenaRPC.exec('athena-packages.sh', ['upgrade', name]).then(function(r){
    if(r && r.ok===false){ toast((r&&r.msg)||(name+' 更新失败')); return; }
    toast((r&&r.msg)||(name+' 已更新到最新版本'));
    loadPackages();
  }).catch(function(){ toast('更新失败（后端不可达）'); });
}
function updatePackageList(){
  toast('正在同步软件源，刷新软件列表…');
  if(!athenaRPC.live){ var n0=PKGS.filter(function(p){return p.update;}).length; var l0=document.getElementById('pkgList'); if(l0) l0.innerHTML=renderPkgRows(); toast('软件列表已更新'+(n0?'，'+n0+' 个包可更新':'，均已是最新')); return; }
  athenaRPC.exec('athena-packages.sh', ['update']).then(function(r){
    toast((r && r.msg) || '软件列表已更新');
    loadPackages();
  }).catch(function(){ toast('更新失败（后端不可达或无网络）'); });
}

let sparkData=[];
function startSpark(){
  sparkData=Array.from({length:60},()=>down + Math.random()*120-60);
  if(window._sparkTimer) clearInterval(window._sparkTimer);
  window._sparkTimer=setInterval(tick,2000);
  drawSpark();
}
function drawSpark(){
  const sp=document.getElementById('spark');
  if(sp) sp.setAttribute('d',sparkPath(sparkData));
}
function tick(){
  if(athenaRPC.live){ athenaRPC.syncStatus(applyMetrics); return; }
  down=Math.max(300,down+Math.random()*140-70)|0; up=Math.max(30,up+Math.random()*40-20)|0;
  temp=50+Math.round(Math.random()*4); online=11+Math.round(Math.random()*2);
  cpu=Math.max(5,Math.min(95,cpu+Math.round(Math.random()*12-6)));
  mem=Math.max(20,Math.min(90,mem+Math.round(Math.random()*4-2)));
  applyMetrics();
}
function applyMetrics(){
  const dn=document.getElementById('dn'); if(dn){ var _f=fmtSpeed(down); dn.textContent=_f.n; var _du=document.getElementById('dnUnit'); if(_du)_du.textContent=_f.u; }
  const upEl=document.getElementById('up'); if(upEl){ var _g=fmtSpeed(up); upEl.textContent=_g.n; var _uu=document.getElementById('upUnit'); if(_uu)_uu.textContent=_g.u; }
  const ct=document.getElementById('cpuTemp'); if(ct) ct.textContent=temp;
  renderMetrics();
  const pm=document.getElementById('portMatrix'); if(pm) pm.innerHTML=portMatrixHTML();
  const wpr=document.getElementById('wanProto'); if(wpr) wpr.textContent=wanProtoName();
  const wsp=document.getElementById('wanSpeed'); if(wsp) wsp.innerHTML='<span class="tag">'+wanSpeedTxt()+'</span>';
  const wst=document.getElementById('wanState'); if(wst) wst.innerHTML=wanStateTag();
  const tb=document.getElementById('topoBox'); if(tb) tb.innerHTML=topologyHTML();
  const scb=document.getElementById('sysCpuBar'); if(scb) scb.style.width=cpu+'%';
  const stb=document.getElementById('sysCpuText'); if(stb) stb.textContent=cpu+'%';
  const smb=document.getElementById('sysMemBar'); if(smb) smb.style.width=mem+'%';
  const smt=document.getElementById('sysMemText'); if(smt) smt.textContent=mem+'%';
  const rcn=document.getElementById('resCpuNum'); if(rcn) rcn.innerHTML=cpu+'<span class="speed-unit">%</span>';
  const rmn=document.getElementById('resMemNum'); if(rmn) rmn.innerHTML=mem+'<span class="speed-unit">%</span>';
  sparkData.push(down); sparkData.shift();
  const sp=document.getElementById('spark'); if(sp) sp.setAttribute('d',sparkPath(sparkData));
}
function sparkPath(d){
  const max=Math.max(...d)*1.1, min=Math.min(...d)*0.9;
  return d.map((v,i)=>`${i===0?'M':'L'}${(i/(d.length-1)*300).toFixed(1)},${(70-(v-min)/(max-min)*60).toFixed(1)}`).join(' ');
}

function init(){
  document.getElementById('nav').innerHTML=navHTML();
  document.getElementById('mnavInner').innerHTML=mnavHTML();
  renderNotif();
  var _up2=document.getElementById('unitPill'); if(_up2) _up2.textContent=SPEED_UNIT;
  if(sGet('athena_theme')==='dark'){ document.body.classList.add('dark'); updateThemeIcon(true); }
  loadThemeFromBackend();
  if(athenaRPC.live){ loadDisks(); loadWireless(); loadClients(); loadGuest(); loadAutoBackup(); }
  go('overview');
  const clock=()=>{const c=document.getElementById('clock'); if(c) c.textContent=new Date().toTimeString().slice(0,5);};
  clock(); setInterval(clock,1000);
  tick();
}

/* ========== 设置向导 ========== */
let wizStep = 0, wizMode = 'router', wizProto = 'pppoe';
const WIZ_META = [
  {title:'欢迎使用 AthenaWrt', sub:'1 分钟完成基础设置，即可开始使用'},
  {title:'选择上网方式', sub:'选择组网模式并完成对应配置'},
  {title:'设置完成', sub:'雅典娜已准备就绪，开始畅享极速网络'}
];
const WIZ_MODES = NET_MODES;
// 向导第 2 步：每种组网模式都有对应的配置表单（与网络组网页一致）
function wizModeForm(){
  if(wizMode==='router'){
    return '<div class="field" style="margin-top:14px"><label>连接类型</label><select onchange="wizProto=this.value" style="'+_selStyle+'">'+WAN_PROTOS.map(p=>`<option value="${p.id}"${wizProto===p.id?' selected':''}>${p.name}</option>`).join('')+'</select></div>'
      + (wizProto==='pppoe' ? '<div class="limit-row"><div><label>宽带账号</label><input value="'+WAN_USER+'" onchange="WAN_USER=this.value"></div><div><label>宽带密码</label><input type="password" value="'+WAN_PWD+'" onchange="WAN_PWD=this.value"></div></div>' : '')
      + (wizProto==='dhcp' ? '<div style="font-size:12px;color:var(--text3)">光猫拨号，雅典娜自动获取 IP，无需填写。</div>' : '')
      + (wizProto==='static' ? '<div class="limit-row"><div><label>IP 地址</label><input value="192.168.1.2"></div><div><label>子网掩码</label><input value="255.255.255.0"></div></div><div class="limit-row"><div><label>网关</label><input value="192.168.1.1"></div><div><label>DNS</label><input value="223.5.5.5"></div></div>' : '');
  }
  if(wizMode==='ap'){
    return '<div class="field" style="margin-top:14px"><label>桥接方式</label><select onchange="AP_LINK=this.value" style="'+_selStyle+'"><option value="wireless"'+(AP_LINK==='wireless'?' selected':'')+'>无线桥接</option><option value="wired"'+(AP_LINK==='wired'?' selected':'')+'>有线桥接</option></select></div>'
      + (AP_LINK==='wireless' ? '<div class="limit-row"><div><label>主路由 SSID</label><input value="'+AP_SSID+'" onchange="AP_SSID=this.value"></div><div><label>主路由密码</label><input type="password" value="'+AP_PWD+'" onchange="AP_PWD=this.value"></div></div>' : '')
      + '<div class="field"><label>本机管理 IP（与主路由同网段）</label><input value="'+AP_IP+'" onchange="AP_IP=this.value"></div>';
  }
  if(wizMode==='single'){
    return '<div class="limit-row" style="margin-top:14px"><div><label>上网 VLAN ID（光猫 Internet VLAN）</label><input value="'+VLAN_LAN+'" onchange="VLAN_LAN=this.value"></div><div><label>回传 VLAN ID（留空关闭）</label><input value="'+RETURN_VLAN+'" onchange="RETURN_VLAN=this.value"></div></div>'
      + '<div style="font-size:12px;color:var(--text3)">VLAN ID 以光猫超管后台（网络 → VLAN 绑定）为准，两侧必须一致；IPTV VLAN 可稍后在「网络组网」中配置。</div>';
  }
  return '<div class="limit-row" style="margin-top:14px"><div><label>本机管理 IP</label><input value="'+BYPASS_IP+'" onchange="BYPASS_IP=this.value"></div><div><label>网关（指向主路由）</label><input value="'+BYPASS_GW+'" onchange="BYPASS_GW=this.value"></div></div>'
    + '<div class="field"><label>DNS</label><input value="'+BYPASS_DNS+'" onchange="BYPASS_DNS=this.value"></div>'
    + '<div style="font-size:12px;color:var(--text3)">旁路由模式下 NSS 硬件加速将自动关闭。</div>';
}
function showWizard(){ wizStep=0; document.getElementById('wizard').classList.add('show'); renderWizard(); }
function renderWizard(){
  if(wizStep<0) wizStep=0;
  if(wizStep>WIZ_META.length-1) wizStep=WIZ_META.length-1;
  document.getElementById('wsteps').innerHTML = WIZ_META.map((_,i)=>`<div class="wstep ${i<wizStep?'done':i===wizStep?'active':''}"></div>`).join('');
  document.getElementById('wprev').style.visibility = wizStep===0?'hidden':'visible';
  document.getElementById('wnext').textContent = wizStep===WIZ_META.length-1?'完成':'下一步';
  const m = WIZ_META[wizStep], body = document.getElementById('wbody');
  if(wizStep===0){
    body.innerHTML = `<h2>${m.title}</h2><div class="sub">${m.sub}</div>
      <div class="opt sel"><div class="o-ic">🛡</div><div><div class="o-name">AthenaWrt 专属体验</div><div class="o-desc">硬件加速 NSS · 三频全开 · 点阵屏 · 产品级界面</div></div></div>
      <div class="opt"><div class="o-ic">🌐</div><div><div class="o-name">京东云雅典娜 AX6600</div><div class="o-desc">IPQ6010 · 1GB 内存 · 128GB eMMC</div></div></div>`;
  } else if(wizStep===1){
    body.innerHTML = `<h2>${m.title}</h2><div class="sub">${m.sub}</div>` + WIZ_MODES.map(o=>`
      <div class="opt ${wizMode===o.id?'sel':''}" onclick="pickWizMode('${o.id}')">
        <div class="o-ic">${o.ic}</div><div><div class="o-name">${o.name}</div><div class="o-desc">${o.desc}</div></div>
      </div>`).join('')
    + '<div style="margin-top:14px;border-top:1px solid var(--border);padding-top:4px">'+wizModeForm()+'</div>';
  } else {
    body.innerHTML = `<h2>${m.title}</h2><div class="sub">${m.sub}</div>
      <div class="opt sel"><div class="o-ic">✅</div><div><div class="o-name">配置已就绪</div><div class="o-desc">上网方式：${WIZ_MODES.find(x=>x.id===wizMode).name}${wizMode==='router'?'（'+WAN_PROTOS.find(x=>x.id===wizProto).name+'）':''}</div></div></div>
      <div class="opt"><div class="o-ic">📶</div><div><div class="o-name">默认无线网络</div><div class="o-desc">Athena-2.4G / Athena-5G-Game / Athena-5G · 密码 12345678，可稍后在「无线三频」中修改</div></div></div>`;
  }
}
function pickWizMode(id){ wizMode=id; renderWizard(); }
function wPrev(){ if(wizStep>0){ wizStep--; renderWizard(); } }
function wNext(){
  if(wizStep<WIZ_META.length-1){ wizStep++; renderWizard(); }
  else { sSet('athena_wizard_done','1'); document.getElementById('wizard').classList.remove('show'); showApp(); }
}
</script>
